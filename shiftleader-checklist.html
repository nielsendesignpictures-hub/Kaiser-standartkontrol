<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaiser – Kitchen Shift Report</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f4f5f2; --ink:#18201d; --muted:#737b76; --line:#e3e7e3;
      --green:#176b57; --green2:#e5f1ed; --gold:#d6b24a;
      --amber:#b36b16; --amberSoft:#f8efdf; --red:#b64b43; --redSoft:#f8e8e6;
    }
    *{box-sizing:border-box}
    .hidden{display:none!important}
    body{margin:0;padding:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-tap-highlight-color:transparent}

    .shell{max-width:1180px;margin:0 auto;padding:0.875rem 1.25rem 7.5rem}

    .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;padding:0.25rem 0 0.75rem}
    .kicker{font-size:0.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
    .title{font-size:1.625rem;font-weight:800;letter-spacing:-.04em;margin-top:2px}
    .version{font-size:0.75rem;font-weight:700;color:var(--muted)}

    .panel{margin-top:0.75rem;background:#fff;border:1px solid var(--line);border-radius:1.125rem;box-shadow:0 1px 0 rgba(24,32,29,.04);overflow:hidden}
    .panelHead{padding:0 1.125rem;min-height:3.25rem;display:flex;align-items:center;border-bottom:1px solid var(--line)}
    .panelBody{padding:1rem 1.125rem 1.125rem}
    .blockTitle{font-size:0.8125rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:0.5rem}
    .blockTitle::before{content:"";width:0.5rem;height:0.5rem;border-radius:50%;background:var(--green)}
    .pill{display:inline-flex;align-items:center;min-height:2rem;padding:0 0.875rem;border-radius:62.4375rem;font-size:0.75rem;font-weight:800;letter-spacing:.1em}
    .pill-blue{background:var(--ink);color:#fff}

    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0.875rem}
    /* sektioner side om side på brede skærme */
    .panelBody:has(> .sectionCard){display:grid;grid-template-columns:repeat(auto-fit,minmax(20rem,1fr));gap:0.75rem}
    @media (max-width:760px){ .grid2{grid-template-columns:1fr} }

    .field{display:flex;flex-direction:column}
    .sectionCard{border:1px solid var(--line);background:#fff;border-radius:1rem;padding:1rem;margin:0;transition:box-shadow .2s}

    .label{font-size:0.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:0.5rem;display:block}
    .input,.select,.textarea{width:100%;border-radius:0.875rem;border:1.5px solid var(--line);background:#f7f8f6;color:var(--ink);padding:0 1rem;min-height:3.5rem;font-size:1.125rem;font-weight:600;font-family:inherit;outline:none}
    .select{appearance:none;-webkit-appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 1.375rem) 50%,calc(100% - 1rem) 50%;background-size:0.375rem 0.375rem;background-repeat:no-repeat;padding-right:2.5rem}
    .input[readonly]{background:#eef1ee;color:var(--muted)}
    .textarea{min-height:6.5rem;padding:0.875rem 1rem;resize:vertical;font-size:1.0625rem;font-weight:500;line-height:1.45}
    .input:focus,.select:focus,.textarea:focus{border-color:var(--green);background:#fff;box-shadow:0 0 0 4px rgba(23,107,87,.12)}

    .ratingWrap{display:grid;grid-template-columns:repeat(5,1fr);gap:0.5rem;margin:0.25rem 0 0}
    .ratingBtn{min-height:4rem;border-radius:0.875rem;border:1.5px solid var(--line);background:#f7f8f6;color:var(--ink);font-size:1.5rem;font-weight:800;cursor:pointer;font-family:inherit;transition:transform .08s}
    .ratingBtn.selected{background:var(--green);border-color:var(--green);color:#fff}
    .ratingBtn:active,.statusChip:active,.btn:active{transform:scale(.97)}

    .statusLine{padding:0.875rem 1rem;border-radius:0.875rem;border:1px solid var(--line);background:#f7f8f6;font-weight:700;font-size:0.9375rem}
    .statusLine.good{background:var(--green2);border-color:#c6ddd4;color:var(--green)}
    .statusLine.warn{background:var(--amberSoft);border-color:#ead6b6;color:var(--amber)}
    .statusMeta{margin-top:0.5rem;font-size:0.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
    .statusProgress{height:0.5rem;background:rgba(24,32,29,.08);border-radius:62.4375rem;margin-top:0.625rem;overflow:hidden}
    .statusBar{height:100%;background:var(--green);width:0%;border-radius:62.4375rem;transition:width .3s ease}
    .statusMissing{margin-top:0.625rem;display:flex;flex-wrap:wrap;gap:0.5rem}
    .statusChip{min-height:2.75rem;padding:0 1rem;border-radius:62.4375rem;background:#fff;border:1px solid #ead6b6;color:var(--amber);font-size:0.875rem;font-weight:800;cursor:pointer;font-family:inherit}

    .fieldPulse{animation:pulseOutline .9s ease}
    @keyframes pulseOutline{0%{box-shadow:0 0 0 0 rgba(182,75,67,0)}30%{box-shadow:0 0 0 5px rgba(182,75,67,.25)}100%{box-shadow:0 0 0 0 rgba(182,75,67,0)}}

    .actionsSticky{position:fixed;bottom:0;left:0;right:0;background:rgba(244,245,242,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:0.75rem 1.25rem 1rem;z-index:100}
    .actionsInner{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:0.75rem}
    .btn{min-height:4rem;border:0;border-radius:0.875rem;font-size:1.125rem;font-weight:800;cursor:pointer;font-family:inherit;transition:transform .08s ease,opacity .15s}
    .btn:disabled{opacity:.6;cursor:default}
    .btn-dark{background:#fff;color:var(--ink);border:1px solid var(--line)}
    .btn-gold{background:var(--green);color:#fff}

    .successScreen{text-align:center;padding:2.5rem 1.5rem}
    .successTitle{font-size:1.625rem;font-weight:800;letter-spacing:-.03em}
    .successText{margin-top:0.5rem;color:var(--muted);font-size:1rem;font-weight:600}
    .successIcon{width:4.5rem;height:4.5rem;margin:0 auto 1rem;background:var(--green2);color:var(--green);border-radius:50%;font-size:2rem;font-weight:800;display:flex;align-items:center;justify-content:center}
    @media (max-width:700px){ .actionsInner{grid-template-columns:1fr} .btn{min-height:3.5rem} }
  </style>
</head>

<body>
  <div class="shell">

    <header class="hero">
      <div>
        <div class="kicker">Kaiser kitchen</div>
        <div class="title">Kitchen Shift Report</div>
      </div>
      <div class="version">v1.1 · Daily summary</div>
    </header>

    <section id="formWrap">
      <form id="reportForm" method="POST" action="https://script.google.com/macros/s/AKfycbzTS-3fHw1nTVPAvzEP5ZDGD4Djn3TDBFEiP2t1VVACJM6s7uB-Ukm-eh4IPP01FyFALw/exec">
        <input type="hidden" name="_subject" id="subjectField">
        <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
        <input type="hidden" name="reportType" value="kitchen">

        <!-- Status -->
        <div class="panel">
          <div class="panelHead">
            <div class="pill pill-blue">STATUS</div>
          </div>
          <div class="panelBody">
            <div id="statusLine" class="statusLine warn">
              <div id="statusText">Status: —</div>
              <div class="statusProgress"><div id="statusBar" class="statusBar"></div></div>
              <div id="statusMeta" class="statusMeta"></div>
              <div id="statusMissing" class="statusMissing"></div>
            </div>
          </div>
        </div>

        <!-- Basic Information -->
        <div class="panel">
          <div class="panelHead"><div class="blockTitle">Basic Information</div></div>
          <div class="panelBody grid2">
            <div class="field" id="cardDepartment">
              <label class="label" for="department">Location</label>
              <select class="select" id="department" name="Location" required>
                <option value="">Select location...</option>
                <option>Café Kaiser Helsingør</option>
                <option>Café Kaiser Hillerød</option>
                <option>Café Kaiser Farum</option>
                <option>Café Kaiser Hørsholm</option>
                <option>Café Kaiser Vanløse</option>
                <option>Café Kaiser Enghavebrygge</option>
                <option>Café Kaiser Sydhavnen</option>
                <option>Café Kaiser Waves</option>
                <option>Café Kaiser Nørrebro</option>
              </select>
            </div>
            <div class="field">
              <label class="label" for="dateField">Date & Time</label>
              <input class="input" id="dateField" name="Date & Time" readonly>
            </div>
          </div>
        </div>

        <!-- Chef & Performance -->
        <div class="panel">
          <div class="panelHead"><div class="blockTitle">Chef & Performance</div></div>
          <div class="panelBody">
            <div class="sectionCard" id="cardChefName">
              <label class="label" for="chefName">Chef Name</label>
              <input class="input" id="chefName" name="Chef Name" required>
            </div>

            <div class="sectionCard" id="cardDayRating">
              <label class="label">Rate the Day</label>
              <div class="ratingWrap">
                <button type="button" class="ratingBtn" data-target="dayRating" data-value="1/5">1</button>
                <button type="button" class="ratingBtn" data-target="dayRating" data-value="2/5">2</button>
                <button type="button" class="ratingBtn" data-target="dayRating" data-value="3/5">3</button>
                <button type="button" class="ratingBtn" data-target="dayRating" data-value="4/5">4</button>
                <button type="button" class="ratingBtn" data-target="dayRating" data-value="5/5">5</button>
              </div>
              <input type="hidden" id="dayRating" name="Day Rating">
            </div>

            <div class="sectionCard" id="cardRevenue">
              <label class="label" for="revenue">Daily Revenue (DKK)</label>
              <input class="input" id="revenue" name="Daily Revenue" inputmode="decimal" required>
            </div>
          </div>
        </div>

        <!-- Operations -->
        <div class="panel">
          <div class="panelHead"><div class="blockTitle">Operations</div></div>
          <div class="panelBody">
            <div class="sectionCard" id="cardMise">
              <label class="label" for="miseStatus">Mise en Place Done?</label>
              <select class="select" id="miseStatus" name="Mise en Place Done" required>
                <option value="">Select...</option>
                <option>Yes</option>
                <option>No</option>
              </select>
              <label class="label" for="miseComment" style="margin-top:16px;">Comment / Missing</label>
              <textarea class="textarea" id="miseComment" name="Mise Comment"></textarea>
            </div>

            <div class="sectionCard" id="cardCleaning">
              <label class="label" for="cleaningStatus">Cleaning Done?</label>
              <select class="select" id="cleaningStatus" name="Cleaning Done" required>
                <option value="">Select...</option>
                <option>Yes</option>
                <option>No</option>
              </select>
              <label class="label" for="cleaningMissing" style="margin-top:16px;">Missing</label>
              <textarea class="textarea" id="cleaningMissing" name="Cleaning Missing"></textarea>
            </div>
          </div>
        </div>

        <!-- Team -->
        <div class="panel">
          <div class="panelHead"><div class="blockTitle">Team</div></div>
          <div class="panelBody">
            <div class="sectionCard" id="cardTeamRating">
              <label class="label">Teamwork Rating</label>
              <div class="ratingWrap">
                <button type="button" class="ratingBtn" data-target="teamRating" data-value="1/5">1</button>
                <button type="button" class="ratingBtn" data-target="teamRating" data-value="2/5">2</button>
                <button type="button" class="ratingBtn" data-target="teamRating" data-value="3/5">3</button>
                <button type="button" class="ratingBtn" data-target="teamRating" data-value="4/5">4</button>
                <button type="button" class="ratingBtn" data-target="teamRating" data-value="5/5">5</button>
              </div>
              <input type="hidden" id="teamRating" name="Teamwork Rating">
            </div>
          </div>
        </div>

        <!-- Notes -->
        <div class="panel">
          <div class="panelHead"><div class="blockTitle">Daily Notes</div></div>
          <div class="panelBody">
            <div class="sectionCard">
              <label class="label" for="dailyFeedback">Daily Feedback</label>
              <textarea class="textarea" id="dailyFeedback" name="Daily Feedback"></textarea>
            </div>
            <div class="sectionCard">
              <label class="label" for="errorsIssues">Errors & Issues</label>
              <textarea class="textarea" id="errorsIssues" name="Errors & Issues"></textarea>
            </div>
          </div>
        </div>

      </form>
    </section>

    <!-- SUCCESS -->
    <section id="thanksWrap" class="hidden">
      <div class="panel">
        <div class="panelBody successScreen">
          <div class="successIcon">✓</div>
          <div class="successTitle">Report Submitted</div>
          <div class="successText">Kitchen Shift Report has been sent successfully.</div>
          <button id="newReportBtn" class="btn btn-gold" style="margin-top:24px; width:100%;">Start New Report</button>
        </div>
      </div>
    </section>

  </div>

  <!-- STICKY BUTTONS -->
  <div class="actionsSticky" id="actionsSticky">
    <div class="actionsInner">
      <button id="secondaryAction" class="btn btn-dark" type="button">Reset</button>
      <button id="primaryAction" class="btn btn-gold" type="button">Submit Kitchen Report</button>
    </div>
  </div>

<script>
/* ==================== ENGINE ==================== */
const STORAGE_KEY = "kaiser_kitchen_v1";
const BASE_URL = "https://nielsendesignpictures-hub.github.io/Kaiser-standartkontrol/kitchen-shift-report.html";
const SUBMIT_LABEL = "Submit Kitchen Report";

function $(id){ return document.getElementById(id); }
function val(id){ const el = $(id); return el ? (el.value || "").trim() : ""; }
function setVal(id, v){ const el = $(id); if(el) el.value = v || ""; }

function store(fn){ try { return fn(); } catch(e){ return null; } }

function nowLocalString(){ return new Date().toLocaleString("da-DK"); }
function localISODate(){
  const d = new Date();
  const local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return local.toISOString().slice(0,10);
}

function updateSubject(){
  const loc = val("department") || "Location";
  $("subjectField").value = `Kitchen Shift Report – ${loc} – ${localISODate()}`;
}

function requiredFields(){
  return [
    {id:"department", label:"Location", anchor:"cardDepartment"},
    {id:"chefName", label:"Chef Name", anchor:"cardChefName"},
    {id:"dayRating", label:"Day Rating", anchor:"cardDayRating"},
    {id:"revenue", label:"Daily Revenue", anchor:"cardRevenue"},
    {id:"miseStatus", label:"Mise en Place", anchor:"cardMise"},
    {id:"cleaningStatus", label:"Cleaning", anchor:"cardCleaning"},
    {id:"teamRating", label:"Teamwork Rating", anchor:"cardTeamRating"}
  ];
}

function updateStatusLine(){
  const req = requiredFields();
  const filled = req.filter(f => !!val(f.id)).length;
  const pct = Math.round((filled / req.length) * 100);
  const missing = req.filter(f => !val(f.id));

  $("statusBar").style.width = pct + "%";
  $("statusMeta").textContent = `${filled}/${req.length} fields · ${pct}%`;

  const box = $("statusMissing");
  box.innerHTML = "";

  if(missing.length === 0){
    $("statusLine").classList.add("good");
    $("statusLine").classList.remove("warn");
    $("statusText").textContent = "Status: Ready to submit";
    box.classList.add("hidden");
    return;
  }

  $("statusLine").classList.add("warn");
  $("statusLine").classList.remove("good");
  $("statusText").textContent = missing.length === 1
    ? `Missing – ${missing[0].label}`
    : `Missing – ${missing.length} fields`;

  box.classList.remove("hidden");
  box.innerHTML = missing.map(f =>
    `<button type="button" class="statusChip" data-anchor="${f.anchor}">${f.label}</button>`
  ).join("");
}

function scrollToField(anchor){
  const el = $(anchor);
  if(!el) return;
  el.scrollIntoView({behavior:"smooth", block:"center"});
  el.classList.add("fieldPulse");
  setTimeout(()=>el.classList.remove("fieldPulse"), 800);
}

$("statusMissing").addEventListener("click", e => {
  const btn = e.target.closest(".statusChip");
  if(btn) scrollToField(btn.dataset.anchor);
});

function bindRatings(){
  document.querySelectorAll(".ratingBtn").forEach(btn => {
    btn.addEventListener("click", () => {
      const target = btn.dataset.target;
      setVal(target, btn.dataset.value);

      document.querySelectorAll(`[data-target="${target}"]`).forEach(b =>
        b.classList.toggle("selected", b.dataset.value === btn.dataset.value)
      );

      saveDraft();
      updateStatusLine();
    });
  });
}

function saveDraft(){
  const data = {};
  document.querySelectorAll("input,select,textarea").forEach(el => {
    if(el.id && el.id !== "dateField" && el.id !== "subjectField") data[el.id] = el.value;
  });
  data.savedDate = new Date().toDateString();
  store(() => localStorage.setItem(STORAGE_KEY, JSON.stringify(data)));
}

function loadDraft(){
  $("dateField").value = nowLocalString();
  updateSubject();

  const raw = store(() => localStorage.getItem(STORAGE_KEY));
  if(!raw) return;
  try {
    const data = JSON.parse(raw);
    if(data.savedDate !== new Date().toDateString()){
      store(() => localStorage.removeItem(STORAGE_KEY));
      return;
    }
    Object.keys(data).forEach(k => { if(k !== "savedDate" && $(k)) $(k).value = data[k]; });
    document.querySelectorAll(".ratingBtn").forEach(btn => {
      if(val(btn.dataset.target) === btn.dataset.value) btn.classList.add("selected");
    });
    updateSubject();
  } catch(e){}
}

function bindAutosave(){
  document.querySelectorAll("input,select,textarea").forEach(el => {
    const handler = () => { saveDraft(); updateStatusLine(); if(el.id==="department") updateSubject(); };
    el.addEventListener("input", handler);
    el.addEventListener("change", handler);
  });
}

function resetAll(){
  document.querySelectorAll("input,select,textarea").forEach(el => {
    if(el.type !== "hidden" && el.id !== "dateField" && el.name !== "_honey") el.value = "";
  });
  setVal("dayRating", "");
  setVal("teamRating", "");
  document.querySelectorAll(".ratingBtn").forEach(b => b.classList.remove("selected"));
  store(() => localStorage.removeItem(STORAGE_KEY));
  $("dateField").value = nowLocalString();
  updateSubject();
  updateStatusLine();
}

$("secondaryAction").addEventListener("click", () => {
  if(confirm("Reset entire report?")) resetAll();
});


// Sender rapporten. Kan svaret ikke læses (netværk/CORS), sendes én gang mere uden at læse svaret –
// scriptet har en dublet-spærre, så der aldrig går to mails afsted.
async function postReport(form){
  try {
    const response = await fetch(form.action, { method: "POST", body: new FormData(form) });
    return await response.text();
  } catch (e) {
    console.warn("Svar kunne ikke læses, prøver igen uden svar:", e);
    await fetch(form.action, { method: "POST", body: new FormData(form), mode: "no-cors" });
    return "SUCCESS";
  }
}

let sending = false;

$("primaryAction").addEventListener("click", async () => {

  if(sending) return;               // stop double sending

  const missing = requiredFields().filter(f => !val(f.id));

  if(missing.length){
    updateStatusLine();
    scrollToField(missing[0].anchor);
    return;
  }

  sending = true;
  updateSubject();
  $("dateField").value = nowLocalString();

  $("primaryAction").disabled = true;
  $("primaryAction").textContent = "Sending...";

  try {

    const result = await postReport($("reportForm"));

    if(result.includes("SUCCESS")){
      store(() => localStorage.removeItem(STORAGE_KEY));
      window.location.href = BASE_URL + "?sent=1";
      return;
    }

    throw new Error("Submit failed: " + result.slice(0, 200));

  } catch(err){

    console.error(err);

    alert("Report could not be sent. Please wait a minute and press the button once more. If it still fails, contact management.\n\nReason: " + (err && err.message ? err.message : err));

    sending = false;
    $("primaryAction").disabled = false;
    $("primaryAction").textContent = SUBMIT_LABEL;
  }

});

$("newReportBtn").addEventListener("click", () => {
  resetAll();
  window.location.href = BASE_URL;
});

const params = new URLSearchParams(window.location.search);
if(params.get("sent") === "1"){
  $("formWrap").classList.add("hidden");
  $("thanksWrap").classList.remove("hidden");
  $("actionsSticky").classList.add("hidden");
  store(() => localStorage.removeItem(STORAGE_KEY));
}

bindRatings();
bindAutosave();
loadDraft();
updateStatusLine();
</script>
</body>
</html>
