<!doctype html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Kaiser – Dagsansvarlig Tjekliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0a0e14;
  --bg1:#111823;
  --line:rgba(255,255,255,0.10);
  --line2:rgba(255,255,255,0.07);
  --text:rgba(255,255,255,0.97);
  --muted:rgba(255,255,255,0.72);
  --muted2:rgba(255,255,255,0.48);
  --gold:#d6b24a;
  --green:#62d26f;
  --warn:#f59e0b;
  --blue:#5ea7ff;
  --red:#ff6b6b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  font-family:Inter,system-ui,sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 700px at 15% -10%, rgba(214,178,74,0.07), transparent 55%),
    radial-gradient(1000px 650px at 100% 0%, rgba(94,167,255,0.07), transparent 55%),
    linear-gradient(180deg, var(--bg0), var(--bg1) 60%, var(--bg0));
  background-attachment:fixed;
  padding:12px 14px 40px;
  -webkit-tap-highlight-color:transparent;
}
.shell{max-width:1200px;margin:0 auto;}

/* ---------- KOMPAKT HEADER ---------- */
.head{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;padding:6px 4px 14px;
}
.brandKicker{
  font-size:10px;font-weight:900;letter-spacing:.24em;
  text-transform:uppercase;color:var(--muted2);
}
.brandTitle{
  font-family:"Playfair Display",serif;font-size:26px;
  line-height:1;letter-spacing:-.02em;margin-top:4px;
}
.headMeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.chip{
  padding:11px 16px;border-radius:999px;font-size:13px;font-weight:800;
  border:1px solid var(--line);background:rgba(255,255,255,0.05);
  color:var(--muted);cursor:pointer;transition:.15s;white-space:nowrap;
}
.chip:hover{background:rgba(255,255,255,0.09);}
.chip.empty{border-color:rgba(245,158,11,.40);background:rgba(245,158,11,.10);color:#ffd88a;}

/* ---------- OPSÆTNING (foldes væk) ---------- */
.setup{
  display:none;margin-bottom:14px;padding:16px;
  border-radius:20px;border:1px solid var(--line);
  background:rgba(255,255,255,0.04);
}
.setup.open{display:block;}
.setupGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:820px){.setupGrid{grid-template-columns:1fr;}}
.label{
  font-size:10px;font-weight:900;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted2);display:block;margin-bottom:7px;
}
.input,.select{
  width:100%;border-radius:14px;border:1px solid rgba(255,255,255,0.13);
  background:rgba(255,255,255,0.05);color:var(--text);
  padding:15px 14px;outline:none;font-size:16px;font-weight:700;font-family:inherit;
}
.select option{background:#111823;color:#fff;}
.input:focus,.select:focus{
  border-color:rgba(214,178,74,0.5);box-shadow:0 0 0 4px rgba(214,178,74,0.12);
}

/* ---------- FANER ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.tab{
  min-height:78px;padding:14px 18px;border-radius:20px;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,0.04);
  color:var(--text);font-family:inherit;text-align:left;
  display:flex;flex-direction:column;justify-content:center;gap:5px;
  transition:.15s;
}
.tab:hover{background:rgba(255,255,255,0.07);}
.tab.on{
  border-color:rgba(214,178,74,0.48);
  background:linear-gradient(135deg,rgba(214,178,74,.14),rgba(94,167,255,.07));
  box-shadow:0 0 0 4px rgba(214,178,74,0.08);
}
.tabName{font-size:19px;font-weight:900;letter-spacing:-.01em;}
.tabMeta{font-size:12px;font-weight:800;color:var(--muted2);}
.tabMeta.done{color:var(--green);}
.tabMeta.attn{color:var(--warn);}

/* ---------- STATUSLINJE ---------- */
.statusBar{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px 18px;border-radius:18px;
  border:1px solid var(--line);background:rgba(255,255,255,0.04);
}
.statusBig{font-size:17px;font-weight:900;white-space:nowrap;}
.statusBig.ready{color:var(--green);}
.statusBig.attn{color:var(--warn);}
.bar{
  flex:1;min-width:160px;height:10px;border-radius:999px;overflow:hidden;
  background:rgba(255,255,255,0.07);border:1px solid var(--line2);
}
.barFill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--green));transition:width .25s;}
.barFill.attn{background:linear-gradient(90deg,var(--warn),var(--red));}
.counts{font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap;}
.counts b{color:var(--text);}

.purpose{
  padding:14px 18px 4px;font-size:13px;
  font-weight:700;color:var(--muted2);line-height:1.5;
}
.purpose strong{color:var(--gold);font-weight:900;}

/* ---------- TJEKLISTE ---------- */
.catTitle{
  font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted2);margin:22px 4px 12px;
  padding-bottom:10px;border-bottom:1px solid var(--line2);
}
.item{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:18px 20px;border-radius:18px;margin-bottom:12px;
  border:1px solid var(--line);background:rgba(255,255,255,0.045);
  border-left:4px solid transparent;transition:.15s;
}
.item.ok{border-left-color:var(--green);background:rgba(98,210,111,0.06);}
.item.mangler{border-left-color:var(--warn);background:rgba(245,158,11,0.08);}
.item.na{border-left-color:var(--blue);background:rgba(94,167,255,0.05);opacity:.72;}
.item.ok .itemText,.item.na .itemText{opacity:.75;}

.itemText{flex:1;min-width:260px;font-size:17px;font-weight:800;line-height:1.45;}

.btns{display:flex;gap:10px;flex-wrap:wrap;}
.sBtn{
  min-height:58px;min-width:112px;padding:12px 20px;border-radius:15px;
  border:1px solid rgba(255,255,255,0.13);background:rgba(255,255,255,0.05);
  color:var(--text);font-family:inherit;
  font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;
  cursor:pointer;transition:.15s;
}
.sBtn:hover{background:rgba(255,255,255,0.10);}
.sBtn:active{transform:scale(.97);}
.sBtn.ok.on{background:rgba(98,210,111,0.22);border-color:rgba(98,210,111,0.55);color:#e7ffe9;}
.sBtn.warn.on{background:rgba(245,158,11,0.22);border-color:rgba(245,158,11,0.55);color:#fff0c7;}
.sBtn.na.on{background:rgba(94,167,255,0.20);border-color:rgba(94,167,255,0.50);color:#e4efff;}

.note{width:100%;display:none;}
.note.show{display:block;}
.note textarea{
  width:100%;margin-top:14px;min-height:88px;resize:vertical;
  border-radius:14px;border:1px solid rgba(245,158,11,0.32);
  background:rgba(245,158,11,0.07);color:var(--text);
  padding:14px;outline:none;font-size:16px;font-weight:700;font-family:inherit;
}
.note textarea:focus{border-color:rgba(245,158,11,0.6);box-shadow:0 0 0 4px rgba(245,158,11,0.10);}

/* ---------- BUND ---------- */
.foot{
  display:flex;gap:12px;flex-wrap:wrap;align-items:center;
  margin-top:26px;padding-top:20px;border-top:1px solid var(--line2);
}
.btn{
  min-height:52px;padding:14px 24px;border-radius:15px;
  border:1px solid rgba(255,255,255,0.13);background:rgba(255,255,255,0.05);
  color:var(--text);font-family:inherit;
  font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;transition:.15s;
}
.btn:hover{background:rgba(255,255,255,0.09);}
.btn.danger{border-color:rgba(255,107,107,.32);color:#ffd0d0;}
.saved{font-size:12px;font-weight:800;color:var(--muted2);margin-right:auto;}

.newDay{
  margin-bottom:14px;padding:14px 18px;border-radius:16px;
  border:1px solid rgba(94,167,255,0.30);background:rgba(94,167,255,0.10);
  font-size:14px;font-weight:800;color:#cfe4ff;display:none;
}
.newDay.show{display:block;}
</style>
</head>
<body>
<div class="shell">

  <div class="head">
    <div>
      <div class="brandKicker">KAISER</div>
      <div class="brandTitle">Dagsansvarlig</div>
    </div>
    <div class="headMeta">
      <div class="chip" id="chipLoc">Vælg lokation</div>
      <div class="chip" id="chipName">Vælg navn</div>
      <div class="chip" id="chipDate">—</div>
    </div>
  </div>

  <div class="newDay" id="newDay">Ny dag registreret — tjeklisten er nulstillet automatisk.</div>

  <div class="setup" id="setup">
    <div class="setupGrid">
      <div>
        <label class="label" for="locationSelect">Lokation</label>
        <select id="locationSelect" class="select">
          <option value="">Vælg lokation...</option>
          <option>Café Kaiser Helsingør</option>
          <option>Café Kaiser Hillerød</option>
          <option>Café Kaiser Farum</option>
          <option>Café Kaiser Hørsholm</option>
          <option>Café Kaiser Vanløse</option>
          <option>Café Kaiser Sydhavnen</option>
        </select>
      </div>
      <div>
        <label class="label" for="managerName">Dagsansvarlig</label>
        <input id="managerName" class="input" placeholder="Dit navn" autocomplete="off"/>
      </div>
      <div>
        <label class="label" for="dateInput">Dato</label>
        <input id="dateInput" type="date" class="input"/>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab" id="tabFrokost" type="button">
      <div class="tabName">Før frokostryk</div>
      <div class="tabMeta" id="metaFrokost">—</div>
    </button>
    <button class="tab" id="tabAften" type="button">
      <div class="tabName">Før aftenryk</div>
      <div class="tabMeta" id="metaAften">—</div>
    </button>
  </div>

  <div class="statusBar">
    <div class="statusBig" id="statusBig">I gang</div>
    <div class="bar"><div class="barFill" id="barFill"></div></div>
    <div class="counts" id="counts">—</div>
  </div>

  <div class="purpose" id="purpose">—</div>

  <div id="list"></div>

  <div class="foot">
    <div class="saved" id="saved">Senest gemt: —</div>
    <button class="btn danger" type="button" id="resetBtn">Nulstil dag</button>
  </div>

</div>

<script>
(() => {
"use strict";

const KEY = "kaiser_shiftleader_checklist_v5";

const PURPOSE = {
  frokost: "<strong>Formål:</strong> Sikre at caféen og holdet er klar til dagens første travlhed. <strong>Fokus:</strong> Renhed, opfyldning og driftssikkerhed.",
  aften:   "<strong>Formål:</strong> Sikre at alt er fyldt op, rent og klart til aftenens travlhed. <strong>Fokus:</strong> Opfyldning, stemning, teknik og rengøring."
};

/* Kontrol-liste, ikke opgaveliste. Selve opgaverne krydses af i
   "Daglige opgaver" af tjenerne — her bekræfter skiftlederen at
   det er sket, og vurderer om vi er klar til rykket. */
const LISTS = {
  frokost: [
    { title:"Café og gæsteområder", items:[
      "Temperaturen behagelig ift. gæstens behov",
      "Sikre at dagens åbningstjekliste er udført og markeret",
      "Lageret står pænt"
    ]},
    { title:"Drift og økonomi", items:[
      "Byttepenge kontrolleret (Gælder OT, CC, og FM)",
      "Kommunikation med køkken: klar til travlhed?",
      "Vi er bakket godt op til frokost / mangler de noget (Køkken/Bar)",
      "Stemme vagtplanen ift. forventet travlhed og reservationer"
    ]}
  ],
  aften: [
    { title:"Drift og atmosfære", items:[
      "Kommunikation med køkken – klar til aftenservice",
      "Sikre at dagens rengøringsliste er udført. Hvis der er mangler, gøres dette inden aften-ryk.",
      "Sikre at midt-dagens tjekliste er udført og markeret"
    ]}
  ]
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

function todayISO(){
  const d = new Date();
  return d.getFullYear() + "-" +
         String(d.getMonth()+1).padStart(2,"0") + "-" +
         String(d.getDate()).padStart(2,"0");
}

const state = { location:"", managerName:"", date:"", type:"frokost", items:{} };
let autoReset = false;

function save(){
  localStorage.setItem(KEY, JSON.stringify(state));
  $("saved").textContent = "Senest gemt: " +
    new Date().toLocaleTimeString("da-DK", { hour:"2-digit", minute:"2-digit" });
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if (!raw){ state.date = todayISO(); return; }
    const s = JSON.parse(raw) || {};
    if (s.date && s.date !== todayISO()){
      // Ny dag: behold lokationen (hører til enheden), nulstil resten
      state.location = s.location || "";
      state.date = todayISO();
      autoReset = true;
      localStorage.setItem(KEY, JSON.stringify(state));
      return;
    }
    Object.assign(state, s);
    if (!state.date) state.date = todayISO();
    if (!LISTS[state.type]) state.type = "frokost";
  }catch(_){ state.date = todayISO(); }
}

const flat = t => (LISTS[t]||[]).flatMap(c => c.items);
const key  = (t,txt) => t + "__" + txt;
const val  = (t,txt) => state.items[key(t,txt)] || { status:"", note:"" };

function setStatus(t, txt, status){
  const k = key(t,txt);
  if (!state.items[k]) state.items[k] = { status:"", note:"" };
  state.items[k].status = (state.items[k].status === status) ? "" : status;
  save(); render();
}
function setNote(t, txt, note){
  const k = key(t,txt);
  if (!state.items[k]) state.items[k] = { status:"", note:"" };
  state.items[k].note = note;
  save();
}

function tally(t){
  let ok=0, mangler=0, na=0, open=0;
  flat(t).forEach(i => {
    const s = val(t,i).status;
    if (s==="ok") ok++; else if (s==="mangler") mangler++;
    else if (s==="na") na++; else open++;
  });
  return { ok, mangler, na, open, total: flat(t).length };
}

function renderTabs(){
  $("tabFrokost").classList.toggle("on", state.type==="frokost");
  $("tabAften").classList.toggle("on", state.type==="aften");

  [["frokost","metaFrokost"],["aften","metaAften"]].forEach(([t,id]) => {
    const c = tally(t), el = $(id);
    if (c.mangler > 0){
      el.textContent = c.mangler + (c.mangler===1 ? " mangel" : " mangler");
      el.className = "tabMeta attn";
    } else if (c.open === 0){
      el.textContent = "✓ Gennemgået";
      el.className = "tabMeta done";
    } else {
      el.textContent = c.open + " af " + c.total + " tilbage";
      el.className = "tabMeta";
    }
  });
}

function renderStatus(){
  const c = tally(state.type);
  const done = c.ok + c.na;
  const pct = c.total ? Math.round(((done + c.mangler) / c.total) * 100) : 0;

  $("barFill").style.width = pct + "%";
  $("barFill").className = "barFill" + (c.mangler > 0 ? " attn" : "");

  const big = $("statusBig");
  if (c.mangler > 0){
    big.textContent = c.mangler + (c.mangler===1 ? " mangel" : " mangler");
    big.className = "statusBig attn";
  } else if (c.open === 0){
    big.textContent = "Klar";
    big.className = "statusBig ready";
  } else {
    big.textContent = "I gang";
    big.className = "statusBig";
  }

  $("counts").innerHTML =
    `<b>${done + c.mangler}</b>/${c.total} gennemgået` +
    (c.open ? ` • <b>${c.open}</b> tilbage` : "");
}

function render(){
  renderTabs();
  renderStatus();
  $("purpose").innerHTML = PURPOSE[state.type] || "";

  const t = state.type;
  $("list").innerHTML = (LISTS[t]||[]).map(cat => `
    <div class="catTitle">${esc(cat.title)}</div>
    ${cat.items.map(item => {
      const v = val(t,item), st = v.status;
      return `
      <div class="item ${st}">
        <div class="itemText">${esc(item)}</div>
        <div class="btns">
          <button class="sBtn ok ${st==="ok"?"on":""}" type="button"
                  data-s="ok" data-i="${esc(item)}">OK</button>
          <button class="sBtn warn ${st==="mangler"?"on":""}" type="button"
                  data-s="mangler" data-i="${esc(item)}">Mangler</button>
          <button class="sBtn na ${st==="na"?"on":""}" type="button"
                  data-s="na" data-i="${esc(item)}">Ikke rel.</button>
        </div>
        <div class="note ${st==="mangler"?"show":""}">
          <textarea placeholder="Hvad mangler? Beskriv kort…"
                    data-n="${esc(item)}">${esc(v.note||"")}</textarea>
        </div>
      </div>`;
    }).join("")}
  `).join("");

  $("list").querySelectorAll("button[data-s]").forEach(b =>
    b.addEventListener("click", () => setStatus(t, b.dataset.i, b.dataset.s)));
  $("list").querySelectorAll("textarea[data-n]").forEach(ta =>
    ta.addEventListener("input", () => setNote(t, ta.dataset.n, ta.value)));
}

function renderChips(){
  const l = $("chipLoc"), n = $("chipName"), d = $("chipDate");
  l.textContent = state.location || "Vælg lokation";
  l.className = "chip" + (state.location ? "" : " empty");
  n.textContent = state.managerName || "Vælg navn";
  n.className = "chip" + (state.managerName ? "" : " empty");
  d.textContent = new Date((state.date || todayISO()) + "T12:00:00")
    .toLocaleDateString("da-DK", { weekday:"short", day:"numeric", month:"short" });
}

function syncUI(){
  $("locationSelect").value = state.location || "";
  $("managerName").value = state.managerName || "";
  $("dateInput").value = state.date || todayISO();
}

/* ---------- Events ---------- */
const toggleSetup = () => $("setup").classList.toggle("open");
["chipLoc","chipName","chipDate"].forEach(id =>
  $(id).addEventListener("click", toggleSetup));

$("tabFrokost").addEventListener("click", () => { state.type="frokost"; save(); render(); });
$("tabAften").addEventListener("click",   () => { state.type="aften";   save(); render(); });

$("locationSelect").addEventListener("change", e => {
  state.location = e.target.value; save(); renderChips();
});
$("managerName").addEventListener("input", e => {
  state.managerName = e.target.value; save(); renderChips();
});
$("dateInput").addEventListener("change", e => {
  state.date = e.target.value || todayISO(); save(); renderChips();
});

$("resetBtn").addEventListener("click", () => {
  if (!confirm("Nulstil dagens tjekliste? Alle markeringer slettes.")) return;
  state.managerName = ""; state.items = {}; state.type = "frokost";
  state.date = todayISO();
  save(); syncUI(); renderChips(); render();
});

/* ---------- Init ---------- */
load();
syncUI();
renderChips();
render();

if (autoReset) $("newDay").classList.add("show");
if (!state.location || !state.managerName) $("setup").classList.add("open");

// Fanger dagskiftet hvis skærmen står tændt natten over
setInterval(() => { if (state.date !== todayISO()) location.reload(); }, 60000);
})();
</script>
</body>
</html>
