<!doctype html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Kaiser · Mise en place</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#17181c;
      --panel:rgba(28,30,36,0.90);
      --border:rgba(255,255,255,0.10);
      --text:rgba(255,255,255,0.93);
      --muted:rgba(255,255,255,0.70);
      --muted2:rgba(255,255,255,0.48);
      --gold:#d6b24a;
      --gold2:#b9921f;
      --goldGlow:rgba(214,178,74,0.22);
      --ok:#62d26f;
      --danger:#ff6b6b;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);}
    body{
      min-height:100vh;
      padding: 0 14px calc(28px + env(safe-area-inset-bottom));
      background:
        radial-gradient(1100px 700px at 15% -10%, rgba(214,178,74,0.12), transparent 55%),
        radial-gradient(900px 600px at 105% 10%, rgba(214,178,74,0.08), transparent 50%),
        radial-gradient(900px 800px at 20% 115%, rgba(255,255,255,0.05), transparent 55%),
        linear-gradient(180deg, #17181c, #1b1d24 55%, #17181c);
      background-attachment: fixed;
    }
    .shell{max-width:720px;margin:0 auto;}

    /* ---------- Header ---------- */
    .brand{text-align:center;padding:22px 0 12px;}
    .kicker{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted2);font-weight:900;}
    .title{font-family:"Playfair Display",serif;font-size:32px;line-height:1.05;letter-spacing:-.015em;font-weight:700;margin-top:6px;}
    .goldline{height:2px;margin:14px auto 0;max-width:220px;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(214,178,74,.95),transparent);}

    /* ---------- Sticky control bar ---------- */
    .sticky{
      position:sticky;top:0;z-index:20;
      margin:0 -14px 14px;
      padding: max(8px, env(safe-area-inset-top)) 14px 12px;
      background:linear-gradient(180deg, rgba(23,24,28,.96), rgba(23,24,28,.86));
      backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);
    }
    .setup{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .field label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);font-weight:900;margin-bottom:5px;}
    select,input{
      width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.06);padding:11px 12px;outline:none;color:var(--text);
      font-size:15px;font-weight:600;font-family:inherit;
    }
    select option{color:#0b0c0f;}
    select:focus,input:focus{border-color:rgba(214,178,74,.55);box-shadow:0 0 0 4px var(--goldGlow);}

    .seg{display:flex;gap:6px;margin-top:10px;}
    .seg button{
      flex:1;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);
      color:var(--muted);border-radius:12px;padding:9px 8px;font-weight:900;font-size:13px;
      cursor:pointer;font-family:inherit;letter-spacing:.02em;
    }
    .seg button.on{border-color:rgba(214,178,74,.45);background:rgba(214,178,74,.13);color:var(--text);}
    .seg button .sub{display:block;font-size:10px;font-weight:700;color:var(--muted2);margin-top:1px;letter-spacing:0;}
    .seg button.on .sub{color:var(--muted);}

    .progRow{display:flex;align-items:center;gap:10px;margin-top:12px;}
    .progWrap{flex:1;height:9px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);}
    .progBar{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .25s ease;}
    .progWrap.allDone .progBar{background:linear-gradient(90deg,var(--ok),#3fae4d);}
    .progNum{font-weight:900;font-size:14px;font-variant-numeric:tabular-nums;min-width:48px;text-align:right;}

    .barTools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;}
    .gps{font-size:10px;letter-spacing:.10em;text-transform:uppercase;color:var(--muted2);font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .toggleHide{
      display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
      border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);
      border-radius:999px;padding:6px 11px;font-weight:800;font-size:12px;color:var(--muted);white-space:nowrap;
    }
    .toggleHide.on{border-color:rgba(214,178,74,.4);background:rgba(214,178,74,.12);color:var(--text);}
    .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);}
    .toggleHide.on .dot{background:var(--gold);}

    /* ---------- Stations ---------- */
    .station{border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.03);border-radius:16px;overflow:hidden;margin-bottom:10px;}
    .stationHead{
      display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;user-select:none;
      padding:13px 14px;background:rgba(255,255,255,.02);
    }
    .stationName{font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:rgba(255,255,255,.86);}
    .stationMeta{display:flex;align-items:center;gap:10px;}
    .miniCount{font-size:12px;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums;}
    .chev{width:9px;height:9px;border-right:2px solid var(--muted2);border-bottom:2px solid var(--muted2);transform:rotate(45deg);transition:transform .2s ease;}
    .station.closed .chev{transform:rotate(-45deg);}
    .station.closed .stationBody{display:none;}
    .stationBody{padding:10px;display:flex;flex-direction:column;gap:8px;}
    .station.complete .stationName{color:var(--ok);}

    /* ---------- Task rows ---------- */
    .task{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:14px;
      border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.03);
      cursor:pointer;transition:background .15s,border-color .15s,opacity .15s;touch-action:manipulation;}
    .task:active{transform:translateY(1px);}
    .check{width:26px;height:26px;border-radius:9px;border:2px solid rgba(255,255,255,.22);flex:0 0 auto;
      display:flex;align-items:center;justify-content:center;transition:all .15s;}
    .check svg{width:15px;height:15px;opacity:0;transform:scale(.6);transition:all .15s;}
    .taskText{flex:1;font-weight:800;letter-spacing:-.01em;font-size:15px;line-height:1.25;}
    .skipBtn{flex:0 0 auto;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);
      color:var(--muted2);border-radius:999px;width:30px;height:30px;font-weight:900;font-size:16px;line-height:1;
      cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;}
    .skipBtn:active{transform:scale(.92);}

    .task.done{border-color:rgba(98,210,111,.32);background:rgba(98,210,111,.08);}
    .task.done .check{border-color:var(--ok);background:var(--ok);}
    .task.done .check svg{opacity:1;transform:scale(1);color:#0b0c0f;}
    .task.done .taskText{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:rgba(255,255,255,.28);color:var(--muted);}

    .task.skip{opacity:.5;border-style:dashed;}
    .task.skip .check{border-radius:50%;border-color:rgba(255,255,255,.2);}
    .task.skip .taskText{color:var(--muted2);}
    .task.skip .skipBtn{border-color:rgba(214,178,74,.4);background:rgba(214,178,74,.12);color:var(--gold);}
    .skipTag{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);}

    /* ---------- Footer ---------- */
    .celebrate{border:1px solid rgba(98,210,111,.35);background:rgba(98,210,111,.10);border-radius:16px;padding:16px;text-align:center;margin:6px 0 14px;}
    .celebrate .big{font-family:"Playfair Display",serif;font-size:20px;font-weight:700;}
    .celebrate .small{color:var(--muted);font-weight:600;font-size:13px;margin-top:3px;}

    .reset{position:relative;overflow:hidden;width:100%;border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.05);color:var(--muted);border-radius:14px;padding:13px;font-weight:900;
      font-size:14px;cursor:pointer;font-family:inherit;user-select:none;margin-top:6px;}
    .reset .fill{position:absolute;left:0;top:0;height:100%;width:0%;background:rgba(255,107,107,.28);transition:width .06s linear;}
    .reset span{position:relative;z-index:1;}

    .hint{color:var(--muted2);font-size:12px;font-weight:700;text-align:center;margin-top:12px;line-height:1.5;}

    .empty{border:1px dashed rgba(255,255,255,.16);border-radius:16px;padding:24px 16px;text-align:center;color:var(--muted);font-weight:700;}
  </style>
</head>

<body>
  <div class="shell">

    <div class="brand">
      <div class="kicker">Café Kaiser</div>
      <div class="title">Mise en place</div>
      <div class="goldline"></div>
    </div>

    <!-- Sticky controls -->
    <div class="sticky">
      <div class="setup">
        <div class="field">
          <label>Lokation</label>
          <select id="loc">
            <option value="">Vælg…</option>
            <option>Café Kaiser Helsingør</option>
            <option>Café Kaiser Hillerød</option>
            <option>Café Kaiser Farum</option>
            <option>Café Kaiser Hørsholm</option>
            <option>Café Kaiser Vanløse</option>
            <option>Café Kaiser Enghave</option>
          </select>
        </div>
        <div class="field">
          <label>Lavet af</label>
          <input id="who" placeholder="Navn" autocomplete="off" />
        </div>
      </div>

      <div class="seg" id="daySeg">
        <button data-day="today" class="on">I dag<span class="sub" id="todayLbl">—</span></button>
        <button data-day="tomorrow">I morgen<span class="sub" id="tomorrowLbl">—</span></button>
      </div>

      <div class="progRow">
        <div class="progWrap" id="progWrap"><div class="progBar" id="progBar"></div></div>
        <div class="progNum" id="progNum">0/0</div>
      </div>

      <div class="barTools">
        <div class="gps" id="gps">GPS: tjekker…</div>
        <div class="toggleHide" id="hideDone"><span class="dot"></span>Skjul færdige</div>
      </div>
    </div>

    <!-- The list -->
    <div id="list"></div>

    <div class="celebrate" id="celebrate" style="display:none">
      <div class="big">Alt er klar ✦</div>
      <div class="small">Godt gået — mise en place er på plads.</div>
    </div>

    <button class="reset" id="reset"><div class="fill" id="resetFill"></div><span id="resetLbl">Hold for at nulstille dagen</span></button>
    <div class="hint">Tryk på en linje = udført · <b>–</b> = ikke i dag<br>Gemmes automatisk pr. lokation og dag på denne enhed.</div>

  </div>

  <script>
  // ===== Data (dine egne varer, uændret) =====
  const STATIONS = [
    { id:"gront", title:"Grønt & frugt", tasks:[
      "Cut lettuce for burger","Cut lettuce for salad","Cut lettuce for Julie plate",
      "Cut tomatoes (burger & salad)","Cut radishes","Cut red onions","Cut cucumbers",
      "Cut lemon","Cut spring onions","Cut chives","Cut cress","Cut mix cress","Cut fruits (mix & buffet)"
    ]},
    { id:"kod", title:"Kød & kartofler", tasks:[
      "Cut and marinate chicken","Cut Tenderloin","Cut Black Angus",
      "Cut potatoes for Wienerschnitzel","Cut potatoes for smørrebrød",
      "Fry bacon",'Fry "stegt flæsk"',"Fry sausages"
    ]},
    { id:"ost", title:"Ost & mejeri", tasks:[
      "Cut cheese for sandwiches","Cut Vesterhavsost","Cut Chili cheese","Cut Blue cheese",
      "Prepare Chiagrød","Prepare Blueberry Yogurt","Fill up yogurt"
    ]},
    { id:"sauce", title:"Saucer & dressinger", tasks:[
      "Refill Thousand Island dressing","Refill Tatar sauce","Refill Remoulade","Refill Chili Mayo",
      "Refill Garlic Mayo","Refill Truffle Mayo","Refill Curry Mayo","Refill BBQ Mayo",
      "Refill Signature dressing","Refill Caesar dressing","Refill Rævesovs","Refill Mayo & Ketchup"
    ]},
    { id:"prep", title:"Prep & bagning", tasks:[
      "Boil eggs","Cook rice","Cook Mango Jam","Cook Mix Berries Jam","Cook Apple Jam",
      "Make garlic paste","Make caramelized onions","Make Øland toast","Bake tomatoes",
      "Bake Apple tart","Prepare Chocolate Mousse","Prepare Crème brûlée"
    ]},
    { id:"setup", title:"Opsætning & lager", tasks:[
      "Setup Brunch","Setup Julie plate","Defrost Mango & Edamame","Defrost Chocolate cake","Refill Freezer"
    ]}
  ];

  const COORDS = {
    "Café Kaiser Helsingør":{lat:56.033919,lng:12.610563},
    "Café Kaiser Hillerød":{lat:55.928199,lng:12.298147},
    "Café Kaiser Farum":{lat:55.814500,lng:12.379595},
    "Café Kaiser Hørsholm":{lat:55.881489,lng:12.497737},
    "Café Kaiser Vanløse":{lat:55.687849,lng:12.490876}
  };
  const GPS_RANGE_M = 900;
  const RESET_HOLD_MS = 1800;

  // ===== Helpers =====
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
  const DAY_DK = ["Søndag","Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag"];

  function isoLocal(d){
    const x = new Date(d); x.setHours(12,0,0,0);
    return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10);
  }
  function itemId(sid,i){ return sid+"-"+String(i+1).padStart(2,"0"); }

  // ===== State =====
  const state = {
    loc:"", who:"", day:"today",
    collapsed:{}, hideDone:false,
    status:{}   // { itemId: "done" | "skip" }
  };

  function todayDate(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
  function tomorrowDate(){ const d=todayDate(); d.setDate(d.getDate()+1); return d; }
  function activeDate(){ return state.day==="today" ? todayDate() : tomorrowDate(); }
  function activeISO(){ return isoLocal(activeDate()); }

  // ===== Storage (pr. lokation + dato) =====
  const KEY = "kaiser_mep_v3";
  const kStatus = () => `${KEY}_${state.loc}_${activeISO()}`;
  const kWho    = () => `${KEY}_who_${state.loc}`;

  function loadContext(){
    if(!state.loc){ state.status={}; return; }
    try{ state.status = JSON.parse(localStorage.getItem(kStatus())||"{}")||{}; }catch(e){ state.status={}; }
    const w = localStorage.getItem(kWho());
    if(w && !$("who").value){ $("who").value=w; state.who=w; }
  }
  function saveStatus(){ if(state.loc) localStorage.setItem(kStatus(), JSON.stringify(state.status)); }
  function saveWho(){ if(state.loc) localStorage.setItem(kWho(), state.who); }

  // ===== Counts =====
  function counts(){
    let total=0, done=0, skip=0;
    STATIONS.forEach(s=>s.tasks.forEach((_,i)=>{
      const st = state.status[itemId(s.id,i)];
      if(st==="skip"){ skip++; return; }
      total++; if(st==="done") done++;
    }));
    return { total, done, remaining: total-done, skip };
  }

  // ===== Render =====
  function labels(){
    $("todayLbl").textContent = DAY_DK[todayDate().getDay()];
    $("tomorrowLbl").textContent = DAY_DK[tomorrowDate().getDay()];
  }

  function renderProgress(){
    const c = counts();
    $("progNum").textContent = c.done+"/"+c.total;
    const pct = c.total ? Math.round(c.done/c.total*100) : 0;
    $("progBar").style.width = pct+"%";
    const all = c.total>0 && c.remaining===0;
    $("progWrap").classList.toggle("allDone", all);
    $("celebrate").style.display = all ? "block":"none";
  }

  function renderList(){
    const list = $("list");
    if(!state.loc){
      list.innerHTML = '<div class="empty">Vælg en lokation for at se dagens mise en place.</div>';
      return;
    }
    list.innerHTML = "";
    STATIONS.forEach(sec=>{
      let secTotal=0, secDone=0;
      const rows = sec.tasks.map((text,i)=>{
        const id = itemId(sec.id,i);
        const st = state.status[id];
        const isDone = st==="done", isSkip = st==="skip";
        if(!isSkip){ secTotal++; if(isDone) secDone++; }
        if(state.hideDone && isDone) return "";
        const cls = isDone?"done":(isSkip?"skip":"");
        return `<div class="task ${cls}" data-id="${id}">
          <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
          <div class="taskText">${esc(text)}${isSkip?' <span class="skipTag">· ikke i dag</span>':''}</div>
          <button class="skipBtn" data-skip="${id}" aria-label="Ikke i dag">${isSkip?'↺':'–'}</button>
        </div>`;
      }).join("");

      const complete = secTotal>0 && secDone===secTotal;
      const closed = !!state.collapsed[sec.id];
      const st = document.createElement("div");
      st.className = "station"+(closed?" closed":"")+(complete?" complete":"");
      st.innerHTML = `
        <div class="stationHead" data-station="${sec.id}">
          <div class="stationName">${esc(sec.title)}</div>
          <div class="stationMeta"><span class="miniCount">${secDone}/${secTotal}</span><span class="chev"></span></div>
        </div>
        <div class="stationBody">${rows || '<div class="empty" style="padding:14px">Alt færdigt her ✦</div>'}</div>`;
      list.appendChild(st);
    });
  }

  function render(){ labels(); renderList(); renderProgress(); }

  // ===== Events =====
  $("loc").addEventListener("change", e=>{
    state.loc = e.target.value||"";
    loadContext();
    render();
  });
  $("who").addEventListener("input", e=>{ state.who=e.target.value.trim(); saveWho(); });

  $("daySeg").addEventListener("click", e=>{
    const b = e.target.closest("button"); if(!b) return;
    state.day = b.dataset.day;
    $("daySeg").querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b));
    loadContext();
    render();
  });

  $("hideDone").addEventListener("click", ()=>{
    state.hideDone = !state.hideDone;
    $("hideDone").classList.toggle("on", state.hideDone);
    renderList(); renderProgress();
  });

  $("list").addEventListener("click", e=>{
    const skip = e.target.closest("[data-skip]");
    if(skip){
      const id = skip.dataset.skip;
      state.status[id] = state.status[id]==="skip" ? undefined : "skip";
      if(state.status[id]===undefined) delete state.status[id];
      saveStatus(); render(); return;
    }
    const head = e.target.closest("[data-station]");
    if(head){
      const s = head.dataset.station;
      state.collapsed[s] = !state.collapsed[s];
      renderList(); return;
    }
    const task = e.target.closest(".task");
    if(task){
      const id = task.dataset.id;
      state.status[id] = state.status[id]==="done" ? undefined : "done";
      if(state.status[id]===undefined) delete state.status[id];
      saveStatus(); render();
    }
  });

  // ===== Hold-to-reset =====
  let rTimer=null, rStart=0;
  function rClear(){ if(rTimer)clearInterval(rTimer); rTimer=null; $("resetFill").style.width="0%"; $("resetLbl").textContent="Hold for at nulstille dagen"; }
  function rGo(){
    if(!state.loc) return;
    rClear(); rStart=Date.now(); $("resetLbl").textContent="Bliv ved med at holde…";
    rTimer=setInterval(()=>{
      const p=Math.min(100,Math.round((Date.now()-rStart)/RESET_HOLD_MS*100));
      $("resetFill").style.width=p+"%";
      if(p>=100){ clearInterval(rTimer); rTimer=null;
        localStorage.removeItem(kStatus()); state.status={}; rClear(); render();
      }
    },40);
  }
  ["pointerdown"].forEach(ev=>$("reset").addEventListener(ev,e=>{e.preventDefault();rGo();}));
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>$("reset").addEventListener(ev,rClear));
  window.addEventListener("blur",rClear);

  // ===== GPS autoselect =====
  function autoLocate(){
    if(!navigator.geolocation){ $("gps").textContent="GPS: ikke understøttet"; return; }
    navigator.geolocation.getCurrentPosition(pos=>{
      const {latitude:la,longitude:lo}=pos.coords;
      let best=null,bd=Infinity;
      for(const n in COORDS){
        const c=COORDS[n], R=6371000, tr=x=>x*Math.PI/180;
        const dLa=tr(c.lat-la),dLo=tr(c.lng-lo);
        const a=Math.sin(dLa/2)**2+Math.cos(tr(la))*Math.cos(tr(c.lat))*Math.sin(dLo/2)**2;
        const d=R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
        if(d<bd){bd=d;best=n;}
      }
      if(best && bd<=GPS_RANGE_M && !$("loc").value){
        $("loc").value=best; state.loc=best; loadContext(); render();
        $("gps").textContent="GPS: "+best.replace("Café Kaiser ","")+" ("+Math.round(bd)+" m)";
      } else {
        $("gps").textContent = $("loc").value ? "GPS: klar" : "GPS: vælg lokation manuelt";
      }
    }, ()=>{ $("gps").textContent="GPS: vælg lokation manuelt"; },
    {enableHighAccuracy:false,timeout:8000,maximumAge:300000});
  }

  // ===== Start =====
  render();
  autoLocate();
  </script>
</body>
</html>
