<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kaiser – Fejl & Mangler</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg0:#0d1117;
      --bg1:#161b22;
      --text:rgba(255,255,255,0.95);
      --muted:rgba(255,255,255,0.72);
      --muted2:rgba(255,255,255,0.52);
      --gold:#d6b24a;
      --gold2:#b9921f;
      --ok:#62d26f;
      --danger:#ff6b6b;
      --warn:#f59e0b;
      --shadow:0 20px 60px rgba(0,0,0,.40);
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      color:var(--text);
      font-family:Inter,system-ui,sans-serif;
      background:
        radial-gradient(1100px 700px at 12% -8%, rgba(167,139,250,0.12), transparent 55%),
        radial-gradient(1000px 650px at 105% 0%, rgba(56,189,248,0.10), transparent 55%),
        radial-gradient(900px 700px at 25% 110%, rgba(245,158,11,0.12), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 55%, var(--bg0));
      padding:18px;
    }

    .wrap{max-width:960px;margin:0 auto;}
    .card{
      border-radius:28px;
      border:1px solid rgba(255,255,255,0.12);
      background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      box-shadow:var(--shadow);
      padding:24px;
    }

    .kicker{
      text-align:center;
      font-size:12px;
      font-weight:900;
      letter-spacing:.24em;
      text-transform:uppercase;
      color:var(--muted2);
    }

    h1{
      margin:10px 0 0;
      text-align:center;
      font-family:"Playfair Display",serif;
      font-size:46px;
      line-height:1;
      letter-spacing:-.03em;
    }

    .sub{
      text-align:center;
      color:var(--muted);
      font-size:14px;
      font-weight:800;
      margin-top:10px;
    }

    .goldline{
      height:2px;
      margin:18px auto 0;
      max-width:420px;
      border-radius:999px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent);
    }

    /* Language toggle */
    .langRow{display:flex;justify-content:center;margin-top:16px;}
    .langToggle{
      display:inline-flex;
      border:1px solid rgba(255,255,255,0.14);
      border-radius:999px;
      overflow:hidden;
      background:rgba(255,255,255,0.05);
    }
    .langToggle button{
      border:none;background:transparent;color:var(--muted);
      font-weight:900;font-size:12px;letter-spacing:.10em;
      padding:8px 18px;cursor:pointer;font-family:inherit;
    }
    .langToggle button.on{
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      color:#0b0c0f;
    }

    .pillRow{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:10px;
      margin-top:16px;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.14);
      background:rgba(255,255,255,0.06);
      font-size:11px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:rgba(255,255,255,0.92);
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
      margin-top:22px;
    }

    @media (max-width: 780px){
      .grid{grid-template-columns:1fr;}
    }

    .full{grid-column:1/-1;}

    label{
      display:block;
      margin-bottom:8px;
      color:var(--muted);
      font-weight:900;
      font-size:12px;
      letter-spacing:.10em;
      text-transform:uppercase;
    }

    input, select, textarea{
      width:100%;
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.14);
      background:rgba(255,255,255,0.06);
      color:var(--text);
      padding:14px 16px;
      font-size:15px;
      font-weight:700;
      outline:none;
    }

    input:focus, select:focus, textarea:focus{
      border-color:var(--gold);
      background:rgba(255,255,255,0.10);
    }

    select option{
      background:#161b22;
      color:#fff;
    }

    textarea{
      resize:vertical;
      min-height:120px;
    }

    .actions{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      margin-top:22px;
    }

    .btn{
      flex:1;
      min-width:180px;
      border:none;
      border-radius:16px;
      padding:16px;
      font-size:14px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
      cursor:pointer;
    }

    .btn.primary{
      background:linear-gradient(135deg,var(--gold),var(--gold2));
      color:#0b0c0f;
    }

    .btn.ghost{
      background:rgba(255,255,255,0.08);
      color:#fff;
      border:1px solid rgba(255,255,255,0.14);
    }

    .status{
      margin-top:16px;
      padding:14px 16px;
      border-radius:14px;
      font-size:14px;
      font-weight:700;
      display:none;
    }
    .status.ok{
      display:block;
      background:rgba(98,210,111,0.15);
      border:1px solid rgba(98,210,111,0.35);
      color:var(--ok);
    }
    .status.err{
      display:block;
      background:rgba(255,107,107,0.15);
      border:1px solid rgba(255,107,107,0.35);
      color:var(--danger);
    }

    .listWrap{
      margin-top:24px;
      border-top:1px solid rgba(255,255,255,0.10);
      padding-top:20px;
    }

    .listTitle{
      font-size:12px;
      font-weight:900;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--muted2);
      margin-bottom:12px;
    }

    .itemList{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .item{
      display:flex;
      align-items:flex-start;
      gap:10px;
      padding:12px;
      border-radius:16px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.10);
    }

    .bar{
      width:5px;
      height:60px;
      border-radius:4px;
      background:var(--danger);
      flex:0 0 auto;
    }
    .bar.low{background:var(--ok);}
    .bar.medium{background:var(--warn);}
    .bar.high{background:var(--danger);}

    .itemInfo{flex:1;min-width:0;}
    .itemTitle{
      font-weight:800;
      font-size:14px;
      line-height:1.3;
    }

    .itemMeta{
      margin-top:4px;
      font-size:12px;
      color:var(--muted);
      font-weight:700;
    }

    .itemDesc{
      margin-top:6px;
      font-size:13px;
      color:rgba(255,255,255,0.90);
      line-height:1.4;
    }

    .empty{
      text-align:center;
      padding:24px;
      color:var(--muted2);
      font-size:13px;
    }

    iframe.hiddenFrame{
      display:none;
      width:0;height:0;border:0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="kicker">KAISER</div>
      <h1 data-i18n="title">Fejl & Mangler</h1>
      <div class="sub" data-i18n="sub">Hurtig registrering af fejl og mangler i driften</div>
      <div class="goldline"></div>

      <div class="langRow">
        <div class="langToggle" id="langToggle">
          <button type="button" data-lang="da" class="on">DA</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>

      <div class="pillRow">
        <div class="pill" id="locPill">📍 —</div>
        <div class="pill" id="datePill">📅 —</div>
      </div>

      <div class="grid">
        <div>
          <label for="locSelect" data-i18n="locLabel">Lokation</label>
          <select id="locSelect">
            <option value="Café Kaiser Helsingør">Café Kaiser Helsingør</option>
            <option value="Café Kaiser Hillerød">Café Kaiser Hillerød</option>
            <option value="Café Kaiser Farum">Café Kaiser Farum</option>
            <option value="Café Kaiser Hørsholm">Café Kaiser Hørsholm</option>
            <option value="Café Kaiser Vanløse">Café Kaiser Vanløse</option>
            <option value="Café Kaiser Sydhavnen">Café Kaiser Sydhavnen</option>
          </select>
        </div>

        <div>
          <label for="dateInput" data-i18n="dateLabel">Dato</label>
          <input id="dateInput" type="date" />
        </div>

        <div>
          <label for="areaInput" data-i18n="areaLabel">Område</label>
          <select id="areaInput" data-optgroup="area">
            <option value="">Vælg område</option>
            <option value="Restaurant">Restaurant</option>
            <option value="Bar">Bar</option>
            <option value="Kitchen">Køkken</option>
            <option value="Toilets">Toiletter</option>
            <option value="Storage">Lager</option>
            <option value="Outdoor">Udeservering</option>
            <option value="Technical">Teknisk</option>
            <option value="Other">Andet</option>
          </select>
        </div>

        <div>
          <label for="issueTypeInput" data-i18n="issueTypeLabel">Fejltype</label>
          <select id="issueTypeInput" data-optgroup="issueType">
            <option value="">Vælg type</option>
            <option value="Equipment">Udstyr</option>
            <option value="Electricity">El</option>
            <option value="Water">Vand</option>
            <option value="IT / POS">IT / POS</option>
            <option value="Furniture">Møbler</option>
            <option value="Cleaning / Hygiene">Rengøring / hygiejne</option>
            <option value="Missing item">Mangel på udstyr</option>
            <option value="Other">Andet</option>
          </select>
        </div>

        <div>
          <label for="severityInput" data-i18n="severityLabel">Alvorlighed</label>
          <select id="severityInput" data-optgroup="severity">
            <option value="">Vælg alvorlighed</option>
            <option value="Low">Lav</option>
            <option value="Medium">Mellem</option>
            <option value="High">Høj</option>
          </select>
        </div>

        <div>
          <label for="sourceInput" data-i18n="sourceLabel">Kilde</label>
          <select id="sourceInput" data-optgroup="source">
            <option value="Drift">Drift</option>
            <option value="Kitchen">Køkken</option>
          </select>
        </div>

        <div class="full">
          <label for="descriptionInput" data-i18n="descLabel">Beskrivelse</label>
          <textarea id="descriptionInput" data-i18n-ph="descPlaceholder" placeholder="Beskriv fejlen eller manglen..."></textarea>
        </div>
      </div>

      <div class="actions">
        <button class="btn ghost" id="refreshBtn" type="button" data-i18n="refresh">Opdater liste</button>
        <button class="btn primary" id="submitBtn" type="button" data-i18n="submit">Send fejl</button>
      </div>

      <div class="status" id="statusBox"></div>

      <div class="listWrap">
        <div class="listTitle" id="listTitle" data-i18n="listTitle">Seneste fejl & mangler</div>
        <div class="itemList" id="itemList">
          <div class="empty">Indlæser...</div>
        </div>
      </div>
    </div>
  </div>

  <iframe name="saveTarget" class="hiddenFrame"></iframe>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw8ztJIUOk-4GkhkTwHbpJiSOi7uJjPivpWc5skVr0KXJ1m-j3dcVNF3BSe3sbnWIds/exec";

    const $ = id => document.getElementById(id);

    // ===== i18n =====
    // NOTE: only display text changes. Option VALUES stay identical, so
    // whatever is sent to the sheet is the same in DA and EN.
    const I18N = {
      da: {
        title: "Fejl & Mangler",
        sub: "Hurtig registrering af fejl og mangler i driften",
        locLabel: "Lokation",
        dateLabel: "Dato",
        areaLabel: "Område",
        issueTypeLabel: "Fejltype",
        severityLabel: "Alvorlighed",
        sourceLabel: "Kilde",
        descLabel: "Beskrivelse",
        descPlaceholder: "Beskriv fejlen eller manglen...",
        refresh: "Opdater liste",
        submit: "Send fejl",
        submitting: "Sender...",
        listTitle: "Seneste fejl & mangler",
        loading: "Indlæser...",
        empty: "Ingen fejl eller mangler registreret endnu",
        loadError: "❌ Fejl ved indlæsning",
        locPillPrefix: "📍 ",
        datePillPrefix: "📅 ",
        validation: "Udfyld dato, lokation, område, fejltype, alvorlighed og beskrivelse.",
        saved: "✅ Fejl/mangel gemt.",
        statusLbl: "Status",
        sourceMetaLbl: "Kilde",
        area:      { "":"Vælg område", Restaurant:"Restaurant", Bar:"Bar", Kitchen:"Køkken", Toilets:"Toiletter", Storage:"Lager", Outdoor:"Udeservering", Technical:"Teknisk", Other:"Andet" },
        issueType: { "":"Vælg type", Equipment:"Udstyr", Electricity:"El", Water:"Vand", "IT / POS":"IT / POS", Furniture:"Møbler", "Cleaning / Hygiene":"Rengøring / hygiejne", "Missing item":"Mangel på udstyr", Other:"Andet" },
        severity:  { "":"Vælg alvorlighed", Low:"Lav", Medium:"Mellem", High:"Høj" },
        source:    { Drift:"Drift", Kitchen:"Køkken" },
        sevText:   { low:"Lav", medium:"Mellem", high:"Høj" }
      },
      en: {
        title: "Faults & Issues",
        sub: "Quick logging of faults and issues in operations",
        locLabel: "Location",
        dateLabel: "Date",
        areaLabel: "Area",
        issueTypeLabel: "Fault type",
        severityLabel: "Severity",
        sourceLabel: "Source",
        descLabel: "Description",
        descPlaceholder: "Describe the fault or issue...",
        refresh: "Refresh list",
        submit: "Submit fault",
        submitting: "Sending...",
        listTitle: "Latest faults & issues",
        loading: "Loading...",
        empty: "No faults or issues logged yet",
        loadError: "❌ Error loading",
        locPillPrefix: "📍 ",
        datePillPrefix: "📅 ",
        validation: "Fill in date, location, area, fault type, severity and description.",
        saved: "✅ Fault/issue saved.",
        statusLbl: "Status",
        sourceMetaLbl: "Source",
        area:      { "":"Select area", Restaurant:"Restaurant", Bar:"Bar", Kitchen:"Kitchen", Toilets:"Toilets", Storage:"Storage", Outdoor:"Outdoor seating", Technical:"Technical", Other:"Other" },
        issueType: { "":"Select type", Equipment:"Equipment", Electricity:"Electricity", Water:"Water", "IT / POS":"IT / POS", Furniture:"Furniture", "Cleaning / Hygiene":"Cleaning / Hygiene", "Missing item":"Missing item", Other:"Other" },
        severity:  { "":"Select severity", Low:"Low", Medium:"Medium", High:"High" },
        source:    { Drift:"Operations", Kitchen:"Kitchen" },
        sevText:   { low:"Low", medium:"Medium", high:"High" }
      }
    };

    const state = { lang: "da" };
    const t = () => I18N[state.lang];

    // ===== Helpers =====
    function isoToday() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function setStatus(msg, type) {
      const box = $("statusBox");
      box.className = "status " + (type === "ok" ? "ok" : "err");
      box.textContent = msg;
    }

    function clearStatus() {
      $("statusBox").className = "status";
      $("statusBox").textContent = "";
    }

    function getLocFromQS() {
      return new URLSearchParams(location.search).get("loc") || "";
    }

    function updatePills() {
      $("locPill").textContent = t().locPillPrefix + ($("locSelect").value.replace("Café Kaiser ", "") || "—");
      $("datePill").textContent = t().datePillPrefix + ($("dateInput").value || "—");
    }

    function jsonp(url, params = {}) {
      return new Promise((resolve, reject) => {
        const cb = "__cb_" + Math.random().toString(16).slice(2);
        const qs = new URLSearchParams({ ...params, callback: cb }).toString();
        const src = url + (url.includes("?") ? "&" : "?") + qs;

        const s = document.createElement("script");
        const t = setTimeout(() => {
          cleanup();
          reject(new Error("timeout"));
        }, 15000);

        function cleanup() {
          clearTimeout(t);
          try { delete window[cb]; } catch (_) {}
          if (s.parentNode) s.parentNode.removeChild(s);
        }

        window[cb] = data => {
          cleanup();
          resolve(data);
        };

        s.src = src;
        s.async = true;
        s.onerror = () => {
          cleanup();
          reject(new Error("load error"));
        };

        document.body.appendChild(s);
      });
    }

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));
    }

    function severityClass(sev) {
      const s = String(sev || "").toLowerCase();
      if (s === "low") return "low";
      if (s === "medium") return "medium";
      return "high";
    }

    function severityText(sev) {
      const s = String(sev || "").toLowerCase();
      return t().sevText[s] || sev || "—";
    }

    // ===== List rendering =====
    let lastItems = null;   // null = loading, [] = none
    let loadFailed = false;

    function renderItems() {
      const box = $("itemList");
      if (loadFailed) { box.innerHTML = `<div class="empty">${t().loadError}</div>`; return; }
      if (lastItems === null) { box.innerHTML = `<div class="empty">${t().loading}</div>`; return; }
      if (!lastItems.length) { box.innerHTML = `<div class="empty">${t().empty}</div>`; return; }

      box.innerHTML = lastItems.map(item => `
        <div class="item">
          <div class="bar ${severityClass(item.severity)}"></div>
          <div class="itemInfo">
            <div class="itemTitle">${escapeHtml(item.area)} • ${escapeHtml(item.issueType)} • ${escapeHtml(severityText(item.severity))}</div>
            <div class="itemMeta">📅 ${escapeHtml(item.date)} • ${t().statusLbl}: ${escapeHtml(item.status)} • ${t().sourceMetaLbl}: ${escapeHtml(item.source)}</div>
            <div class="itemDesc">${escapeHtml(item.description)}</div>
          </div>
        </div>
      `).join("");
    }

    async function loadItems() {
      clearStatus();
      loadFailed = false;
      lastItems = null;
      renderItems();

      const loc = $("locSelect").value;
      try {
        const data = await jsonp(SCRIPT_URL, { action: "getFaultsIssues", loc });
        lastItems = (data && data.ok && Array.isArray(data.items)) ? data.items : [];
        renderItems();
      } catch (e) {
        loadFailed = true;
        renderItems();
      }
    }

    function submitItem() {
      clearStatus();

      const location = $("locSelect").value;
      const date = $("dateInput").value;
      const area = ($("areaInput").value || "").trim();
      const issueType = ($("issueTypeInput").value || "").trim();
      const severity = ($("severityInput").value || "").trim();
      const description = ($("descriptionInput").value || "").trim();
      const source = ($("sourceInput").value || "").trim();

      if (!date || !location || !area || !issueType || !severity || !description) {
        setStatus(t().validation, "err");
        return;
      }

      const btn = $("submitBtn");
      btn.disabled = true;
      btn.textContent = t().submitting;

      const form = document.createElement("form");
      form.method = "POST";
      form.action = SCRIPT_URL;
      form.target = "saveTarget";
      form.style.display = "none";

      const fields = {
        action: "addFaultIssue",
        date, location, area, issueType, severity, description, source
      };

      Object.keys(fields).forEach(key => {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = key;
        input.value = fields[key];
        form.appendChild(input);
      });

      document.body.appendChild(form);
      form.submit();

      setTimeout(() => {
        form.remove();
        btn.disabled = false;
        btn.textContent = t().submit;
        $("areaInput").value = "";
        $("issueTypeInput").value = "";
        $("severityInput").value = "";
        $("descriptionInput").value = "";
        $("sourceInput").value = "Drift";
        setStatus(t().saved, "ok");
        loadItems();
      }, 1200);
    }

    // ===== Apply language =====
    function applyLang(lang) {
      if (!I18N[lang]) lang = "da";
      state.lang = lang;
      try { localStorage.setItem("kaiser_faults_lang", lang); } catch (_) {}
      document.documentElement.lang = lang;
      const d = I18N[lang];

      document.querySelectorAll("#langToggle button").forEach(b =>
        b.classList.toggle("on", b.dataset.lang === lang));

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const k = el.dataset.i18n;
        if (d[k] != null) el.textContent = d[k];
      });
      document.querySelectorAll("[data-i18n-ph]").forEach(el => {
        const k = el.dataset.i18nPh;
        if (d[k] != null) el.placeholder = d[k];
      });

      document.title = "Kaiser – " + d.title;

      document.querySelectorAll("[data-optgroup]").forEach(sel => {
        const g = d[sel.dataset.optgroup] || {};
        Array.from(sel.options).forEach(o => {
          if (g[o.value] != null) o.textContent = g[o.value];
        });
      });

      updatePills();
      renderItems();
    }

    // ===== Init =====
    (function init() {
      $("dateInput").value = isoToday();

      let savedLang = "da";
      try { savedLang = localStorage.getItem("kaiser_faults_lang") || "da"; } catch (_) {}

      const locQS = getLocFromQS();
      if (locQS) {
        const wanted = "Café Kaiser " + locQS.trim();
        const options = Array.from($("locSelect").options);
        const match = options.find(o => o.value.toLowerCase() === wanted.toLowerCase());
        if (match) $("locSelect").value = match.value;
      }

      applyLang(savedLang);
      loadItems();

      $("locSelect").addEventListener("change", () => { updatePills(); loadItems(); });
      $("dateInput").addEventListener("change", updatePills);
      $("refreshBtn").addEventListener("click", loadItems);
      $("submitBtn").addEventListener("click", submitItem);

      $("langToggle").addEventListener("click", e => {
        const b = e.target.closest("button");
        if (b) applyLang(b.dataset.lang);
      });
    })();
  </script>
</body>
</html>
