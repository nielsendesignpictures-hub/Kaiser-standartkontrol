<!doctype html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Kaiser – Fejl & Mangler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f2; --white:#fff; --ink:#18201d; --muted:#737b76; --line:#e3e7e3;
  --green:#176b57; --green2:#e5f1ed; --gold:#d6b24a; --gold2:#f7f0da;
  --amber:#b36b16; --amberSoft:#f8efdf; --red:#b64b43; --redSoft:#f8e8e6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit}
.hidden{display:none!important}

.page{height:100vh;display:flex;flex-direction:column;padding:0.875rem 1.25rem 1rem;gap:0.75rem}
.head{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex:none}
.kicker{font-size:0.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.h1{font-size:1.5rem;font-weight:800;letter-spacing:-.04em;margin-top:2px}
.headR{display:flex;align-items:center;gap:0.625rem}
.lang{display:inline-flex;padding:0.25rem;border-radius:62.4375rem;background:#fff;border:1px solid var(--line)}
.lang button{min-height:2.375rem;min-width:2.75rem;border:0;border-radius:62.4375rem;background:transparent;font-size:0.8125rem;font-weight:800;letter-spacing:.08em;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--ink);color:#fff}
.locWrap{display:flex;align-items:center;gap:0.5rem;min-height:2.875rem;padding:0 0.5rem 0 1rem;border-radius:62.4375rem;background:#fff;border:1px solid var(--line);font-weight:800;font-size:0.9375rem}
.locLbl{font-size:0.6875rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.locWrap select{border:0;background:transparent;font-size:0.9375rem;font-weight:800;color:var(--ink);min-height:2.75rem;padding:0 0.25rem;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none}
.locWrap::after{content:"▾";color:var(--muted);font-size:0.75rem;margin-right:0.5rem;pointer-events:none}

.grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0.75rem}
.panel{background:#fff;border:1px solid var(--line);border-radius:1.125rem;display:flex;flex-direction:column;min-height:0;box-shadow:0 1px 0 rgba(24,32,29,.04)}
.pHead{display:flex;align-items:center;justify-content:space-between;gap:0.5rem;padding:0 1rem;min-height:3.25rem;border-bottom:1px solid var(--line);flex:none}
.pTitle{display:flex;align-items:center;gap:0.5rem;font-size:0.8125rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.pDot{width:0.5rem;height:0.5rem;border-radius:50%;background:var(--red)}
.pDot.green{background:var(--green)}
.pCount{font-size:0.875rem;font-weight:700;color:var(--muted);white-space:nowrap}
.pBody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem}

/* formular */
.lbl{font-size:0.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 0.375rem}
.lbl i{font-style:normal;color:var(--red)}
.field{margin-bottom:0.625rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(7rem,1fr));gap:0.375rem}
.chip{min-height:2.5rem;line-height:1.1;border-radius:0.75rem;border:1.5px solid var(--line);background:#f7f8f6;font-size:0.9375rem;font-weight:800;color:var(--ink);cursor:pointer;padding:0 0.5rem;transition:transform .08s ease}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip:active,.btn:active,.seg button:active,.qp:active{transform:scale(.97)}
.field.err .chips .chip,.field.err .seg{border-color:var(--red)}
.field.err .lbl{color:var(--red)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0.3125rem;padding:0.3125rem;background:#eef1ee;border-radius:0.875rem;border:1.5px solid transparent}
.seg button{min-height:2.5rem;border:0;border-radius:0.625rem;background:transparent;font-size:0.9375rem;font-weight:800;color:#59635e;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.5rem}
.seg button .dot{width:0.5625rem;height:0.5625rem;border-radius:50%}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(24,32,29,.12)}
.seg button[data-v="Low"].on{background:var(--green);color:#fff}
.seg button[data-v="Medium"].on{background:var(--amber);color:#fff}
.seg button[data-v="High"].on{background:var(--red);color:#fff}
.seg button.on .dot{background:#fff!important}

.input{width:100%;min-height:3rem;border-radius:0.75rem;border:1.5px solid var(--line);background:#f7f8f6;padding:0 0.875rem;font-size:1rem;font-weight:700;color:var(--ink);outline:none}
.textarea{width:100%;min-height:3.5rem;border-radius:0.875rem;border:1.5px solid var(--line);background:#f7f8f6;padding:0.75rem 0.875rem;font-size:1.0625rem;font-weight:500;line-height:1.45;color:var(--ink);outline:none;resize:vertical}
.input:focus,.textarea:focus{border-color:var(--green);background:#fff}
.field.err .textarea{border-color:var(--red);background:var(--redSoft)}
.qps{display:flex;flex-wrap:wrap;gap:0.375rem;margin-top:0.375rem}
.qp{min-height:2.375rem;padding:0 0.875rem;border-radius:62.4375rem;border:1.5px solid var(--line);background:#fff;font-size:0.875rem;font-weight:700;color:var(--ink);cursor:pointer;transition:transform .08s ease}
.dateRow{display:flex;gap:0.5rem}
.dateRow .chip{flex:1;max-width:8rem}
.dateInput{min-height:3rem;border-radius:0.75rem;border:1.5px solid var(--line);background:#f7f8f6;padding:0 0.75rem;font-size:0.9375rem;font-weight:700;color:var(--ink);flex:1;min-width:0;outline:none}
.dateInput.on{border-color:var(--ink);background:#fff}

.pFoot{padding:0.75rem 1rem 1rem;flex:none;border-top:1px solid var(--line)}
.btn{width:100%;min-height:3.75rem;border:0;border-radius:0.875rem;background:var(--ink);color:#fff;font-size:1.1875rem;font-weight:800;cursor:pointer;transition:transform .08s ease,opacity .15s}
.btn:disabled{opacity:.6}
.status{margin-top:0.625rem;padding:0.75rem 1rem;border-radius:0.75rem;font-size:0.9375rem;font-weight:700}
.status.ok{background:var(--green2);color:var(--green)}
.status.err{background:var(--redSoft);color:var(--red)}

/* liste */
.ghostBtn{min-height:2.625rem;padding:0 1rem;border-radius:62.4375rem;border:1px solid var(--line);background:#f7f8f6;font-size:0.875rem;font-weight:800;color:var(--ink);cursor:pointer}
.ghostBtn.spin{opacity:.6}
.filter{display:flex;gap:0.375rem;padding:0.75rem 1rem 0;flex:none}
.filter button{min-height:2.5rem;padding:0 0.875rem;border-radius:62.4375rem;border:1.5px solid var(--line);background:#fff;font-size:0.8125rem;font-weight:800;color:var(--muted);cursor:pointer}
.filter button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.group{font-size:0.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0.25rem 0 0.5rem}
.group:not(:first-child){margin-top:1.125rem}
.list{display:flex;flex-direction:column;gap:0.5rem}
.item{padding:0.75rem 0.875rem;border-radius:0.875rem;border:1px solid var(--line);border-left:4px solid var(--red);background:#fff;cursor:pointer}
.item.low{border-left-color:var(--green)}
.item.medium{border-left-color:var(--amber)}
.item.old{background:#fafbfa}
.item:active{background:#f4f5f2}
.itemTop{display:flex;align-items:center;gap:0.5rem}
.itemTitle{flex:1;min-width:0;font-size:1rem;font-weight:800}
.itemMeta{font-size:0.8125rem;color:var(--muted);font-weight:600;margin-top:3px}
.itemDesc{margin-top:0.375rem;font-size:0.9375rem;line-height:1.4;color:var(--ink)}
.itemAgain{margin-top:0.5rem;font-size:0.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.tag{flex:none;font-size:0.6875rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:0.3125rem 0.625rem;border-radius:62.4375rem;background:#eef1ee;color:#59635e}
.tag.sev-high{background:var(--redSoft);color:var(--red)}
.tag.sev-medium{background:var(--amberSoft);color:var(--amber)}
.tag.sev-low{background:var(--green2);color:var(--green)}
.tag.done{background:var(--green2);color:var(--green)}
.empty{padding:2rem 1rem;text-align:center;color:var(--muted);font-weight:700;border:1px dashed var(--line);border-radius:1rem}

iframe.hiddenFrame{display:none;width:0;height:0;border:0}

@media(max-width:820px){
  .page{height:auto;min-height:100vh}
  .grid{grid-template-columns:1fr}
  .pBody{overflow:visible}
}
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <div>
      <div class="kicker" id="dateLine">—</div>
      <div class="h1" data-i18n="title">Fejl & Mangler</div>
    </div>
    <div class="headR">
      <div class="lang" id="langToggle">
        <button type="button" data-lang="da" class="on">DA</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <label class="locWrap"><span class="locLbl" data-i18n="locLabel">Café</span>
        <select id="locSelect" aria-label="Café">
          <option value="Café Kaiser Helsingør">Helsingør</option>
          <option value="Café Kaiser Hillerød">Hillerød</option>
          <option value="Café Kaiser Farum">Farum</option>
          <option value="Café Kaiser Hørsholm">Hørsholm</option>
          <option value="Café Kaiser Vanløse">Vanløse</option>
          <option value="Café Kaiser Sydhavnen">Sydhavnen</option>
          <option value="Café Kaiser Waves">Waves</option>
          <option value="Café Kaiser Nørrebro">Nørrebro</option>
        </select>
      </label>
    </div>
  </header>

  <div class="grid">
    <!-- REGISTRÉR -->
    <section class="panel">
      <div class="pHead">
        <div class="pTitle"><span class="pDot"></span><span data-i18n="formTitle">Registrér fejl</span></div>
        <div class="pCount"><span data-i18n="reqHint">Felter med</span> <span style="color:var(--red)">*</span> <span data-i18n="reqHint2">skal udfyldes</span></div>
      </div>
      <div class="pBody">
        <div class="field" id="fArea">
          <div class="lbl"><span data-i18n="areaLabel">Område</span> <i>*</i></div>
          <div class="chips" id="areaChips"></div>
        </div>

        <div class="field" id="fType">
          <div class="lbl"><span data-i18n="issueTypeLabel">Fejltype</span> <i>*</i></div>
          <div class="chips" id="typeChips"></div>
        </div>

        <div class="row2">
          <div class="field" id="fSev">
            <div class="lbl"><span data-i18n="severityLabel">Alvorlighed</span> <i>*</i></div>
            <div class="seg" id="sevSeg">
              <button type="button" data-v="Low"><span class="dot" style="background:var(--green)"></span><span data-sev="Low">Lav</span></button>
              <button type="button" data-v="Medium"><span class="dot" style="background:var(--amber)"></span><span data-sev="Medium">Mellem</span></button>
              <button type="button" data-v="High"><span class="dot" style="background:var(--red)"></span><span data-sev="High">Høj</span></button>
            </div>
          </div>
          <div class="field">
            <div class="lbl" data-i18n="sourceLabel">Kilde</div>
            <div class="seg" id="srcSeg">
              <button type="button" data-v="Drift"><span data-src="Drift">Drift</span></button>
              <button type="button" data-v="Kitchen"><span data-src="Kitchen">Køkken</span></button>
            </div>
          </div>
        </div>

        <div class="field" id="fDesc">
          <div class="lbl"><span data-i18n="descLabel">Beskrivelse</span> <i>*</i></div>
          <textarea id="descriptionInput" class="textarea" data-i18n-ph="descPlaceholder" placeholder="Beskriv fejlen eller manglen..."></textarea>
          <div class="qps" id="qps"></div>
        </div>

        <div class="field" style="margin-bottom:0">
          <div class="lbl" data-i18n="dateLabel">Dato</div>
          <div class="dateRow">
            <button type="button" class="chip" data-d="0" data-i18n="today">I dag</button>
            <button type="button" class="chip" data-d="-1" data-i18n="yesterday">I går</button>
            <input id="dateInput" class="dateInput" type="date" />
          </div>
        </div>

        <!-- skjulte værdier (samme felter og værdier som før) -->
        <select id="areaInput" class="hidden" data-optgroup="area">
          <option value="">Vælg område</option>
          <option value="Restaurant">Restaurant</option>
          <option value="Bar">Bar</option>
          <option value="Kitchen">Køkken</option>
          <option value="Toilets">Toiletter</option>
          <option value="Storage">Lager</option>
          <option value="Outdoor">Udeservering</option>
          <option value="Technical">Teknisk</option>
          <option value="Other">Andet</option>
        </select>
        <select id="issueTypeInput" class="hidden" data-optgroup="issueType">
          <option value="">Vælg type</option>
          <option value="Equipment">Udstyr</option>
          <option value="Electricity">El</option>
          <option value="Water">Vand</option>
          <option value="IT / POS">IT / POS</option>
          <option value="Furniture">Møbler</option>
          <option value="Cleaning / Hygiene">Rengøring / hygiejne</option>
          <option value="Missing item">Mangel på udstyr</option>
          <option value="Other">Andet</option>
        </select>
        <select id="severityInput" class="hidden" data-optgroup="severity">
          <option value="">Vælg alvorlighed</option>
          <option value="Low">Lav</option>
          <option value="Medium">Mellem</option>
          <option value="High">Høj</option>
        </select>
        <select id="sourceInput" class="hidden" data-optgroup="source">
          <option value="Drift">Drift</option>
          <option value="Kitchen">Køkken</option>
        </select>
      </div>
      <div class="pFoot">
        <button class="btn" id="submitBtn" type="button" data-i18n="submit">Send fejl</button>
        <div class="status hidden" id="statusBox"></div>
      </div>
    </section>

    <!-- LISTE -->
    <section class="panel">
      <div class="pHead">
        <div class="pTitle"><span class="pDot green"></span><span id="listTitle" data-i18n="listTitle">Seneste fejl & mangler</span></div>
        <button class="ghostBtn" id="refreshBtn" type="button" data-i18n="refresh">Opdater</button>
      </div>
      <div class="filter" id="filter">
        <button type="button" data-f="all" class="on"></button>
        <button type="button" data-f="high"></button>
      </div>
      <div class="pBody" id="itemList"><div class="empty">…</div></div>
    </section>
  </div>
</div>

<iframe name="saveTarget" class="hiddenFrame"></iframe>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw8ztJIUOk-4GkhkTwHbpJiSOi7uJjPivpWc5skVr0KXJ1m-j3dcVNF3BSe3sbnWIds/exec";
const $ = id => document.getElementById(id);

// ===== i18n =====
// Kun visningstekster ændres. Værdierne i felterne er ens på DA og EN,
// så det der sendes til arket er det samme.
const I18N = {
  da: {
    title: "Fejl & Mangler", locLabel: "Café", formTitle: "Registrér fejl",
    reqHint: "Felter med", reqHint2: "skal udfyldes",
    areaLabel: "Område", issueTypeLabel: "Fejltype", severityLabel: "Alvorlighed", sourceLabel: "Kilde",
    descLabel: "Beskrivelse", descPlaceholder: "Beskriv fejlen eller manglen...",
    dateLabel: "Dato", today: "I dag", yesterday: "I går",
    refresh: "Opdater", submit: "Send fejl", submitting: "Sender…",
    listTitle: "Seneste fejl & mangler",
    fAll: "Alle", fHigh: "Kun høj alvor",
    todayGrp: "I dag", earlierGrp: "Tidligere",
    noToday: "Ingen fejl i dag", empty: "Ingen fejl eller mangler registreret endnu",
    emptyHigh: "Ingen med høj alvor", loadError: "Kunne ikke hente listen – tryk Opdater",
    validation: "Udfyld område, fejltype, alvorlighed og beskrivelse.",
    saved: "Fejlen er gemt", again: "Tryk for at melde igen", copied: "Område, type og alvor er udfyldt – tilføj beskrivelse",
    statusMap: { open:"Åben", resolved:"Løst", closed:"Lukket", yes:"Løst", no:"Åben", done:"Løst" },
    area:      { Restaurant:"Restaurant", Bar:"Bar", Kitchen:"Køkken", Toilets:"Toiletter", Storage:"Lager", Outdoor:"Udeservering", Technical:"Teknisk", Other:"Andet" },
    issueType: { Equipment:"Udstyr", Electricity:"El", Water:"Vand", "IT / POS":"IT / POS", Furniture:"Møbler", "Cleaning / Hygiene":"Rengøring / hygiejne", "Missing item":"Mangel på udstyr", Other:"Andet" },
    severity:  { Low:"Lav", Medium:"Mellem", High:"Høj" },
    source:    { Drift:"Drift", Kitchen:"Køkken" },
    phrases:   ["Virker ikke", "Går i stykker", "Lækker", "Mangler", "Larmer", "Lugter", "Må ikke bruges", "Skal tilses"]
  },
  en: {
    title: "Faults & Issues", locLabel: "Café", formTitle: "Log a fault",
    reqHint: "Fields with", reqHint2: "are required",
    areaLabel: "Area", issueTypeLabel: "Fault type", severityLabel: "Severity", sourceLabel: "Source",
    descLabel: "Description", descPlaceholder: "Describe the fault or issue...",
    dateLabel: "Date", today: "Today", yesterday: "Yesterday",
    refresh: "Refresh", submit: "Submit fault", submitting: "Sending…",
    listTitle: "Latest faults & issues",
    fAll: "All", fHigh: "High severity only",
    todayGrp: "Today", earlierGrp: "Earlier",
    noToday: "No faults today", empty: "No faults or issues logged yet",
    emptyHigh: "None with high severity", loadError: "Could not load the list – tap Refresh",
    validation: "Fill in area, fault type, severity and description.",
    saved: "Fault saved", again: "Tap to log again", copied: "Area, type and severity filled in – add a description",
    statusMap: { open:"Open", resolved:"Resolved", closed:"Closed", yes:"Resolved", no:"Open", done:"Resolved" },
    area:      { Restaurant:"Restaurant", Bar:"Bar", Kitchen:"Kitchen", Toilets:"Toilets", Storage:"Storage", Outdoor:"Outdoor seating", Technical:"Technical", Other:"Other" },
    issueType: { Equipment:"Equipment", Electricity:"Electricity", Water:"Water", "IT / POS":"IT / POS", Furniture:"Furniture", "Cleaning / Hygiene":"Cleaning / Hygiene", "Missing item":"Missing item", Other:"Other" },
    severity:  { Low:"Low", Medium:"Medium", High:"High" },
    source:    { Drift:"Operations", Kitchen:"Kitchen" },
    phrases:   ["Not working", "Broken", "Leaking", "Missing", "Noisy", "Smells", "Do not use", "Needs service"]
  }
};
const state = { lang: "da", filter: "all" };
const t = () => I18N[state.lang];

// ===== Hjælpere =====
function isoDate(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function isoToday(){ return isoDate(new Date()); }
function isoOffset(n){ const d = new Date(); d.setDate(d.getDate()+n); return isoDate(d); }
function escapeHtml(s){ return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])); }
function fmtDate(iso){
  const s = String(iso || "").slice(0,10);
  if (!s) return "—";
  if (s === isoToday()) return t().today;
  if (s === isoOffset(-1)) return t().yesterday;
  const p = s.split("-"); return p.length === 3 ? (+p[2]) + "/" + (+p[1]) : s;
}
function sevKey(sev){
  const s = String(sev || "").toLowerCase();
  if (s === "low" || s === "lav") return "low";
  if (s === "medium" || s === "mellem") return "medium";
  return "high";
}

let statusTimer = null;
function setStatus(msg, type){
  const b = $("statusBox");
  b.className = "status " + (type === "ok" ? "ok" : "err");
  b.textContent = msg;
  clearTimeout(statusTimer);
  if (type === "ok") statusTimer = setTimeout(clearStatus, 4000);
}
function clearStatus(){ $("statusBox").className = "status hidden"; $("statusBox").textContent = ""; }

// ===== Knapper styrer de skjulte felter =====
function renderChips(boxId, selId, group, fieldId){
  const cur = $(selId).value;
  const labels = t()[group];
  $(boxId).innerHTML = Object.keys(labels).map(k =>
    `<button type="button" class="chip ${cur===k?"on":""}" data-c="${escapeHtml(k)}">${escapeHtml(labels[k])}</button>`).join("");
  $(boxId).querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    $(selId).value = b.dataset.c; $(fieldId).classList.remove("err"); renderChips(boxId, selId, group, fieldId);
  }));
}
function renderForm(){
  renderChips("areaChips", "areaInput", "area", "fArea");
  renderChips("typeChips", "issueTypeInput", "issueType", "fType");
  $("qps").innerHTML = t().phrases.map(p => `<button type="button" class="qp">${escapeHtml(p)}</button>`).join("");
  $("qps").querySelectorAll(".qp").forEach(b => b.addEventListener("click", () => {
    const ta = $("descriptionInput");
    const cur = ta.value.trim();
    ta.value = cur ? (/[.!?]$/.test(cur) ? cur + " " : cur + ". ") + b.textContent + ". " : b.textContent + ". ";
    $("fDesc").classList.remove("err");
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }));
}
function bindSeg(segId, selId, fieldId){
  const seg = $(segId);
  const sync = () => seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === $(selId).value));
  seg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    $(selId).value = b.dataset.v; if (fieldId) $(fieldId).classList.remove("err"); sync();
  }));
  sync();
  return sync;
}
let syncSev, syncSrc;
function syncDateChips(){
  const v = $("dateInput").value; let match = false;
  document.querySelectorAll(".dateRow .chip").forEach(b => { const on = v === isoOffset(+b.dataset.d); b.classList.toggle("on", on); if (on) match = true; });
  $("dateInput").classList.toggle("on", !match && !!v);
}

// ===== Netværk =====
function jsonp(url, params = {}){
  return new Promise((resolve, reject) => {
    const cb = "__cb_" + Math.random().toString(16).slice(2);
    const qs = new URLSearchParams({ ...params, callback: cb }).toString();
    const s = document.createElement("script");
    const tm = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 15000);
    function cleanup(){ clearTimeout(tm); try{ delete window[cb]; }catch(_){} if (s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = data => { cleanup(); resolve(data); };
    s.src = url + (url.includes("?") ? "&" : "?") + qs; s.async = true;
    s.onerror = () => { cleanup(); reject(new Error("load error")); };
    document.body.appendChild(s);
  });
}

// ===== Liste =====
let lastItems = null;      // null = indlæser, [] = ingen
let loadFailed = false;

function renderItems(){
  const box = $("itemList");
  if (loadFailed){ box.innerHTML = `<div class="empty">${escapeHtml(t().loadError)}</div>`; return; }
  if (lastItems === null){ box.innerHTML = `<div class="empty">…</div>`; return; }
  if (!lastItems.length){ box.innerHTML = `<div class="empty">${escapeHtml(t().empty)}</div>`; return; }

  let items = lastItems.slice();
  if (state.filter === "high") items = items.filter(i => sevKey(i.severity) === "high");
  if (!items.length){ box.innerHTML = `<div class="empty">${escapeHtml(t().emptyHigh)}</div>`; return; }

  const rank = { high:0, medium:1, low:2 };
  const today = isoToday();
  const dayOf = i => String(i.date || "").slice(0,10);
  const now = items.filter(i => dayOf(i) === today).sort((a,b) => rank[sevKey(a.severity)] - rank[sevKey(b.severity)]);
  const old = items.filter(i => dayOf(i) !== today);

  const row = (item, isOld, idx) => {
    const sk = sevKey(item.severity);
    const st = String(item.status || "").trim();
    const resolved = /^(yes|ja|løst|resolved|closed|lukket|done)$/i.test(st);
    const stTxt = t().statusMap[st.toLowerCase()] || st;
    const areaTxt = t().area[item.area] || item.area || "";
    const typeTxt = t().issueType[item.issueType] || item.issueType || "";
    const title = [areaTxt, typeTxt].filter(Boolean).join(" · ") || "—";
    const src = item.source ? (t().source[item.source] || item.source) : "";
    return `
      <div class="item ${sk} ${isOld?"old":""}" data-i="${idx}">
        <div class="itemTop">
          <div class="itemTitle">${escapeHtml(title)}</div>
          <span class="tag sev-${sk}">${escapeHtml(t().severity[sk.charAt(0).toUpperCase()+sk.slice(1)] || item.severity || "")}</span>
          ${st ? `<span class="tag ${resolved?"done":""}">${escapeHtml(stTxt)}</span>` : ""}
        </div>
        <div class="itemMeta">${escapeHtml(fmtDate(item.date))}${src ? " · " + escapeHtml(src) : ""}</div>
        ${item.description ? `<div class="itemDesc">${escapeHtml(item.description)}</div>` : ""}
        <div class="itemAgain">${escapeHtml(t().again)}</div>
      </div>`;
  };

  const shown = now.concat(old);
  window.__shown = shown;
  let html = `<div class="group">${escapeHtml(t().todayGrp)} (${now.length})</div>`;
  html += now.length ? '<div class="list">' + now.map((i,k) => row(i,false,k)).join("") + '</div>' : `<div class="empty">${escapeHtml(t().noToday)}</div>`;
  if (old.length) html += `<div class="group">${escapeHtml(t().earlierGrp)}</div><div class="list">` + old.map((i,k) => row(i,true,now.length+k)).join("") + '</div>';
  box.innerHTML = html;

  box.querySelectorAll(".item").forEach(el => el.addEventListener("click", () => reuse(shown[+el.dataset.i])));
}

// Tryk på en eksisterende fejl: område, type og alvor kopieres over i formularen
function reuse(item){
  if (!item) return;
  const setIf = (id, v, grp) => { if (v && Array.from($(id).options).some(o => o.value === v)) $(id).value = v; };
  setIf("areaInput", item.area); setIf("issueTypeInput", item.issueType);
  const sv = Array.from($("severityInput").options).find(o => o.value.toLowerCase() === String(item.severity||"").toLowerCase());
  if (sv) $("severityInput").value = sv.value;
  setIf("sourceInput", item.source);
  ["fArea","fType","fSev"].forEach(f => $(f).classList.remove("err"));
  renderChips("areaChips", "areaInput", "area", "fArea");
  renderChips("typeChips", "issueTypeInput", "issueType", "fType");
  syncSev(); syncSrc();
  $("descriptionInput").focus();
  setStatus(t().copied, "ok");
}

async function loadItems(){
  loadFailed = false; lastItems = null; renderItems();
  $("refreshBtn").classList.add("spin");
  const loc = $("locSelect").value;
  try{
    const data = await jsonp(SCRIPT_URL, { action:"getFaultsIssues", loc });
    lastItems = (data && data.ok && Array.isArray(data.items)) ? data.items : [];
  }catch(e){
    loadFailed = true;
  }finally{
    $("refreshBtn").classList.remove("spin");
    renderItems();
  }
}

// ===== Send =====
function submitItem(){
  clearStatus();
  const location = $("locSelect").value;
  const date = $("dateInput").value;
  const area = ($("areaInput").value || "").trim();
  const issueType = ($("issueTypeInput").value || "").trim();
  const severity = ($("severityInput").value || "").trim();
  const description = ($("descriptionInput").value || "").trim();
  const source = ($("sourceInput").value || "").trim();

  $("fArea").classList.toggle("err", !area);
  $("fType").classList.toggle("err", !issueType);
  $("fSev").classList.toggle("err", !severity);
  $("fDesc").classList.toggle("err", !description);
  if (!date || !location || !area || !issueType || !severity || !description){
    setStatus(t().validation, "err");
    return;
  }

  const btn = $("submitBtn");
  btn.disabled = true; btn.textContent = t().submitting;

  const form = document.createElement("form");
  form.method = "POST"; form.action = SCRIPT_URL; form.target = "saveTarget"; form.style.display = "none";
  const fields = { action:"addFaultIssue", date, location, area, issueType, severity, description, source };
  Object.keys(fields).forEach(k => { const i = document.createElement("input"); i.type = "hidden"; i.name = k; i.value = fields[k]; form.appendChild(i); });
  document.body.appendChild(form);
  form.submit();

  setTimeout(() => {
    form.remove();
    btn.disabled = false; btn.textContent = t().submit;
    $("areaInput").value = ""; $("issueTypeInput").value = ""; $("severityInput").value = "";
    $("descriptionInput").value = ""; $("sourceInput").value = "Drift";
    renderForm(); syncSev(); syncSrc();
    setStatus(t().saved, "ok");
    loadItems();
  }, 1200);
}

// ===== Sprog =====
function applyLang(lang){
  if (!I18N[lang]) lang = "da";
  state.lang = lang;
  try { localStorage.setItem("kaiser_faults_lang", lang); } catch (_) {}
  document.documentElement.lang = lang;
  const d = I18N[lang];
  document.querySelectorAll("#langToggle button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  document.querySelectorAll("[data-i18n]").forEach(el => { const k = el.dataset.i18n; if (d[k] != null) el.textContent = d[k]; });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { const k = el.dataset.i18nPh; if (d[k] != null) el.placeholder = d[k]; });
  document.querySelectorAll("[data-sev]").forEach(el => el.textContent = d.severity[el.dataset.sev]);
  document.querySelectorAll("[data-src]").forEach(el => el.textContent = d.source[el.dataset.src]);
  document.title = "Kaiser – " + d.title;
  $("dateLine").textContent = new Date().toLocaleDateString(lang === "da" ? "da-DK" : "en-GB", { weekday:"long", day:"numeric", month:"long" });
  const fb = $("filter").querySelectorAll("button");
  fb[0].textContent = d.fAll; fb[1].textContent = d.fHigh;
  renderForm();
  renderItems();
}

// ===== Start =====
(function init(){
  $("dateInput").value = isoToday();

  let savedLang = "da";
  try { savedLang = localStorage.getItem("kaiser_faults_lang") || "da"; } catch (_) {}

  const locQS = new URLSearchParams(location.search).get("loc") || "";
  if (locQS){
    const wanted = ("Café Kaiser " + locQS.trim()).toLowerCase();
    const m = Array.from($("locSelect").options).find(o => o.value.toLowerCase() === wanted);
    if (m) $("locSelect").value = m.value;
  }

  syncSev = bindSeg("sevSeg", "severityInput", "fSev");
  syncSrc = bindSeg("srcSeg", "sourceInput", null);
  applyLang(savedLang);
  syncDateChips();
  loadItems();

  $("locSelect").addEventListener("change", loadItems);
  $("dateInput").addEventListener("change", syncDateChips);
  document.querySelectorAll(".dateRow .chip").forEach(b => b.addEventListener("click", () => { $("dateInput").value = isoOffset(+b.dataset.d); syncDateChips(); }));
  $("descriptionInput").addEventListener("input", () => $("fDesc").classList.remove("err"));
  $("refreshBtn").addEventListener("click", loadItems);
  $("submitBtn").addEventListener("click", submitItem);
  $("langToggle").addEventListener("click", e => { const b = e.target.closest("button"); if (b) applyLang(b.dataset.lang); });
  $("filter").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.filter = b.dataset.f;
    $("filter").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    renderItems();
  });
})();
</script>
