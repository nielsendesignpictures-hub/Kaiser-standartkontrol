.macros{

}

.counter{

  gap:10px;

.counter button{

  height:34px;

  border-radius:10px;
  background:#ede4da;
  font-size:18px;

.counter-value{

.addon{

  padding-top:14px;
  border-top:1px solid #eee5dc;
  font-size:13px;

}

.addon input{

}

.sticky{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(10px);
  border-top:1px solid #e7ddd3;
  padding:18px;
  text-align:center;
}

.total{
  font-size:24px;
  font-weight:bold;
}

.total-macros{
  margin-top:6px;
  font-size:13px;
  color:#6f655d;
}

.disclaimer{
  margin-top:8px;
  font-size:11px;
  color:#91867a;
  line-height:1.5;
}

</style>

let total = {
  kcal:0,
  protein:0,
  carbs:0,
  fat:0
};

function updateTotals(){

  document.getElementById("totalKcal").innerText =
    Math.round(total.kcal) + " kcal";

  document.getElementById("totalMacros").innerText =
    "Protein " + Math.round(total.protein) + "g | " +
    "Kulhydrat " + Math.round(total.carbs) + "g | " +
    "Fedt " + Math.round(total.fat) + "g";
}

function calculateItem(item, quantity, addonEnabled){

  let kcal = item.kcal * quantity;
  let protein = item.protein * quantity;
  let carbs = item.carbs * quantity;
  let fat = item.fat * quantity;

  if(addonEnabled && item.addon){

    kcal += item.addon.kcal * quantity;
    protein += item.addon.protein * quantity;
    carbs += item.addon.carbs * quantity;
    fat += item.addon.fat * quantity;
  }

  return {
    kcal,
    protein,
    carbs,
    fat
  };
}

function recalculateTotals(){

  total = {
    kcal:0,
    protein:0,
    carbs:0,
    fat:0
  };

  document.querySelectorAll(".item").forEach(itemEl => {

    const itemData = JSON.parse(itemEl.dataset.item);
    const quantity = parseInt(itemEl.dataset.quantity);
    const addonEnabled = itemEl.querySelector(".addon-check")?.checked;

    if(quantity > 0){

      const values = calculateItem(itemData, quantity, addonEnabled);

      total.kcal += values.kcal;
      total.protein += values.protein;
      total.carbs += values.carbs;
      total.fat += values.fat;
    }

  });

  updateTotals();
}

function renderMenu(){

  const container = document.getElementById("menu");

  menu.forEach(section => {

    const sectionEl = document.createElement("div");
    sectionEl.className = "section";

    sectionEl.innerHTML = `<h2>${section.category}</h2>`;

    section.items.forEach(item => {

      const itemEl = document.createElement("div");
      itemEl.className = "item";

      itemEl.dataset.item = JSON.stringify(item);
      itemEl.dataset.quantity = 0;

      itemEl.innerHTML = `

        <div class="item-top">

          <div>

            <div class="item-name">
              ${item.name}
            </div>

            <div class="kcal">
              ${Math.round(item.kcal)} kcal
            </div>

            <div class="macros">
              Protein ${item.protein}g |
              Kulhydrat ${item.carbs}g |
              Fedt ${item.fat}g
            </div>

          </div>

          <div class="counter">

            <button class="minus">−</button>

            <div class="counter-value">0</div>

            <button class="plus">+</button>

          </div>

        </div>

        ${
          item.addon ? `
          <div class="addon">
            <label>
              <input type="checkbox" class="addon-check" disabled>
              ${item.addon.name}
              (${Math.abs(item.addon.kcal)} kcal)
            </label>
          </div>
          ` : ""
        }

      `;

      const plusBtn = itemEl.querySelector(".plus");
      const minusBtn = itemEl.querySelector(".minus");
      const counterValue = itemEl.querySelector(".counter-value");
      const addonCheckbox = itemEl.querySelector(".addon-check");

      plusBtn.addEventListener("click", () => {

        let quantity = parseInt(itemEl.dataset.quantity);

        quantity++;

        itemEl.dataset.quantity = quantity;
        counterValue.innerText = quantity;

        itemEl.classList.add("active");

        if(addonCheckbox){
          addonCheckbox.disabled = false;
        }

        recalculateTotals();
      });

      minusBtn.addEventListener("click", () => {

        let quantity = parseInt(itemEl.dataset.quantity);

        if(quantity > 0){
          quantity--;
        }

        itemEl.dataset.quantity = quantity;
        counterValue.innerText = quantity;

        if(quantity === 0){

          itemEl.classList.remove("active");

          if(addonCheckbox){
            addonCheckbox.checked = false;
            addonCheckbox.disabled = true;
          }
        }

        recalculateTotals();
      });

      if(addonCheckbox){

        addonCheckbox.addEventListener("change", () => {
          recalculateTotals();
        });
      }

      sectionEl.appendChild(itemEl);

    });

    container.appendChild(sectionEl);

  });

}

renderMenu();
