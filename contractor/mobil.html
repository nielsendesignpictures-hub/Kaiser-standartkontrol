<style>
/* ============================================================
   KAISER HÅNDVÆRKER · Design tokens
   ============================================================ */
:root{
  --espresso:#1D1712;
  --espresso-2:#2A211A;
  --paper:#F3EFE8;
  --card:#FFFDF9;
  --ink:#26201A;
  --muted:#8A7F73;
  --line:#E4DCD0;
  --red:#C4442E;
  --red-soft:#F9E8E4;
  --amber:#D9903F;
  --amber-soft:#F8EEDF;
  --green:#2E7D4F;
  --green-soft:#E5F0E9;
  --radius:14px;
  --nav-h:64px;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html{ height:100%; }

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}

button, input, textarea, select{ font-family:inherit; font-size:16px; }

/* ---------- Topbar ---------- */
.topbar{
  background:var(--espresso);
  color:#F3EDE4;
  padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.brand{ display:flex; align-items:center; gap:10px; min-width:0; }
.brand .mark{
  width:34px; height:34px; border-radius:9px; flex:none;
  background:var(--espresso-2);
  display:grid; place-items:center;
  border:1px solid rgba(255,255,255,.12);
}
.brand .mark svg{ width:20px; height:20px; }
.brand h1{
  margin:0; font-size:16px; font-weight:700; letter-spacing:.3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.brand small{ display:block; font-size:11px; font-weight:400; color:#B9AC9C; letter-spacing:.6px; text-transform:uppercase; }

.sync{
  display:flex; align-items:center; gap:8px; flex:none;
  font-size:12px; color:#CFC4B6;
}
.sync .dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--green); box-shadow:0 0 0 3px rgba(46,125,79,.25);
}
.sync.offline .dot{ background:var(--amber); box-shadow:0 0 0 3px rgba(217,144,63,.25); }
.sync.busy .dot{ background:#CFC4B6; animation:pulse 1s infinite; }
@keyframes pulse{ 50%{ opacity:.35; } }

.refresh-btn{
  background:var(--espresso-2); color:#F3EDE4;
  border:1px solid rgba(255,255,255,.14);
  border-radius:10px; padding:8px 10px; cursor:pointer;
  display:grid; place-items:center;
}
.refresh-btn:active{ transform:scale(.94); }
.refresh-btn svg{ width:16px; height:16px; }
.refresh-btn.spinning svg{ animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---------- Offline / kø banner ---------- */
.banner{
  display:none;
  background:var(--amber-soft); color:#7A5220;
  border-bottom:1px solid #EAD9BC;
  padding:10px 16px; font-size:13px;
}
.banner.show{ display:block; }

/* ---------- KPI-strip ---------- */
.kpis{
  display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
  padding:14px 16px 4px;
  max-width:900px; margin:0 auto;
}
.kpi{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:10px 8px; text-align:center;
}
.kpi b{ display:block; font-size:22px; font-weight:800; line-height:1.1; }
.kpi span{ font-size:11px; color:var(--muted); letter-spacing:.4px; text-transform:uppercase; }
.kpi.k-high b{ color:var(--red); }
.kpi.k-plan b{ color:var(--amber); }
.kpi.k-done b{ color:var(--green); }

/* ---------- Lokations-chips ---------- */
.chips{
  display:flex; gap:8px; overflow-x:auto; padding:12px 16px 4px;
  scrollbar-width:none; max-width:900px; margin:0 auto;
}
.chips::-webkit-scrollbar{ display:none; }
.chip{
  flex:none; border:1px solid var(--line); background:var(--card);
  color:var(--ink); border-radius:999px; padding:8px 14px;
  font-size:14px; cursor:pointer; white-space:nowrap;
}
.chip .n{ color:var(--muted); font-size:12px; margin-left:4px; }
.chip.active{ background:var(--espresso); color:#F3EDE4; border-color:var(--espresso); }
.chip.active .n{ color:#B9AC9C; }

/* ---------- Sags-kort ---------- */
.list{ padding:12px 16px 24px; max-width:900px; margin:0 auto; }

.card{
  position:relative;
  background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px 16px 16px 22px;
  margin-bottom:14px;
  overflow:hidden;
}
.card::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:6px;
  background:var(--muted);
}
.card.sev-high::before{ background:var(--red); }
.card.sev-medium::before{ background:var(--amber); }
.card.sev-low::before{ background:var(--green); }

.card.leaving{ opacity:0; transform:translateX(24px); transition:.25s ease; }

.card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.card-top h3{ margin:0; font-size:16px; font-weight:800; }
.meta{ margin:2px 0 0; font-size:12.5px; color:var(--muted); }

.badge{
  flex:none; font-size:11px; font-weight:700; letter-spacing:.4px;
  padding:4px 10px; border-radius:999px; text-transform:uppercase;
}
.badge.high{ background:var(--red-soft); color:var(--red); }
.badge.medium{ background:var(--amber-soft); color:#9A6320; }
.badge.low{ background:var(--green-soft); color:var(--green); }

.desc{ margin:10px 0 0; font-size:15px; line-height:1.45; overflow-wrap:anywhere; }

/* Dotted leader line — som på POS-dashboardet */
.leader{
  display:flex; align-items:baseline; gap:8px;
  margin-top:12px; font-size:13.5px;
}
.leader .lbl{ color:var(--muted); flex:none; }
.leader .dots{
  flex:1; border-bottom:2px dotted var(--line);
  transform:translateY(-3px);
}
.leader .val{ flex:none; font-weight:700; }
.leader .val.overdue{ color:var(--red); }
.leader .val.none{ color:var(--muted); font-weight:400; font-style:italic; }

/* ---------- Handlinger ---------- */
.actions{ display:flex; gap:8px; margin-top:14px; }
.actions input[type="date"]{
  flex:1; min-width:0;
  padding:12px; border:1px solid var(--line); border-radius:10px;
  background:#fff; appearance:none; -webkit-appearance:none;
}
.btn{
  border:none; border-radius:10px; padding:12px 14px;
  font-weight:700; cursor:pointer; font-size:15px;
}
.btn:active{ transform:scale(.97); }
.btn-dark{ background:var(--espresso); color:#F3EDE4; }
.btn-done{ background:var(--green); color:#fff; flex:none; display:flex; align-items:center; gap:6px; }
.btn-done svg{ width:16px; height:16px; }
.btn[disabled]{ opacity:.5; pointer-events:none; }

/* ---------- Kommentarer ---------- */
.thread{ margin-top:14px; border-top:1px dashed var(--line); padding-top:12px; }
.msg{
  background:var(--paper); border-radius:10px;
  padding:10px 12px; margin-bottom:8px; font-size:14px;
}
.msg .who{ font-weight:700; font-size:12.5px; }
.msg .when{ color:var(--muted); font-size:11.5px; margin-left:6px; }
.msg p{ margin:4px 0 0; overflow-wrap:anywhere; }
.msg.mine{ background:var(--green-soft); }
.msg.pending{ opacity:.65; }
.msg.pending .when::after{ content:" · sender…"; }

.reply{ display:flex; gap:8px; margin-top:8px; }
.reply textarea{
  flex:1; min-height:44px; max-height:140px; resize:vertical;
  padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff;
}
.reply .btn{ align-self:flex-end; }

/* ---------- Tom tilstand / skeleton ---------- */
.empty{
  text-align:center; color:var(--muted); padding:56px 20px;
}
.empty .big{ font-size:40px; }
.skeleton .card{ min-height:120px; }
.skeleton .bar{
  height:12px; border-radius:6px; background:var(--line);
  margin-bottom:10px; animation:pulse 1.2s infinite;
}
.skeleton .bar.w60{ width:60%; } .skeleton .bar.w90{ width:90%; } .skeleton .bar.w40{ width:40%; }

/* ---------- Bund-navigation ---------- */
.nav{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--card); border-top:1px solid var(--line);
  display:flex;
}
.nav button{
  flex:1; background:none; border:none; cursor:pointer;
  font-size:13px; font-weight:700; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
}
.nav button svg{ width:20px; height:20px; }
.nav button.active{ color:var(--espresso); }
.nav .cnt{
  font-size:10.5px; background:var(--red); color:#fff;
  border-radius:999px; padding:1px 6px; font-weight:800;
  position:absolute; transform:translate(16px,-26px);
}
.nav .cnt.zero{ display:none; }
.nav button{ position:relative; }

/* ---------- Toast ---------- */
.toast{
  position:fixed; left:50%; bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px);
  background:var(--espresso); color:#F3EDE4;
  padding:11px 18px; border-radius:999px; font-size:14px;
  opacity:0; pointer-events:none; transition:.25s ease; z-index:40;
  white-space:nowrap;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* ---------- Desktop ---------- */
@media(min-width:768px){
  body{ padding-bottom:0; }
  .nav{ display:none; }
  .topbar{ padding:16px 28px; }
  .tabs-desktop{ display:flex; gap:6px; }
  .tabs-desktop button{
    background:var(--espresso-2); color:#CFC4B6;
    border:1px solid rgba(255,255,255,.12);
    border-radius:10px; padding:9px 18px; cursor:pointer; font-weight:700; font-size:14px;
  }
  .tabs-desktop button.active{ background:#F3EDE4; color:var(--espresso); border-color:#F3EDE4; }
  .list{ padding-bottom:60px; }
}
@media(max-width:767px){
  .tabs-desktop{ display:none; }
}

@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>

<!-- ============ MOBIL NAV ============ -->
<nav class="nav">
  <button id="tab-open" class="active" onclick="setView('open')">
    <span class="cnt zero" id="navOpenCnt">0</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    Åbne

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4 12 14l-3-3"/>
    </svg>
    Færdige
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ==========================================================
   KONFIGURATION
   Skift API_URL hvis du deployer et nyt Apps Script.
   Backend-kontrakt (uændret fra den gamle app):
     GET  ?callback=cb                → { issues:[], comments:[] }
     GET  ?action=update&id=...       → opdatering (status / estimatedCompletion / comment)
   ========================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbx90unEejk2SC4TVBHA0JZXz7ZSwrKp3tUr92L8gX_JbyhBDsSADsihl-RNf0UvEsda/exec";
const AUTHOR       = "Håndværker";
const POLL_MS      = 30000;   // baggrundsopdatering
const JSONP_TIMEOUT= 12000;
const LS_DATA      = "kaiserHV.data.v1";
const LS_QUEUE     = "kaiserHV.queue.v1";

/* ---------- State ---------- */
let ISSUES = [], COMMENTS = [];
let VIEW = "open", LOCATION = null;
let isLoading = false, isEditing = false;
let pollTimer = null;

/* ---------- Hjælpere ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove("show"), 2200);
}

function fmtDate(str){
  if(!str) return "";
  const d = new Date(str);
  if(isNaN(d)) return "";
  return d.toLocaleDateString("da-DK",{day:"numeric",month:"short"});
}
function fmtDateTime(str){
  if(!str) return "";
  const d = new Date(str);
  if(isNaN(d)) return "";
  return d.toLocaleDateString("da-DK",{day:"numeric",month:"short"}) + " " +
         d.toLocaleTimeString("da-DK",{hour:"2-digit",minute:"2-digit"});
}
function isoDay(str){
  if(!str) return "";
  const d = new Date(str);
  if(isNaN(d)) return "";
  return d.toISOString().split("T")[0];
}

function setSync(state, text){
  const s = $("sync");
  s.className = "sync" + (state ? " " + state : "");
  $("syncText").textContent = text;
}

/* ==========================================================
   1) ØJEBLIKKELIG START — render straks fra localStorage
   ========================================================== */
(function boot(){
  try{
    const cached = JSON.parse(localStorage.getItem(LS_DATA) || "null");
    if(cached && Array.isArray(cached.issues)){
      ISSUES = cached.issues;
      COMMENTS = cached.comments || [];
      render();
      setSync("busy", "Opdaterer…");
    }
  }catch(e){}
  loadData();
})();

/* ==========================================================
   2) DATA — JSONP med timeout (backend kræver det)
   ========================================================== */
function loadData(manual = false){
  if(isLoading) return;
  if(!navigator.onLine){
    setSync("offline","Offline");
    if(manual) toast("Ingen forbindelse – viser gemte data");
    return;
  }
  isLoading = true;
  setSync("busy", manual ? "Opdaterer…" : "Synker…");
  if(manual) $("refreshBtn").classList.add("spinning");

  const cbName = "__kaiser_cb_" + Date.now();
  const script = document.createElement("script");
  let done = false;

  const cleanup = () => {
    delete window[cbName];
    script.remove();
    isLoading = false;
    $("refreshBtn").classList.remove("spinning");
  };

  const timeout = setTimeout(() => {
    if(done) return;
    done = true;
    cleanup();
    setSync("offline","Serveren svarer ikke");
  }, JSONP_TIMEOUT);

  window[cbName] = (data) => {
    if(done) return;
    done = true;
    clearTimeout(timeout);

    ISSUES   = Array.isArray(data) ? data : (data.issues || []);
    COMMENTS = Array.isArray(data) ? []   : (data.comments || []);

    try{
      localStorage.setItem(LS_DATA, JSON.stringify({issues:ISSUES, comments:COMMENTS, at:Date.now()}));
    }catch(e){}

    if(!isEditing) render();
    setSync("", "Live · " + new Date().toLocaleTimeString("da-DK",{hour:"2-digit",minute:"2-digit"}));
    cleanup();
  };

  script.src = API_URL + "?callback=" + cbName + "&t=" + Date.now();
  script.onerror = () => {
    if(done) return;
    done = true;
    clearTimeout(timeout);
    cleanup();
    setSync("offline","Fejl ved hentning");
  };
  document.body.appendChild(script);
}

/* ==========================================================
   3) OPDATERINGER — optimistisk UI + offline-kø
   ========================================================== */
function queue(){ try{ return JSON.parse(localStorage.getItem(LS_QUEUE)||"[]"); }catch(e){ return []; } }
function saveQueue(q){ localStorage.setItem(LS_QUEUE, JSON.stringify(q)); updateQueueBanner(); }

function updateQueueBanner(){
  const q = queue();
  const b = $("queueBanner");
  if(q.length){
    b.textContent = "⏳ " + q.length + (q.length===1?" ændring":" ændringer") + " venter på forbindelse – sendes automatisk.";
    b.classList.add("show");
  } else {
    b.classList.remove("show");
  }
}

function sendUpdate(params, onDone){
  const qs = new URLSearchParams(params).toString();

  if(!navigator.onLine){
    const q = queue(); q.push(qs); saveQueue(q);
    toast("Gemt – sendes når du er online");
    if(onDone) onDone(false);
    return;
  }

  const script = document.createElement("script");
  script.src = API_URL + "?action=update&" + qs + "&t=" + Date.now();
  script.onload = () => { script.remove(); if(onDone) onDone(true); };
  script.onerror = () => {
    script.remove();
    const q = queue(); q.push(qs); saveQueue(q);
    toast("Kunne ikke sende – prøver igen automatisk");
    if(onDone) onDone(false);
  };
  document.body.appendChild(script);
}

function flushQueue(){
  const q = queue();
  if(!q.length || !navigator.onLine) return;
  saveQueue([]);
  let sent = 0;
  const next = () => {
    if(sent >= q.length){
      toast("Ændringer sendt ✓");
      setTimeout(()=>loadData(), 800);
      return;
    }
    const qs = q[sent++];
    const s = document.createElement("script");
    s.src = API_URL + "?action=update&" + qs + "&t=" + Date.now();
    s.onload = () => { s.remove(); next(); };
    s.onerror = () => { s.remove(); const rest = queue().concat(q.slice(sent-1)); saveQueue(rest); };
    document.body.appendChild(s);
  };
  next();
}

window.addEventListener("online", () => { setSync("","Live"); flushQueue(); loadData(); });
window.addEventListener("offline", () => setSync("offline","Offline"));

/* ---------- Handlinger ---------- */
function markDone(id, btn){
  btn.disabled = true;
  const issue = ISSUES.find(i => String(i.id) === String(id));
  if(issue) issue.status = "Closed";

  const card = document.getElementById("card-" + id);
  if(card){
    card.classList.add("leaving");
    setTimeout(render, 260);
  } else render();

  sendUpdate({ id, status:"Closed" }, ok => { if(ok) toast("Markeret som færdig ✓"); });
  saveLocal();
}

function saveDate(id){
  const input = document.getElementById("date-" + id);
  const date = input?.value;
  if(!date){ toast("Vælg en dato først"); return; }

  const issue = ISSUES.find(i => String(i.id) === String(id));
  if(issue) issue.estimatedCompletion = date;
  render();
  sendUpdate({ id, estimatedCompletion: date }, ok => { if(ok) toast("Dato gemt ✓"); });
  saveLocal();
}

function saveComment(id, location){
  const ta = document.getElementById("comment-" + id);
  const text = ta?.value.trim();
  if(!text) return;

  COMMENTS.push({
    issueId: id, author: AUTHOR, comment: text,
    createdAt: new Date().toISOString(), _pending: true
  });
  ta.value = "";
  isEditing = false;
  render();
  sendUpdate({ id, comment: text, author: AUTHOR, location }, ok => {
    if(ok){
      const c = COMMENTS.find(c => c._pending && c.comment === text);
      if(c) delete c._pending;
      render();
      toast("Kommentar sendt ✓");
    }
  });
  saveLocal();
}

function saveLocal(){
  try{ localStorage.setItem(LS_DATA, JSON.stringify({issues:ISSUES, comments:COMMENTS, at:Date.now()})); }catch(e){}
}

/* ==========================================================
   4) RENDER
   ========================================================== */
function severityRank(s){ return s==="High" ? 0 : s==="Medium" ? 1 : 2; }

function render(){
  const list = $("list");
  const today = new Date().toISOString().split("T")[0];

  /* KPI + lokationsoptælling over ALLE sager */
  let open=0, high=0, plan=0, done=0;
  const locCount = {};
  ISSUES.forEach(i => {
    if(i.status === "Closed"){ done++; return; }
    open++;
    if(i.severity === "High") high++;
    if(i.estimatedCompletion) plan++;
    locCount[i.location] = (locCount[i.location]||0) + 1;
  });
  $("kpiOpen").textContent = open;
  $("kpiHigh").textContent = high;
  $("kpiPlan").textContent = plan;
  $("kpiDone").textContent = done;

  const navCnt = $("navOpenCnt");
  navCnt.textContent = open;
  navCnt.classList.toggle("zero", open === 0);

  /* Lokations-chips */
  const chips = $("chips");
  chips.innerHTML = "";
  const allChip = document.createElement("button");
  allChip.className = "chip" + (LOCATION ? "" : " active");
  allChip.textContent = "Alle";
  allChip.onclick = () => { LOCATION = null; render(); };
  chips.appendChild(allChip);

  Object.keys(locCount).sort().forEach(loc => {
    const c = document.createElement("button");
    c.className = "chip" + (LOCATION === loc ? " active" : "");
    c.innerHTML = esc(loc) + '<span class="n">' + locCount[loc] + '</span>';
    c.onclick = () => { LOCATION = (LOCATION === loc ? null : loc); render(); };
    chips.appendChild(c);
  });

  /* Filtrér + sortér */
  const rows = ISSUES
    .filter(i => VIEW === "open" ? i.status !== "Closed" : i.status === "Closed")
    .filter(i => !LOCATION || i.location === LOCATION)
    .sort((a,b) =>
      severityRank(a.severity) - severityRank(b.severity) ||
      new Date(b.createdAt||0) - new Date(a.createdAt||0)
    );

  if(!rows.length){
    list.innerHTML = VIEW === "open"
      ? '<div class="empty"><div class="big">✅</div><p>Ingen åbne sager' + (LOCATION ? " i " + esc(LOCATION) : "") + '</p></div>'
      : '<div class="empty"><div class="big">📦</div><p>Ingen færdige sager endnu</p></div>';
    return;
  }

  const frag = document.createDocumentFragment();

  rows.forEach(issue => {
    const sev = (issue.severity || "").toLowerCase();
    const planned = isoDay(issue.estimatedCompletion);
    const overdue = planned && planned < today && issue.status !== "Closed";
    const thread = COMMENTS
      .filter(c => String(c.issueId) === String(issue.id))
      .sort((a,b) => new Date(a.createdAt||0) - new Date(b.createdAt||0));

    const card = document.createElement("article");
    card.className = "card sev-" + (sev || "none");
    card.id = "card-" + issue.id;

    card.innerHTML = `
      <div class="card-top">
        <div>
          <h3>${esc(issue.location)}</h3>
          <p class="meta">${esc(issue.area || "")}${issue.area && issue.issueType ? " · " : ""}${esc(issue.issueType || "")}${issue.createdAt ? " · meldt " + fmtDate(issue.createdAt) : ""}</p>
        </div>
        ${issue.severity ? `<span class="badge ${sev}">${esc(issue.severity)}</span>` : ""}
      </div>

      <p class="desc">${esc(issue.description || "")}</p>

      <div class="leader">
        <span class="lbl">Planlagt færdig</span>
        <span class="dots"></span>
        ${planned
          ? `<span class="val${overdue ? " overdue" : ""}">${fmtDate(planned)}${overdue ? " · forsinket" : ""}</span>`
          : `<span class="val none">ikke planlagt</span>`}
      </div>

      ${VIEW === "open" ? `
      <div class="actions">
        <input type="date" id="date-${esc(issue.id)}" value="${planned}"
               onfocus="isEditing=true" onblur="isEditing=false">
        <button class="btn btn-dark" onclick="saveDate('${esc(issue.id)}')">Gem</button>
        <button class="btn btn-done" onclick="markDone('${esc(issue.id)}', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          Færdig
        </button>
      </div>` : ""}

      ${(thread.length || VIEW === "open") ? `
      <div class="thread">
        ${thread.map(c => `
          <div class="msg${c.author === AUTHOR ? " mine" : ""}${c._pending ? " pending" : ""}">
            <span class="who">${esc(c.author)}</span><span class="when">${fmtDateTime(c.createdAt)}</span>
            <p>${esc(c.comment)}</p>
          </div>`).join("")}
        ${VIEW === "open" ? `
        <div class="reply">
          <textarea id="comment-${esc(issue.id)}" placeholder="Skriv status til caféen…"
                    onfocus="isEditing=true" onblur="isEditing=false"></textarea>
          <button class="btn btn-dark" onclick="saveComment('${esc(issue.id)}','${esc(issue.location)}')">Send</button>
        </div>` : ""}
      </div>` : ""}
    `;
    frag.appendChild(card);
  });

  list.innerHTML = "";
  list.appendChild(frag);
}

/* ==========================================================
   5) NAVIGATION + SMART POLLING
   ========================================================== */
function setView(v){
  VIEW = v;
  ["tab-open","tab-closed","tabD-open","tabD-closed"].forEach(id => {
    const el = $(id);
    if(el) el.classList.toggle("active", id.endsWith(v));
  });
  render();
}

function startPolling(){
  stopPolling();
  pollTimer = setInterval(() => {
    if(document.visibilityState === "visible" && !isEditing) loadData();
  }, POLL_MS);
}
function stopPolling(){ if(pollTimer) clearInterval(pollTimer); }

document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible"){
    loadData();          // frisk data når appen åbnes igen
    startPolling();
  } else {
    stopPolling();       // ingen spildte kald i baggrunden
  }
});

startPolling();
updateQueueBanner();
flushQueue();

/* ---------- Service worker ---------- */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>
