<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Café Kaiser – Håndværker Portal</title>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];

OneSignalDeferred.push(async function(OneSignal) {
  await OneSignal.init({
    appId: "74e1dc7f-43a7-4ce5-a4eb-687c22f60472",
    safari_web_id: "web.onesignal.auto.50dac47a-d084-4e57-bf73-88f5ab7beb6e",
    notifyButton: {
      enable: true,
    },
  });
});
</script>

<style>

:root{
  --sidebar:#000;
  --border:#e5e7eb;
  --muted:#6b7280;
  --danger:#dc2626;
  --warning:#f59e0b;
  --success:#16a34a;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  height:100%;
  overflow-x:hidden;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#f3f4f6;
  color:#111;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}

button,input,textarea{
  font-family:inherit;
}

.sidebar{
  width:260px;
  background:#000;
  color:white;
  height:100vh;
  padding:24px 18px;
  overflow-y:auto;
  position:fixed;
  left:0;
  top:0;
}

.logo{
  font-size:22px;
  font-weight:700;
  margin-bottom:30px;
}

.menu-item{
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:8px;
  cursor:pointer;
  transition:0.2s;
}

.menu-item.active{
  background:#1f1f1f;
}

.main{
  margin-left:260px;
  padding:20px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
}

.kpi-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-bottom:20px;
}

.kpi{
  background:white;
  padding:16px;
  border-radius:16px;
  border:1px solid var(--border);
}

.card{
  background:white;
  padding:16px;
  border-radius:16px;
  border:1px solid var(--border);
  margin-bottom:16px;
}

.severity-high{
  color:var(--danger);
  font-weight:700;
}

.severity-medium{
  color:var(--warning);
  font-weight:700;
}

.severity-low{
  color:var(--success);
  font-weight:700;
}

textarea,
input[type="date"]{
  width:100%;
  margin-top:12px;
  padding:14px;
  font-size:16px;
  border-radius:12px;
  border:1px solid #ddd;
  background:white;
  appearance:none;
  -webkit-appearance:none;
}

textarea{
  min-height:110px;
  resize:vertical;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

.btn-dark{
  background:#000;
  color:white;
}

.btn-success{
  background:var(--success);
  color:white;
}

.btn-light{
  background:#ddd;
}

.comment{
  margin-top:10px;
  padding:10px;
  background:#f9fafb;
  border-radius:10px;
  font-size:14px;
}

.loading{
  opacity:0.6;
  pointer-events:none;
}

@media(max-width:768px){

  body{
    display:block;
  }

  .sidebar{
    position:relative;
    width:100%;
    height:auto;
  }

  .main{
    margin-left:0;
    padding:14px;
  }

  .header{
    flex-direction:column;
    align-items:stretch;
  }

  h2{
    margin:0;
  }
}

</style>
</head>

<body>

<div class="sidebar">

  <div class="logo">Café Kaiser</div>

  <div id="nav-open"
       class="menu-item active"
       onclick="setView('open')">
    Åbne sager
  </div>

  <div id="nav-closed"
       class="menu-item"
       onclick="setView('closed')">
    Færdige
  </div>

  <hr>

  <strong style="font-size:13px;color:#aaa;">
    Lokationer
  </strong>

  <div id="locationList"></div>

</div>

<div class="main">

  <div class="header">
    <h2 id="title">Åbne sager</h2>

    <button class="btn-light"
            onclick="loadData()">
      Opdater
    </button>
  </div>

  <div class="kpi-grid">
    <div class="kpi">
      Åbne<br>
      <strong id="kpi-open">0</strong>
    </div>

    <div class="kpi">
      Kritiske<br>
      <strong id="kpi-high">0</strong>
    </div>
  </div>

  <div id="issues"></div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbx90unEejk2SC4TVBHA0JZXz7ZSwrKp3tUr92L8gX_JbyhBDsSADsihl-RNf0UvEsda/exec";

let CURRENT_VIEW = "open";
let CURRENT_LOCATION = null;
let isLoading = false;

document.addEventListener("DOMContentLoaded", () => {
  loadData();
});

function loadData(){

  if(isLoading) return;

  isLoading = true;

  document.body.classList.add("loading");

  const old = document.getElementById("jsonp");

  if(old) old.remove();

  const script = document.createElement("script");

  script.id = "jsonp";

  script.src =
    API_URL +
    "?callback=handleData&t=" +
    Date.now();

  script.onerror = () => {
    isLoading = false;
    document.body.classList.remove("loading");
  };

  document.body.appendChild(script);
}

function handleData(data){

  let issues = [];
  let comments = [];

  if(Array.isArray(data)){
    issues = data;
  } else {
    issues = data.issues || [];
    comments = data.comments || [];
  }

  render(issues, comments);

  isLoading = false;

  document.body.classList.remove("loading");
}

function formatDate(dateString){

  if(!dateString) return "";

  return new Date(dateString)
    .toISOString()
    .split("T")[0];
}

function render(issues, comments){

  const container = document.getElementById("issues");

  container.innerHTML = "";

  let open = 0;
  let high = 0;

  const locationCount = {};

  issues.forEach(issue => {

    if(issue.status !== "Closed") open++;

    if(issue.severity === "High") high++;

    if(issue.status !== "Closed"){
      locationCount[issue.location] =
      (locationCount[issue.location] || 0) + 1;
    }

    if(CURRENT_VIEW === "open" &&
       issue.status === "Closed") return;

    if(CURRENT_VIEW === "closed" &&
       issue.status !== "Closed") return;

    if(CURRENT_LOCATION &&
       issue.location !== CURRENT_LOCATION) return;

    const issueComments =
      comments.filter(c => c.issueId === issue.id);

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <h3>${issue.location}</h3>

      <div class="severity-${(issue.severity || "").toLowerCase()}">
        ${issue.severity || ""}
      </div>

      <p>${issue.description || ""}</p>

      ${CURRENT_VIEW === "open" ? `
      <input type="date"
             id="date-${issue.id}"
             value="${formatDate(issue.estimatedCompletion)}">

      <button class="btn-dark"
              onclick="saveDate('${issue.id}')">
        Gem dato
      </button>

      <button class="btn-success"
              onclick="markDone('${issue.id}')">
        Færdig
      </button>

      <textarea id="comment-${issue.id}"
                placeholder="Skriv status..."></textarea>

      <button class="btn-dark"
              onclick="saveComment('${issue.id}','${issue.location}')">
        Tilføj kommentar
      </button>
      ` : ""}

      ${issueComments.map(c => `
        <div class="comment">
          <strong>${c.author}</strong><br>
          ${c.comment}
        </div>
      `).join("")}
    `;

    container.appendChild(card);
  });

  document.getElementById("kpi-open").innerText = open;
  document.getElementById("kpi-high").innerText = high;

  const locContainer =
    document.getElementById("locationList");

  locContainer.innerHTML = "";

  Object.keys(locationCount).forEach(loc => {

    const div = document.createElement("div");

    div.className = "menu-item";

    div.innerText =
      `${loc} (${locationCount[loc]})`;

    div.onclick = () => filterLocation(loc);

    locContainer.appendChild(div);
  });
}

function saveDate(id){

  const date =
    document.getElementById("date-" + id).value;

  if(!date) return;

  sendUpdate(
    `?action=update&id=${encodeURIComponent(id)}
    &estimatedCompletion=${encodeURIComponent(date)}`
  );
}

function markDone(id){

  sendUpdate(
    `?action=update&id=${encodeURIComponent(id)}
    &status=Closed`
  );
}

function saveComment(id, location){

  const textarea =
    document.getElementById("comment-" + id);

  const comment = textarea.value.trim();

  if(!comment) return;

  sendUpdate(
    `?action=update&id=${encodeURIComponent(id)}
    &comment=${encodeURIComponent(comment)}
    &author=Håndværker
    &location=${encodeURIComponent(location)}`
  );

  textarea.value = "";
}

function sendUpdate(query){

  const script = document.createElement("script");

  script.src =
    API_URL +
    query.replace(/\s+/g, "") +
    "&t=" + Date.now();

  script.onload = () => {
    loadData();
  };

  document.body.appendChild(script);
}

function setView(view){

  CURRENT_VIEW = view;

  document.getElementById("title").innerText =
    view === "open"
      ? "Åbne sager"
      : "Færdige";

  document.getElementById("nav-open")
    .classList.toggle("active", view === "open");

  document.getElementById("nav-closed")
    .classList.toggle("active", view === "closed");

  loadData();
}

function filterLocation(loc){

  CURRENT_LOCATION =
    CURRENT_LOCATION === loc
      ? null
      : loc;

  loadData();
}

</script>

</body>
</html>
