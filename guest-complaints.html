<!doctype html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Kaiser – Gæsteklager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f2; --white:#fff; --ink:#18201d; --muted:#737b76; --line:#e3e7e3;
  --green:#176b57; --green2:#e5f1ed; --gold:#d6b24a; --gold2:#f7f0da;
  --amber:#b36b16; --amberSoft:#f8efdf; --red:#b64b43; --redSoft:#f8e8e6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit}
.hidden{display:none!important}

.page{height:100vh;display:flex;flex-direction:column;padding:0.875rem 1.25rem 1rem;gap:0.75rem}
.head{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex:none}
.kicker{font-size:0.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.h1{font-size:1.5rem;font-weight:800;letter-spacing:-.04em;margin-top:2px}
.locWrap{display:flex;align-items:center;gap:0.5rem;min-height:2.875rem;padding:0 0.5rem 0 1rem;border-radius:62.4375rem;background:#fff;border:1px solid var(--line);font-weight:800;font-size:0.9375rem}
.locLbl{font-size:0.6875rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.locWrap select{border:0;background:transparent;font-size:0.9375rem;font-weight:800;color:var(--ink);min-height:2.75rem;padding:0 0.25rem;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none}
.locWrap::after{content:"▾";color:var(--muted);font-size:0.75rem;margin-right:0.5rem;pointer-events:none}

.grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0.75rem}
.panel{background:#fff;border:1px solid var(--line);border-radius:1.125rem;display:flex;flex-direction:column;min-height:0;box-shadow:0 1px 0 rgba(24,32,29,.04)}
.pHead{display:flex;align-items:center;justify-content:space-between;gap:0.5rem;padding:0 1rem;min-height:3.25rem;border-bottom:1px solid var(--line);flex:none}
.pTitle{display:flex;align-items:center;gap:0.5rem;font-size:0.8125rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.pDot{width:0.5rem;height:0.5rem;border-radius:50%;background:var(--red)}
.pDot.green{background:var(--green)}
.pCount{font-size:0.875rem;font-weight:700;color:var(--muted);white-space:nowrap}
.pBody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem}

/* formular */
.lbl{font-size:0.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 0.5rem}
.lbl i{font-style:normal;color:var(--red)}
.field{margin-bottom:0.875rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:0.5rem}
.chip{min-height:2.75rem;border-radius:0.75rem;border:1.5px solid var(--line);background:#f7f8f6;font-size:0.9375rem;font-weight:800;color:var(--ink);cursor:pointer;padding:0 0.5rem;transition:transform .08s ease}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip:active,.btn:active,.seg button:active{transform:scale(.97)}
.field.err .chips .chip,.field.err .seg{border-color:var(--red)}
.field.err .lbl{color:var(--red)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0.3125rem;padding:0.3125rem;background:#eef1ee;border-radius:0.875rem;border:1.5px solid transparent}
.seg button{min-height:2.75rem;border:0;border-radius:0.625rem;background:transparent;font-size:0.9375rem;font-weight:800;color:#59635e;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.5rem}
.seg button .dot{width:0.5625rem;height:0.5625rem;border-radius:50%}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(24,32,29,.12)}
.seg button[data-v="Low"].on{background:var(--green);color:#fff}
.seg button[data-v="Medium"].on{background:var(--amber);color:#fff}
.seg button[data-v="High"].on{background:var(--red);color:#fff}
.seg button[data-v="Yes"].on{background:var(--green);color:#fff}
.seg button.on .dot{background:#fff!important}

.input{width:100%;min-height:3rem;border-radius:0.75rem;border:1.5px solid var(--line);background:#f7f8f6;padding:0 0.875rem;font-size:1rem;font-weight:700;color:var(--ink);outline:none}
.textarea{width:100%;min-height:5rem;border-radius:0.875rem;border:1.5px solid var(--line);background:#f7f8f6;padding:0.75rem 0.875rem;font-size:1.0625rem;font-weight:500;line-height:1.45;color:var(--ink);outline:none;resize:vertical}
.input:focus,.textarea:focus{border-color:var(--green);background:#fff}
.field.err .textarea{border-color:var(--red);background:var(--redSoft)}
.dateRow{display:flex;gap:0.5rem}
.dateRow .chip{flex:1;max-width:8rem}
.dateInput{min-height:3rem;border-radius:0.75rem;border:1.5px solid var(--line);background:#f7f8f6;padding:0 0.75rem;font-size:0.9375rem;font-weight:700;color:var(--ink);flex:1;min-width:0;outline:none}
.dateInput.on{border-color:var(--ink);background:#fff}

.pFoot{padding:0.75rem 1rem 1rem;flex:none;border-top:1px solid var(--line)}
.btn{width:100%;min-height:4rem;border:0;border-radius:0.875rem;background:var(--ink);color:#fff;font-size:1.1875rem;font-weight:800;cursor:pointer;transition:transform .08s ease,opacity .15s}
.btn:disabled{opacity:.6}
.status{margin-top:0.625rem;padding:0.75rem 1rem;border-radius:0.75rem;font-size:0.9375rem;font-weight:700}
.status.ok{background:var(--green2);color:var(--green)}
.status.err{background:var(--redSoft);color:var(--red)}

/* liste */
.ghostBtn{min-height:2.625rem;padding:0 1rem;border-radius:62.4375rem;border:1px solid var(--line);background:#f7f8f6;font-size:0.875rem;font-weight:800;color:var(--ink);cursor:pointer}
.ghostBtn.spin{opacity:.6}
.group{font-size:0.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0.25rem 0 0.5rem}
.group:not(:first-child){margin-top:1.125rem}
.list{display:flex;flex-direction:column;gap:0.5rem}
.item{padding:0.75rem 0.875rem;border-radius:0.875rem;border:1px solid var(--line);border-left:4px solid var(--red);background:#fff}
.item.low{border-left-color:var(--green)}
.item.medium{border-left-color:var(--amber)}
.item.old{background:#fafbfa}
.itemTop{display:flex;align-items:center;gap:0.5rem}
.itemTitle{flex:1;min-width:0;font-size:1rem;font-weight:800}
.itemMeta{font-size:0.8125rem;color:var(--muted);font-weight:600;margin-top:3px}
.itemDesc{margin-top:0.375rem;font-size:0.9375rem;line-height:1.4;color:var(--ink)}
.tag{flex:none;font-size:0.6875rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:0.3125rem 0.625rem;border-radius:62.4375rem;background:#eef1ee;color:#59635e}
.tag.sev-high{background:var(--redSoft);color:var(--red)}
.tag.sev-medium{background:var(--amberSoft);color:var(--amber)}
.tag.sev-low{background:var(--green2);color:var(--green)}
.tag.done{background:var(--green2);color:var(--green)}
.empty{padding:2rem 1rem;text-align:center;color:var(--muted);font-weight:700;border:1px dashed var(--line);border-radius:1rem}

iframe.hiddenFrame{display:none;width:0;height:0;border:0}

@media(max-width:820px){
  .page{height:auto;min-height:100vh}
  .grid{grid-template-columns:1fr}
  .pBody{overflow:visible}
}
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <div>
      <div class="kicker" id="dateLine">—</div>
      <div class="h1">Gæsteklager</div>
    </div>
    <label class="locWrap"><span class="locLbl">Café</span>
      <select id="locSelect" aria-label="Café">
        <option value="Café Kaiser Helsingør">Helsingør</option>
        <option value="Café Kaiser Hillerød">Hillerød</option>
        <option value="Café Kaiser Farum">Farum</option>
        <option value="Café Kaiser Hørsholm">Hørsholm</option>
        <option value="Café Kaiser Vanløse">Vanløse</option>
        <option value="Café Kaiser Sydhavnen">Sydhavnen</option>
        <option value="Café Kaiser Waves">Waves</option>
        <option value="Café Kaiser Nørrebro">Nørrebro</option>
      </select>
    </label>
  </header>

  <div class="grid">
    <!-- REGISTRÉR -->
    <section class="panel">
      <div class="pHead">
        <div class="pTitle"><span class="pDot"></span>Registrér klage</div>
        <div class="pCount">Felter med <span style="color:var(--red)">*</span> skal udfyldes</div>
      </div>
      <div class="pBody">
        <div class="field" id="fCat">
          <div class="lbl">Hvad drejer det sig om <i>*</i></div>
          <div class="chips" id="catChips"></div>
        </div>

        <div class="row2">
          <div class="field" id="fSev">
            <div class="lbl">Alvorlighed <i>*</i></div>
            <div class="seg" id="sevSeg">
              <button type="button" data-v="Low"><span class="dot" style="background:var(--green)"></span>Lav</button>
              <button type="button" data-v="Medium"><span class="dot" style="background:var(--amber)"></span>Mellem</button>
              <button type="button" data-v="High"><span class="dot" style="background:var(--red)"></span>Høj</button>
            </div>
          </div>
          <div class="field">
            <div class="lbl">Løst med det samme?</div>
            <div class="seg" id="resSeg">
              <button type="button" data-v="No">Nej</button>
              <button type="button" data-v="Yes">Ja, løst</button>
            </div>
          </div>
        </div>

        <div class="field" id="fDesc">
          <div class="lbl">Hvad skete der <i>*</i></div>
          <textarea id="descriptionInput" class="textarea" placeholder="Kort beskrivelse – fx: Burger kom kold ud, ny lavet og kaffe givet"></textarea>
        </div>

        <div class="row2" style="margin-bottom:0">
          <div class="field" style="margin-bottom:0">
            <div class="lbl">Bord / reference</div>
            <input id="tableRefInput" class="input" type="text" placeholder="Fx bord 12" autocomplete="off" />
          </div>
          <div class="field" style="margin-bottom:0">
            <div class="lbl">Dato</div>
            <div class="dateRow">
              <button type="button" class="chip" data-d="0">I dag</button>
              <button type="button" class="chip" data-d="-1">I går</button>
              <input id="dateInput" class="dateInput" type="date" />
            </div>
          </div>
        </div>

        <!-- skjulte værdier (samme felter som før) -->
        <select id="categoryInput" class="hidden">
          <option value="">Vælg kategori</option>
          <option value="Food">Mad</option>
          <option value="Service">Service</option>
          <option value="Waiting time">Ventetid</option>
          <option value="Wrong order">Fejl i ordre</option>
          <option value="Cleanliness">Renlighed</option>
          <option value="Staff behaviour">Personale adfærd</option>
          <option value="Other">Andet</option>
        </select>
        <select id="severityInput" class="hidden">
          <option value="">Vælg alvorlighed</option>
          <option value="Low">Lav</option>
          <option value="Medium">Mellem</option>
          <option value="High">Høj</option>
        </select>
        <select id="resolvedNowInput" class="hidden">
          <option value="No">Nej</option>
          <option value="Yes">Ja</option>
        </select>
      </div>
      <div class="pFoot">
        <button class="btn" id="submitBtn" type="button">Gem klage</button>
        <div class="status hidden" id="statusBox"></div>
      </div>
    </section>

    <!-- LISTE -->
    <section class="panel">
      <div class="pHead">
        <div class="pTitle"><span class="pDot green"></span>Seneste klager</div>
        <button class="ghostBtn" id="refreshBtn" type="button">Opdater</button>
      </div>
      <div class="pBody" id="itemList"><div class="empty">Indlæser…</div></div>
    </section>
  </div>
</div>

<iframe name="saveTarget" class="hiddenFrame"></iframe>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw8ztJIUOk-4GkhkTwHbpJiSOi7uJjPivpWc5skVr0KXJ1m-j3dcVNF3BSe3sbnWIds/exec";
const $ = id => document.getElementById(id);

const CAT_DA = { "Food":"Mad", "Service":"Service", "Waiting time":"Ventetid", "Wrong order":"Fejl i ordre", "Cleanliness":"Renlighed", "Staff behaviour":"Personale adfærd", "Other":"Andet" };
const SEV_DA = { "Low":"Lav", "Medium":"Mellem", "High":"Høj" };

function isoDate(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function isoToday(){ return isoDate(new Date()); }
function isoOffset(n){ const d = new Date(); d.setDate(d.getDate()+n); return isoDate(d); }
function escapeHtml(s){ return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])); }
function fmtDate(iso){
  const s = String(iso || "").slice(0,10);
  if (!s) return "—";
  if (s === isoToday()) return "I dag";
  if (s === isoOffset(-1)) return "I går";
  const p = s.split("-"); return p.length === 3 ? (+p[2]) + "/" + (+p[1]) : s;
}
function severityClass(sev){
  const s = String(sev || "").toLowerCase();
  if (s === "low") return "low";
  if (s === "medium") return "medium";
  return "high";
}

let statusTimer = null;
function setStatus(msg, type){
  const b = $("statusBox");
  b.className = "status " + (type === "ok" ? "ok" : "err");
  b.textContent = msg;
  clearTimeout(statusTimer);
  if (type === "ok") statusTimer = setTimeout(clearStatus, 4000);
}
function clearStatus(){ $("statusBox").className = "status hidden"; $("statusBox").textContent = ""; }

/* --- knapper styrer de skjulte felter (værdierne er de samme som før) --- */
function renderCats(){
  const cur = $("categoryInput").value;
  $("catChips").innerHTML = Object.keys(CAT_DA).map(k =>
    `<button type="button" class="chip ${cur===k?"on":""}" data-c="${k}">${CAT_DA[k]}</button>`).join("");
  $("catChips").querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    $("categoryInput").value = b.dataset.c; $("fCat").classList.remove("err"); renderCats();
  }));
}
function bindSeg(segId, selId, fieldId){
  const seg = $(segId);
  const sync = () => seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === $(selId).value));
  seg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    $(selId).value = b.dataset.v; if (fieldId) $(fieldId).classList.remove("err"); sync();
  }));
  sync();
  return sync;
}
let syncSev, syncRes;
function syncDateChips(){
  const v = $("dateInput").value; let match = false;
  document.querySelectorAll(".dateRow .chip").forEach(b => { const on = v === isoOffset(+b.dataset.d); b.classList.toggle("on", on); if (on) match = true; });
  $("dateInput").classList.toggle("on", !match && !!v);
}

function jsonp(url, params = {}){
  return new Promise((resolve, reject) => {
    const cb = "__cb_" + Math.random().toString(16).slice(2);
    const qs = new URLSearchParams({ ...params, callback: cb }).toString();
    const s = document.createElement("script");
    const t = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 15000);
    function cleanup(){ clearTimeout(t); try{ delete window[cb]; }catch(_){} if (s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = data => { cleanup(); resolve(data); };
    s.src = url + (url.includes("?") ? "&" : "?") + qs; s.async = true;
    s.onerror = () => { cleanup(); reject(new Error("load error")); };
    document.body.appendChild(s);
  });
}

async function loadComplaints(){
  const loc = $("locSelect").value;
  $("refreshBtn").classList.add("spin");
  try{
    const data = await jsonp(SCRIPT_URL, { action:"getGuestComplaints", loc });
    if (!data || !data.ok || !Array.isArray(data.complaints) || !data.complaints.length){
      $("itemList").innerHTML = '<div class="empty">Ingen klager registreret</div>';
      return;
    }
    const today = isoToday();
    const now = data.complaints.filter(i => String(i.date||"").slice(0,10) === today);
    const old = data.complaints.filter(i => String(i.date||"").slice(0,10) !== today);
    const row = (item, isOld) => {
      const sc = severityClass(item.severity);
      const resolved = /^(yes|ja|løst|resolved|closed|lukket)$/i.test(String(item.status||item.resolvedNow||"").trim());
      return `
      <div class="item ${sc} ${isOld?"old":""}">
        <div class="itemTop">
          <div class="itemTitle">${escapeHtml(CAT_DA[item.category] || item.category || "Klage")}</div>
          <span class="tag sev-${sc}">${escapeHtml(SEV_DA[item.severity] || item.severity || "")}</span>
          ${item.status ? `<span class="tag ${resolved?"done":""}">${escapeHtml(({open:"Åben",resolved:"Løst",closed:"Lukket",yes:"Løst",no:"Åben"})[String(item.status).trim().toLowerCase()] || item.status)}</span>` : ""}
        </div>
        <div class="itemMeta">${escapeHtml(fmtDate(item.date))}${item.tableRef ? " · " + escapeHtml(item.tableRef) : ""}</div>
        ${item.description ? `<div class="itemDesc">${escapeHtml(item.description)}</div>` : ""}
      </div>`;
    };
    let html = `<div class="group">I dag (${now.length})</div>`;
    html += now.length ? '<div class="list">' + now.map(i => row(i,false)).join("") + '</div>' : '<div class="empty">Ingen klager i dag</div>';
    if (old.length) html += '<div class="group">Tidligere</div><div class="list">' + old.map(i => row(i,true)).join("") + '</div>';
    $("itemList").innerHTML = html;
  }catch(e){
    $("itemList").innerHTML = '<div class="empty">Kunne ikke hente listen – tryk Opdater</div>';
  }finally{
    $("refreshBtn").classList.remove("spin");
  }
}

function submitComplaint(){
  clearStatus();
  const location = $("locSelect").value;
  const date = $("dateInput").value;
  const category = ($("categoryInput").value || "").trim();
  const severity = ($("severityInput").value || "").trim();
  const description = ($("descriptionInput").value || "").trim();
  const tableRef = ($("tableRefInput").value || "").trim();
  const resolvedNow = ($("resolvedNowInput").value || "").trim();

  $("fCat").classList.toggle("err", !category);
  $("fSev").classList.toggle("err", !severity);
  $("fDesc").classList.toggle("err", !description);
  if (!date || !location || !category || !severity || !description){
    setStatus("Udfyld kategori, alvorlighed og beskrivelse.", "err");
    return;
  }

  const btn = $("submitBtn");
  btn.disabled = true; btn.textContent = "Gemmer…";

  const form = document.createElement("form");
  form.method = "POST"; form.action = SCRIPT_URL; form.target = "saveTarget"; form.style.display = "none";
  const fields = { action:"addGuestComplaint", date, location, category, severity, description, tableRef, resolvedNow };
  Object.keys(fields).forEach(k => { const i = document.createElement("input"); i.type = "hidden"; i.name = k; i.value = fields[k]; form.appendChild(i); });
  document.body.appendChild(form);
  form.submit();

  setTimeout(() => {
    form.remove();
    btn.disabled = false; btn.textContent = "Gem klage";
    $("categoryInput").value = ""; $("severityInput").value = ""; $("descriptionInput").value = "";
    $("tableRefInput").value = ""; $("resolvedNowInput").value = "No";
    renderCats(); syncSev(); syncRes();
    setStatus("Klagen er gemt", "ok");
    loadComplaints();
  }, 1200);
}

(function init(){
  $("dateLine").textContent = new Date().toLocaleDateString("da-DK", { weekday:"long", day:"numeric", month:"long" });
  $("dateInput").value = isoToday();

  const locQS = new URLSearchParams(location.search).get("loc") || "";
  if (locQS){
    const wanted = ("Café Kaiser " + locQS.trim()).toLowerCase();
    const m = Array.from($("locSelect").options).find(o => o.value.toLowerCase() === wanted);
    if (m) $("locSelect").value = m.value;
  }

  renderCats();
  syncSev = bindSeg("sevSeg", "severityInput", "fSev");
  syncRes = bindSeg("resSeg", "resolvedNowInput", null);
  syncDateChips();
  loadComplaints();

  $("locSelect").addEventListener("change", loadComplaints);
  $("dateInput").addEventListener("change", syncDateChips);
  document.querySelectorAll(".dateRow .chip").forEach(b => b.addEventListener("click", () => { $("dateInput").value = isoOffset(+b.dataset.d); syncDateChips(); }));
  $("descriptionInput").addEventListener("input", () => $("fDesc").classList.remove("err"));
  $("refreshBtn").addEventListener("click", loadComplaints);
  $("submitBtn").addEventListener("click", submitComplaint);
})();
</script>
</body>
</html>
