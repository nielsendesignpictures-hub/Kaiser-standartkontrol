<!doctype html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Kaiser – Udsolgte varer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f2; --white:#fff; --ink:#18201d; --muted:#737b76; --line:#e3e7e3;
  --green:#176b57; --green2:#e5f1ed; --gold:#d6b24a; --gold2:#f7f0da;
  --amber:#b36b16; --amberSoft:#f8efdf; --red:#b64b43; --redSoft:#f8e8e6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit}
.hidden{display:none!important}

.page{height:100vh;display:flex;flex-direction:column;padding:0.875rem 1.25rem 1rem;gap:0.75rem}
.head{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex:none}
.kicker{font-size:0.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.h1{font-size:1.5rem;font-weight:800;letter-spacing:-.04em;margin-top:2px}
.headRight{display:flex;gap:0.5rem;align-items:center}
.locWrap{position:relative;display:flex;align-items:center;gap:0.5rem;min-height:2.875rem;padding:0 0.5rem 0 1rem;border-radius:62.4375rem;background:#fff;border:1px solid var(--line);font-weight:800;font-size:0.9375rem}
.locLbl{font-size:0.6875rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.locWrap select{border:0;background:transparent;font-size:0.9375rem;font-weight:800;color:var(--ink);min-height:2.75rem;padding:0 0.25rem;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none}
.locWrap::after{content:"▾";color:var(--muted);font-size:0.75rem;margin-right:0.5rem;pointer-events:none}

.grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0.75rem}
.panel{background:#fff;border:1px solid var(--line);border-radius:1.125rem;display:flex;flex-direction:column;min-height:0;box-shadow:0 1px 0 rgba(24,32,29,.04)}
.pHead{display:flex;align-items:center;justify-content:space-between;gap:0.5rem;padding:0 1rem;min-height:3.25rem;border-bottom:1px solid var(--line);flex:none}
.pTitle{display:flex;align-items:center;gap:0.5rem;font-size:0.8125rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.pDot{width:0.5rem;height:0.5rem;border-radius:50%;background:var(--red)}
.pDot.green{background:var(--green)}
.pCount{font-size:0.875rem;font-weight:700;color:var(--muted);white-space:nowrap}
.pBody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem}

/* formular */
.lbl{font-size:0.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 0.5rem}
.field{margin-bottom:1.125rem}
.bigInput{width:100%;min-height:3.75rem;border-radius:0.875rem;border:1.5px solid var(--line);background:#f7f8f6;padding:0 1.125rem;font-size:1.1875rem;font-weight:700;color:var(--ink);outline:none}
.bigInput:focus{border-color:var(--green);background:#fff}
.bigInput.err{border-color:var(--red);background:var(--redSoft)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr));gap:0.5rem}
.chip{min-height:3.125rem;border-radius:0.75rem;border:1px solid var(--line);background:#f7f8f6;font-size:0.9375rem;font-weight:800;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.375rem;padding:0 0.5rem}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip:active,.btn:active,.item:active{transform:scale(.97)}
.dateRow{display:flex;gap:0.5rem;align-items:center}
.dateRow .chip{flex:1;max-width:9rem}
.dateInput{min-height:3.125rem;border-radius:0.75rem;border:1px solid var(--line);background:#f7f8f6;padding:0 0.875rem;font-size:0.9375rem;font-weight:700;color:var(--ink);flex:1;min-width:0;outline:none}
.dateInput.on{border-color:var(--green);background:var(--green2);color:var(--green)}

.pFoot{padding:0.75rem 1rem 1rem;flex:none;border-top:1px solid var(--line)}
.btn{width:100%;min-height:4rem;border:0;border-radius:0.875rem;background:var(--red);color:#fff;font-size:1.1875rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.625rem;transition:transform .08s ease,opacity .15s}
.btn:disabled{opacity:.6}
.status{margin-top:0.625rem;padding:0.75rem 1rem;border-radius:0.75rem;font-size:0.9375rem;font-weight:700}
.status.ok{background:var(--green2);color:var(--green)}
.status.err{background:var(--redSoft);color:var(--red)}

/* liste */
.ghostBtn{min-height:2.625rem;padding:0 1rem;border-radius:62.4375rem;border:1px solid var(--line);background:#f7f8f6;font-size:0.875rem;font-weight:800;color:var(--ink);cursor:pointer}
.ghostBtn.spin{opacity:.6}
.group{font-size:0.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0.25rem 0 0.5rem}
.group:not(:first-child){margin-top:1.125rem}
.list{display:flex;flex-direction:column;gap:0.5rem}
.item{display:flex;align-items:center;gap:0.75rem;padding:0.75rem 0.875rem;border-radius:0.875rem;border:1px solid var(--line);border-left:4px solid var(--red);background:#fff;cursor:pointer;transition:transform .08s ease}
.item.old{border-left-color:#c9d0cb;background:#fafbfa}
.itemInfo{flex:1;min-width:0}
.itemTitle{font-size:1rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itemMeta{font-size:0.8125rem;color:var(--muted);font-weight:600;margin-top:3px}
.tag{flex:none;font-size:0.6875rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:0.3125rem 0.625rem;border-radius:62.4375rem;background:#eef1ee;color:#59635e}
.again{flex:none;font-size:0.75rem;font-weight:800;color:var(--green)}
.empty{padding:2rem 1rem;text-align:center;color:var(--muted);font-weight:700;border:1px dashed var(--line);border-radius:1rem}

iframe.hiddenFrame{display:none;width:0;height:0;border:0}

@media(max-width:820px){
  .page{height:auto;min-height:100vh}
  .grid{grid-template-columns:1fr}
  .panel{min-height:auto}
  .pBody{overflow:visible}
}
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <div>
      <div class="kicker" id="dateLine">—</div>
      <div class="h1">Udsolgte varer</div>
    </div>
    <div class="headRight">
      <label class="locWrap"><span class="locLbl">Café</span>
        <select id="locSelect" aria-label="Café">
          <option value="Café Kaiser Helsingør">Helsingør</option>
          <option value="Café Kaiser Hillerød">Hillerød</option>
          <option value="Café Kaiser Farum">Farum</option>
          <option value="Café Kaiser Hørsholm">Hørsholm</option>
          <option value="Café Kaiser Vanløse">Vanløse</option>
          <option value="Café Kaiser Sydhavnen">Sydhavnen</option>
          <option value="Café Kaiser Waves">Waves</option>
        </select>
      </label>
    </div>
  </header>

  <div class="grid">
    <!-- REGISTRÉR -->
    <section class="panel">
      <div class="pHead">
        <div class="pTitle"><span class="pDot"></span>Meld udsolgt</div>
        <div class="pCount">Tryk og send</div>
      </div>
      <div class="pBody">
        <div class="field">
          <div class="lbl">Vare</div>
          <input id="productInput" class="bigInput" type="text" placeholder="Fx Caesar salat" autocomplete="off" enterkeyhint="send" />
        </div>
        <div class="field">
          <div class="lbl">Kategori</div>
          <div class="chips" id="catChips"></div>
          <select id="categoryInput" class="hidden">
            <option value="">Ingen</option>
            <option value="Brunch">Brunch</option>
            <option value="Burgers">Burgers</option>
            <option value="Salads">Salads</option>
            <option value="Sandwich">Sandwich</option>
            <option value="Desserts">Desserts</option>
            <option value="Coffee">Coffee</option>
            <option value="Drinks">Drinks</option>
            <option value="Wine">Wine</option>
            <option value="Beer">Beer</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field" style="margin-bottom:0">
          <div class="lbl">Dato</div>
          <div class="dateRow">
            <button type="button" class="chip" data-d="0">I dag</button>
            <button type="button" class="chip" data-d="-1">I går</button>
            <input id="dateInput" class="dateInput" type="date" />
          </div>
        </div>
      </div>
      <div class="pFoot">
        <button class="btn" id="submitBtn" type="button">Meld udsolgt</button>
        <div class="status hidden" id="statusBox"></div>
      </div>
    </section>

    <!-- LISTE -->
    <section class="panel">
      <div class="pHead">
        <div class="pTitle"><span class="pDot green"></span>Seneste udsolgte</div>
        <button class="ghostBtn" id="refreshBtn" type="button">Opdater</button>
      </div>
      <div class="pBody" id="itemList"><div class="empty">Indlæser…</div></div>
    </section>
  </div>
</div>

<iframe name="saveTarget" class="hiddenFrame"></iframe>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw8ztJIUOk-4GkhkTwHbpJiSOi7uJjPivpWc5skVr0KXJ1m-j3dcVNF3BSe3sbnWIds/exec";
const $ = id => document.getElementById(id);

const CATS = [
  ["Brunch","Brunch"],["Burgers","Burger"],["Salads","Salat"],["Sandwich","Sandwich"],
  ["Desserts","Dessert"],["Coffee","Kaffe"],["Drinks","Drikke"],["Wine","Vin"],
  ["Beer","Øl"],["Other","Andet"]
];
const CAT_DA = Object.fromEntries(CATS.map(c => [c[0], c[1]]));

function isoDate(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function isoToday(){ return isoDate(new Date()); }
function isoOffset(n){ const d = new Date(); d.setDate(d.getDate()+n); return isoDate(d); }
function escapeHtml(s){ return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])); }
function fmtDate(iso){
  if (!iso) return "—";
  const s = String(iso).slice(0,10);
  if (s === isoToday()) return "I dag";
  if (s === isoOffset(-1)) return "I går";
  const p = s.split("-"); return p.length === 3 ? (+p[2]) + "/" + (+p[1]) : s;
}

let statusTimer = null;
function setStatus(msg, type){
  const b = $("statusBox");
  b.className = "status " + (type === "ok" ? "ok" : "err");
  b.textContent = msg;
  clearTimeout(statusTimer);
  if (type === "ok") statusTimer = setTimeout(clearStatus, 4000);
}
function clearStatus(){ $("statusBox").className = "status hidden"; $("statusBox").textContent = ""; }

/* kategori-chips (styrer den skjulte select, så værdierne er uændrede) */
function renderCats(){
  const cur = $("categoryInput").value;
  $("catChips").innerHTML = CATS.map(c =>
    `<button type="button" class="chip ${cur===c[0]?"on":""}" data-c="${c[0]}">${c[1]}</button>`).join("");
  $("catChips").querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    $("categoryInput").value = ($("categoryInput").value === b.dataset.c) ? "" : b.dataset.c;
    renderCats();
  }));
}
/* dato-chips */
function syncDateChips(){
  const v = $("dateInput").value;
  let match = false;
  document.querySelectorAll(".dateRow .chip").forEach(b => {
    const on = v === isoOffset(+b.dataset.d); b.classList.toggle("on", on); if (on) match = true;
  });
  $("dateInput").classList.toggle("on", !match && !!v);
}

function jsonp(url, params = {}){
  return new Promise((resolve, reject) => {
    const cb = "__cb_" + Math.random().toString(16).slice(2);
    const qs = new URLSearchParams({ ...params, callback: cb }).toString();
    const s = document.createElement("script");
    const t = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 15000);
    function cleanup(){ clearTimeout(t); try{ delete window[cb]; }catch(_){} if (s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = data => { cleanup(); resolve(data); };
    s.src = url + (url.includes("?") ? "&" : "?") + qs; s.async = true;
    s.onerror = () => { cleanup(); reject(new Error("load error")); };
    document.body.appendChild(s);
  });
}

async function loadItems(){
  const loc = $("locSelect").value;
  $("refreshBtn").classList.add("spin");
  try{
    const data = await jsonp(SCRIPT_URL, { action:"getSoldoutProducts", loc });
    if (!data || !data.ok || !Array.isArray(data.items) || !data.items.length){
      $("itemList").innerHTML = '<div class="empty">Ingen udsolgte varer meldt endnu</div>';
      return;
    }
    const today = isoToday();
    const now = data.items.filter(i => String(i.date||"").slice(0,10) === today);
    const old = data.items.filter(i => String(i.date||"").slice(0,10) !== today);
    const row = (i, isOld) => `
      <div class="item ${isOld?"old":""}" data-name="${escapeHtml(i.productName)}" data-cat="${escapeHtml(i.category||"")}">
        <div class="itemInfo">
          <div class="itemTitle">${escapeHtml(i.productName)}</div>
          <div class="itemMeta">${escapeHtml(fmtDate(i.date))}${i.category ? " • " + escapeHtml(CAT_DA[i.category] || i.category) : ""}</div>
        </div>
        ${isOld ? '<span class="again">Meld igen</span>' : '<span class="tag">Udsolgt</span>'}
      </div>`;
    let html = "";
    html += `<div class="group">I dag (${now.length})</div>`;
    html += now.length ? '<div class="list">' + now.map(i => row(i,false)).join("") + '</div>' : '<div class="empty">Intet meldt udsolgt i dag</div>';
    if (old.length) html += `<div class="group">Tidligere</div><div class="list">` + old.map(i => row(i,true)).join("") + '</div>';
    $("itemList").innerHTML = html;
    $("itemList").querySelectorAll(".item.old").forEach(el => el.addEventListener("click", () => {
      $("productInput").value = el.dataset.name;
      $("categoryInput").value = CATS.some(c => c[0] === el.dataset.cat) ? el.dataset.cat : "";
      $("dateInput").value = isoToday(); syncDateChips(); renderCats();
      $("productInput").classList.remove("err");
      setStatus("Klar — tryk “Meld udsolgt” for at sende " + el.dataset.name, "ok");
    }));
  }catch(e){
    $("itemList").innerHTML = '<div class="empty">Kunne ikke hente listen — tryk Opdater</div>';
  }finally{
    $("refreshBtn").classList.remove("spin");
  }
}

function submitItem(){
  clearStatus();
  const location = $("locSelect").value;
  const date = $("dateInput").value;
  const productName = ($("productInput").value || "").trim();
  const category = ($("categoryInput").value || "").trim();
  if (!productName){ $("productInput").classList.add("err"); $("productInput").focus(); setStatus("Skriv hvilken vare der er udsolgt.", "err"); return; }
  if (!date || !location){ setStatus("Vælg dato og café.", "err"); return; }

  const btn = $("submitBtn");
  btn.disabled = true; btn.textContent = "Sender…";

  const form = document.createElement("form");
  form.method = "POST"; form.action = SCRIPT_URL; form.target = "saveTarget"; form.style.display = "none";
  const fields = { action:"addSoldoutProduct", date, location, productName, category };
  Object.keys(fields).forEach(k => { const i = document.createElement("input"); i.type = "hidden"; i.name = k; i.value = fields[k]; form.appendChild(i); });
  document.body.appendChild(form);
  form.submit();

  setTimeout(() => {
    form.remove();
    btn.disabled = false; btn.textContent = "Meld udsolgt";
    $("productInput").value = ""; $("categoryInput").value = ""; renderCats();
    setStatus(productName + " er meldt udsolgt", "ok");
    loadItems();
  }, 1200);
}

(function init(){
  const d = new Date();
  $("dateLine").textContent = d.toLocaleDateString("da-DK", { weekday:"long", day:"numeric", month:"long" });
  $("dateInput").value = isoToday();

  const locQS = new URLSearchParams(location.search).get("loc") || "";
  if (locQS){
    const wanted = ("Café Kaiser " + locQS.trim()).toLowerCase();
    const m = Array.from($("locSelect").options).find(o => o.value.toLowerCase() === wanted);
    if (m) $("locSelect").value = m.value;
  }

  renderCats(); syncDateChips(); loadItems();

  $("locSelect").addEventListener("change", loadItems);
  $("dateInput").addEventListener("change", syncDateChips);
  document.querySelectorAll(".dateRow .chip").forEach(b => b.addEventListener("click", () => { $("dateInput").value = isoOffset(+b.dataset.d); syncDateChips(); }));
  $("productInput").addEventListener("input", () => $("productInput").classList.remove("err"));
  $("productInput").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); submitItem(); } });
  $("refreshBtn").addEventListener("click", loadItems);
  $("submitBtn").addEventListener("click", submitItem);
})();
</script>
</body>
</html>
