<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kaiser – Bar prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f2; --ink:#18201d; --muted:#737b76; --line:#e3e7e3;
  --green:#176b57; --green2:#e5f1ed; --gold:#d6b24a;
  --amber:#b36b16; --amberSoft:#f8efdf; --red:#b64b43; --redSoft:#f8e8e6;
  --blue:#2f5f8f; --blueSoft:#e6eef6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit}
.hidden{display:none!important}
.page{height:100vh;display:flex;flex-direction:column;padding:0.875rem 1.25rem 1rem;gap:0.75rem}
.head{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex:none}
.kicker{font-size:0.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.h1{font-size:1.5rem;font-weight:800;letter-spacing:-.04em;margin-top:2px}
.pillBtn{min-height:2.875rem;padding:0 1.125rem;border-radius:62.4375rem;border:1px solid var(--line);background:#fff;font-size:0.875rem;font-weight:800;color:var(--ink);cursor:pointer}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0.75rem}
.panel{background:#fff;border:1px solid var(--line);border-radius:1.125rem;display:flex;flex-direction:column;min-height:0;box-shadow:0 1px 0 rgba(24,32,29,.04)}
.pHead{display:flex;align-items:center;justify-content:space-between;gap:0.5rem;padding:0 1rem;min-height:3.25rem;border-bottom:1px solid var(--line);flex:none}
.pTitle{display:flex;align-items:center;gap:0.5rem;font-size:0.8125rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.pDot{width:0.5rem;height:0.5rem;border-radius:50%;background:var(--green)}
.pDot.red{background:var(--red)}
.pBody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem}
.pFoot{padding:0.75rem 1rem 1rem;flex:none;border-top:1px solid var(--line)}
.lbl{font-size:0.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 0.5rem}
.field{margin-bottom:0.875rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0.75rem}
.input{width:100%;min-height:3rem;border-radius:0.75rem;border:1.5px solid var(--line);background:#f7f8f6;padding:0 0.875rem;font-size:1rem;font-weight:700;color:var(--ink);outline:none}
textarea.input{padding:0.625rem 0.875rem;min-height:3.25rem;resize:vertical;font-weight:500;line-height:1.4}
.input:focus{border-color:var(--green);background:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0.3125rem;padding:0.3125rem;background:#eef1ee;border-radius:0.875rem}
.seg button{min-height:2.5rem;border:0;border-radius:0.625rem;background:transparent;font-size:0.9375rem;font-weight:800;color:#59635e;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(24,32,29,.12)}
.seg button.on.frozen{background:var(--blue);color:#fff}
.stepper{display:flex;gap:0.375rem}
.stepper .input{text-align:center;font-size:1.25rem;font-weight:800;min-width:0}
.stepper button{flex:none;width:3.25rem;min-height:3rem;border-radius:0.75rem;border:1.5px solid var(--line);background:#fff;font-size:1.5rem;font-weight:800;color:var(--ink);cursor:pointer;transition:transform .08s ease}
.stepper button:active,.chip:active,.btn:active,.act:active,.seg button:active,.keypad button:active{transform:scale(.97)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(8rem,1fr));gap:0.5rem}
.chip{min-height:3.25rem;padding:0.5rem 0.75rem;border-radius:0.75rem;border:1.5px solid var(--line);background:#f7f8f6;text-align:left;cursor:pointer;transition:transform .08s ease;color:var(--ink)}
.chip .nm{font-size:0.9375rem;font-weight:800;line-height:1.25}
.chip .mt{font-size:0.75rem;font-weight:700;color:var(--muted);margin-top:0.125rem}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on .mt{color:rgba(255,255,255,.7)}
.preview{margin-bottom:0.625rem;padding:0.625rem 0.875rem;border-radius:0.75rem;background:#f7f8f6;border:1px solid var(--line);font-size:0.875rem;font-weight:600;color:var(--muted);line-height:1.4;min-height:2.5rem}
.preview b{color:var(--ink)}
.btn{width:100%;min-height:3.75rem;border:0;border-radius:0.875rem;background:var(--ink);color:#fff;font-size:1.1875rem;font-weight:800;cursor:pointer;transition:transform .08s ease,opacity .15s}
.btn:disabled{opacity:.45}
.btn.ghost{background:#f1f3f1;color:var(--ink);font-size:1rem;min-height:3.25rem}
.btn.sm{min-height:3.25rem;font-size:1rem}
.sum{display:flex;gap:0.375rem;flex-wrap:wrap;justify-content:flex-end}
.sTag{font-size:0.6875rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:0.375rem 0.75rem;border-radius:62.4375rem;background:#eef1ee;color:#59635e}
.sTag.exp{background:var(--redSoft);color:var(--red)}
.sTag.due{background:var(--amberSoft);color:var(--amber)}
.group{display:flex;align-items:center;gap:0.5rem;font-size:0.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0.25rem 0 0.5rem}
.group:not(:first-child){margin-top:1.125rem}
.group .gc{margin-left:auto;font-weight:700;letter-spacing:.04em}
.list{display:flex;flex-direction:column;gap:0.5rem}
.bottle,.batch{padding:0.75rem 0.875rem;border-radius:0.875rem;border:1px solid var(--line);border-left:4px solid var(--green);background:#fff}
.bottle.dueToday,.batch.dueToday{border-left-color:var(--amber);background:#fffcf6}
.bottle.expired,.batch.expired{border-left-color:var(--red);background:#fdf5f4}
.bTop{display:flex;align-items:flex-start;gap:0.5rem}
.bName{flex:1;min-width:0;font-size:1rem;font-weight:800;line-height:1.3}
.bName small{font-size:0.8125rem;font-weight:700;color:var(--muted);margin-left:0.25rem}
.tag,.pill{flex:none;display:inline-block;font-size:0.6875rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:0.3125rem 0.625rem;border-radius:62.4375rem;background:var(--green2);color:var(--green)}
.tag.dueToday,.pill.dueToday{background:var(--amberSoft);color:var(--amber)}
.tag.expired,.pill.expired{background:var(--redSoft);color:var(--red)}
.tag.thaw{background:var(--blueSoft);color:var(--blue)}
.tag.ready{background:var(--green2);color:var(--green)}
.tags{display:flex;gap:0.375rem;flex-wrap:wrap;margin-top:0.375rem}
.bMeta,.batch .line2{font-size:0.8125rem;color:var(--muted);font-weight:600;margin-top:0.25rem;line-height:1.4}
.bMeta b,.batch .line2 strong{color:var(--ink)}
.batch .line1{font-size:1rem;font-weight:800}
.bar{height:0.3125rem;border-radius:62.4375rem;background:#eef1ee;margin-top:0.5rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:62.4375rem}
.bottle.dueToday .bar i,.batch.dueToday .bar i{background:var(--amber)}
.bottle.expired .bar i,.batch.expired .bar i{background:var(--red)}
.acts{display:flex;gap:0.5rem;margin-top:0.625rem}
.act,.btnSmall,.btnDanger,.btnEdit{flex:1;min-height:2.75rem;border-radius:0.625rem;border:1.5px solid var(--line);background:#fff;font-size:0.875rem;font-weight:800;color:var(--ink);cursor:pointer;padding:0 0.75rem;transition:transform .08s ease}
.act.primary,.btnSmall{background:var(--ink);border-color:var(--ink);color:#fff}
.act.danger,.btnDanger{flex:none;padding:0 1rem;color:var(--red);border-color:#edcbc7;background:#fff}
.btnSmall:active,.btnDanger:active,.btnEdit:active{transform:scale(.97)}
.empty{padding:2rem 1rem;text-align:center;color:var(--muted);font-weight:700;border:1px dashed var(--line);border-radius:1rem}
.status{margin-bottom:0.625rem;padding:0.625rem 0.875rem;border-radius:0.75rem;font-size:0.875rem;font-weight:700;background:var(--redSoft);color:var(--red)}
.overlay{position:fixed;inset:0;background:rgba(24,32,29,.5);display:none;align-items:center;justify-content:center;padding:1rem;z-index:99}
.overlay.on{display:flex}
.modal{width:min(36rem,100%);max-height:92vh;display:flex;flex-direction:column;border-radius:1.25rem;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.3)}
.modal.wide{width:min(44rem,100%)}
.mHead{padding:1.125rem 1.25rem 0.5rem;flex:none}
.mTitle{font-size:1.25rem;font-weight:800;letter-spacing:-.02em}
.mTitle.alarm{color:var(--red)}
.mSub{margin-top:0.375rem;font-size:0.9375rem;color:var(--muted);font-weight:600;line-height:1.4}
.mBody{padding:0.5rem 1.25rem;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.mFoot{display:flex;gap:0.625rem;padding:0.875rem 1.25rem 1.25rem;flex:none}
.mFoot>*{flex:1}
.banner{margin-top:0.625rem;padding:0.625rem 0.875rem;border-radius:0.75rem;font-size:0.9375rem;font-weight:800;background:var(--redSoft);color:var(--red)}
.sRow{display:flex;align-items:center;gap:0.75rem;padding:0.625rem 0;border-bottom:1px solid var(--line)}
.sRow:last-child{border-bottom:0}
.sRow .nm{flex:1;min-width:0;font-size:0.9375rem;font-weight:800;line-height:1.3}
.sRow input{width:5.5rem;min-height:2.75rem;border-radius:0.625rem;border:1.5px solid var(--line);background:#f7f8f6;text-align:center;font-size:1rem;font-weight:800;outline:none}
.sRow input:focus{border-color:var(--green);background:#fff}
.sRow .u{font-size:0.6875rem;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.dangerLink{margin:0.75rem 0 0.25rem;width:100%;min-height:3rem;border-radius:0.75rem;border:1.5px solid #edcbc7;background:#fff;font-size:0.875rem;font-weight:800;color:var(--red);cursor:pointer}
.keypad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0.5rem;margin-top:0.75rem}
.keypad button{min-height:3.25rem;border-radius:0.75rem;border:1.5px solid var(--line);background:#f7f8f6;font-size:1.0625rem;font-weight:800;color:var(--ink);cursor:pointer}
.keypad button.primary{background:var(--green2);border-color:#cfe3dc;color:var(--green)}
.keypad button:disabled{opacity:.15}
@media(max-width:820px){
  .page{height:auto;min-height:100vh}
  .grid{grid-template-columns:1fr}
  .pBody{overflow:visible}
}

</style>
</head>
<body>
<div class="page">
  <header class="head">
    <div>
      <div class="kicker" id="dateLine">—</div>
      <div class="h1">Bar prep</div>
    </div>
    <button class="pillBtn" id="settingsBtn" type="button">Holdbarhed</button>
  </header>

  <div class="grid">
    <!-- REGISTRÉR -->
    <section class="panel">
      <div class="pHead"><div class="pTitle"><span class="pDot"></span>Registrér ny</div></div>
      <div class="pBody">
        <div class="field">
          <div class="lbl">1 · Vare</div>
          <div class="chips" id="itemGrid"></div>
        </div>
        <div class="row2">
          <div class="field">
            <div class="lbl" id="qtyLabel">Antal bøtter</div>
            <div class="stepper">
              <button type="button" data-step="-1" data-for="qty" aria-label="Færre">−</button>
              <input id="qty" class="input" type="number" min="1" step="1" value="1" inputmode="numeric"/>
              <button type="button" data-step="1" data-for="qty" aria-label="Flere">+</button>
            </div>
          </div>
          <div class="field">
            <div class="lbl">Navn</div>
            <input id="by" class="input" placeholder="Fx Mads" autocomplete="off"/>
          </div>
        </div>
        <div class="field" style="margin-bottom:0">
          <div class="lbl">Hvornår skåret / åbnet</div>
          <div class="seg" id="whenSeg">
            <button type="button" data-v="now" class="on">Lige nu</button>
            <button type="button" data-v="custom">Vælg tid</button>
          </div>
          <div class="hidden" id="customTimeWrap" style="margin-top:0.5rem">
            <input id="whenAt" class="input" type="datetime-local"/>
          </div>
          <select id="whenMode" class="hidden"><option value="now">Lige nu</option><option value="custom">Vælg tidspunkt…</option></select>
        </div>
      </div>
      <div class="pFoot">
        <div class="preview" id="preview"></div>
        <button class="btn" id="addBtn" type="button">Registrér</button>
      </div>
    </section>

    <!-- PÅ KØL -->
    <section class="panel">
      <div class="pHead">
        <div class="pTitle"><span class="pDot red"></span>På køl lige nu</div>
        <div class="sum" id="sum"></div>
      </div>
      <div class="pBody" id="list"></div>
    </section>
  </div>
</div>

<!-- ALARM -->
<div class="overlay" id="alarmOverlay">
  <div class="modal">
    <div class="mHead">
      <div class="mTitle alarm">Skal smides ud</div>
      <div class="banner" id="alarmBanner">–</div>
    </div>
    <div class="mBody" id="alarmList"></div>
    <div class="mFoot">
      <button class="btn ghost" id="snoozeBtn" type="button">Slumre 30 min</button>
      <button class="btn sm" id="closeAlarmBtn" type="button">Luk</button>
    </div>
  </div>
</div>

<!-- KASSÉR -->
<div class="overlay" id="discardOverlay">
  <div class="modal">
    <div class="mHead">
      <div class="mTitle">Smid ud</div>
      <div class="mSub" id="discardSub">–</div>
    </div>
    <div class="mBody">
      <div class="lbl" id="wasteLabel" style="margin-top:0.75rem">Hvor mange smider du ud?</div>
      <div class="stepper">
        <button type="button" data-step="-1" data-for="wasteQty" aria-label="Færre">−</button>
        <input id="wasteQty" class="input" type="number" min="1" step="1" inputmode="numeric"/>
        <button type="button" data-step="1" data-for="wasteQty" aria-label="Flere">+</button>
      </div>
    </div>
    <div class="mFoot" style="padding-top:1.25rem">
      <button class="btn ghost" id="discardCancel" type="button">Annuller</button>
      <button class="btn sm" id="discardSave" type="button">Bekræft</button>
    </div>
  </div>
</div>

<!-- HOLDBARHED -->
<div class="overlay" id="settingsOverlay">
  <div class="modal wide">
    <div class="mHead">
      <div class="mTitle">Holdbarhed pr. vare</div>
      <div class="mSub">Antal timer fra det tidspunkt, varen er skåret eller åbnet.</div>
    </div>
    <div class="mBody">
      <div id="settings"></div>
      <button class="dangerLink" id="clearBtn" type="button">Ryd alt (leder)</button>
    </div>
    <div class="mFoot">
      <button class="btn sm" id="settingsClose" type="button">Luk</button>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

const KEY_ENTRIES = "kaiser.barprep.entries.v1";
const KEY_PREFS   = "kaiser.barprep.prefs.v1";
const KEY_SHELF   = "kaiser.barprep.shelf.v1";

/* Holdbarhed i TIMER. Citrus = 2 døgn (jf. Hillerød-listen). */
const DEFAULT_SHELF = {
  lime:     { name:"Lime",     hours:48, unit:"bøtte" },
  appelsin: { name:"Appelsin", hours:48, unit:"bøtte" },
  citron:   { name:"Citron",   hours:48, unit:"bøtte" },
  Passionfrugt:   { name:"Passionfrugt",   hours:48, unit:"bøtte" },
  mynte:    { name:"Mynte",    hours:48, unit:"bøtte" },
  banan:    { name:"Banan",    hours:24, unit:"bøtte" }
};

/* Ental/flertal. Tåler også gamle poster hvor flertal blev gemt. */
const PLURAL = { "bøtte":"bøtter", "bundt":"bundter", "stk":"stk", "pose":"poser" };
function unitLabel(n, unit){
  const u = String(unit || "stk").toLowerCase().trim();
  const sing = Object.keys(PLURAL).find(k => PLURAL[k] === u) || u;
  return Number(n) === 1 ? sing : (PLURAL[sing] || sing);
}

const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} }
};
const $ = id => document.getElementById(id);
const parse = r => { try { return r ? JSON.parse(r) : null; } catch { return null; } };

let shelf   = { ...DEFAULT_SHELF, ...(parse(store.get(KEY_SHELF)) || {}) };
let entries = (parse(store.get(KEY_ENTRIES)) || []).filter(e =>
  !(e.status === "discarded" && new Date(e.discardedAt || e.discardAt).getTime() < Date.now() - 90*24*3600*1000));
let prefs   = { lastBy:"", lastItem:"lime", snoozeUntil:0, ...(parse(store.get(KEY_PREFS)) || {}) };

let selected = prefs.lastItem in shelf ? prefs.lastItem : "lime";
let pendingDiscard = null;

const saveEntries = () => store.set(KEY_ENTRIES, JSON.stringify(entries));
const savePrefs   = () => store.set(KEY_PREFS, JSON.stringify(prefs));
const saveShelf   = () => store.set(KEY_SHELF, JSON.stringify(shelf));

const esc = s => String(s ?? "").replace(/[&<>"']/g, m =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

const uuid = () => (crypto?.randomUUID?.() || "id-" + Math.random().toString(16).slice(2) + Date.now());

function fmt(iso){
  return new Date(iso).toLocaleString("da-DK",
    { weekday:"short", day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
}

function hoursLabel(h){
  if (h % 24 === 0) return (h/24) + (h === 24 ? " døgn" : " døgn");
  if (h < 24) return h + " timer";
  return Math.floor(h/24) + " døgn " + (h%24) + " t";
}

function timeLeft(iso){
  const ms = new Date(iso).getTime() - Date.now();
  if (ms <= 0) return "udløbet";
  const mins = Math.round(ms/60000);
  const h = Math.floor(mins/60), m = mins%60;
  if (h >= 24) { const d = Math.floor(h/24); return d + " døgn " + (h%24) + " t tilbage"; }
  if (h >= 1)  return h + " t " + m + " min tilbage";
  return m + " min tilbage";
}

function sameDay(a,b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

function statusOf(e){
  const disc = new Date(e.discardAt).getTime();
  if (Date.now() >= disc) return "expired";
  if (sameDay(new Date(), new Date(e.discardAt))) return "dueToday";
  return "ok";
}

const STATUS_TEXT = { ok:"OK", dueToday:"Udløber i dag", expired:"Smid ud" };

/* ---------- Vare-knapper ---------- */
function renderItems(){
  $("itemGrid").innerHTML = Object.entries(shelf).map(([id,s]) => `
    <div class="chip itemBtn ${id===selected?"on":""}" data-id="${id}">
      <div class="nm">${esc(s.name)}</div>
      <div class="mt">${esc(hoursLabel(s.hours))}</div>
    </div>`).join("");

  $("itemGrid").querySelectorAll(".itemBtn").forEach(b =>
    b.addEventListener("click", () => {
      selected = b.dataset.id;
      prefs.lastItem = selected; savePrefs();
      renderItems(); updatePreview();
    }));
}

/* ---------- Preview ---------- */
function chosenStart(){
  if ($("whenMode").value === "custom" && $("whenAt").value){
    return new Date($("whenAt").value);
  }
  return new Date();
}

function updatePreview(){
  const s = shelf[selected];
  const start = chosenStart();
  const out = new Date(start.getTime() + s.hours*3600*1000);
  const q = parseInt($("qty").value, 10);

  $("qtyLabel").textContent = "Antal " + unitLabel(2, s.unit);
  $("preview").textContent =
    `${Number.isFinite(q) && q > 0 ? q + " " + unitLabel(q, s.unit) + " " : ""}` +
    `${s.name} skåret ${fmt(start)} → smides ud ${fmt(out)}`;
}

/* ---------- Tilføj ---------- */
function addEntry(){
  const s = shelf[selected];
  const q = parseInt($("qty").value, 10);
  if (!Number.isFinite(q) || q < 1){ showMsg("Udfyld antal (mindst 1)."); return; }

  const start = chosenStart();
  if (isNaN(start.getTime())){ showMsg("Ugyldigt tidspunkt."); return; }

  entries.unshift({
    id: uuid(),
    itemId: selected,
    itemName: s.name,
    unit: s.unit,
    qty: q,
    by: ($("by").value || "").trim(),
    cutAt: start.toISOString(),
    discardAt: new Date(start.getTime() + s.hours*3600*1000).toISOString(),
    status: "active"
  });

  saveEntries();
  prefs.lastBy = ($("by").value || "").trim(); savePrefs();

  $("qty").value = "1";
  setWhen("now");

  render(); updatePreview(); checkAlarm(true);
}

/* ---------- Liste ---------- */
function progress(e){
  const a = new Date(e.cutAt).getTime(), b = new Date(e.discardAt).getTime();
  if (!(b > a)) return 100;
  return Math.max(0, Math.min(100, ((Date.now() - a) / (b - a)) * 100));
}

function showMsg(msg){
  let box = $("msgBox");
  if (!box){
    box = document.createElement("div"); box.id = "msgBox"; box.className = "status";
    $("preview").parentNode.insertBefore(box, $("preview"));
  }
  box.textContent = msg;
  clearTimeout(showMsg.t);
  showMsg.t = setTimeout(() => box.remove(), 3500);
}

function setWhen(v){
  $("whenMode").value = v;
  $("whenSeg").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  $("customTimeWrap").classList.toggle("hidden", v !== "custom");
  if (v === "custom" && !$("whenAt").value){
    const d = new Date(Date.now() - new Date().getTimezoneOffset()*60000);
    $("whenAt").value = d.toISOString().slice(0,16);
  }
}

function render(){
  const active = entries.filter(e => e.status === "active");

  const nExp = active.filter(e => statusOf(e) === "expired").length;
  const nDue = active.filter(e => statusOf(e) === "dueToday").length;
  $("sum").innerHTML =
    (nExp ? `<span class="sTag exp">${nExp} skal smides ud</span>` : "") +
    (nDue ? `<span class="sTag due">${nDue} udløber i dag</span>` : "") +
    `<span class="sTag">${active.length} på køl</span>`;

  if (!active.length){
    $("list").innerHTML = `<div class="empty">Ingen registreringer. Alt er tomt på køl.</div>`;
    return;
  }

  const rank = { expired:0, dueToday:1, ok:2 };
  const groups = {};
  active.forEach(e => (groups[e.itemName] ||= []).push(e));

  const order = Object.keys(groups).sort((a,b) => {
    const wa = Math.min(...groups[a].map(e => rank[statusOf(e)]));
    const wb = Math.min(...groups[b].map(e => rank[statusOf(e)]));
    return wa - wb || a.localeCompare(b,"da");
  });

  $("list").innerHTML = order.map(name => {
    const rows = groups[name]
      .sort((a,b) => new Date(a.discardAt) - new Date(b.discardAt))
      .map(e => {
        const st = statusOf(e);
        return `
        <div class="batch ${st}">
          <div class="bTop">
            <div class="bName">${e.qty} ${esc(unitLabel(e.qty, e.unit))}</div>
            <span class="pill ${st}">${STATUS_TEXT[st]}</span>
          </div>
          <div class="bMeta">
            Skåret ${esc(fmt(e.cutAt))}${e.by ? " · " + esc(e.by) : ""}<br>
            Smides ud <b>${esc(fmt(e.discardAt))}</b> · ${esc(timeLeft(e.discardAt))}
          </div>
          <div class="bar"><i style="width:${progress(e).toFixed(0)}%"></i></div>
          <div class="acts">
            <button class="act primary" type="button" data-act="discard" data-id="${e.id}">Smidt ud</button>
            <button class="act danger" type="button" data-act="delete" data-id="${e.id}">Slet</button>
          </div>
        </div>`;
      }).join("");

    const total = groups[name].reduce((n,e) => n + e.qty, 0);
    const unit = groups[name][0].unit;
    return `
      <div class="group">${esc(name)}<span class="gc">${total} ${esc(unitLabel(total, unit))} i alt</span></div>
      <div class="list">${rows}</div>`;
  }).join("");

  $("list").querySelectorAll("button[data-act]").forEach(b =>
    b.addEventListener("click", () => {
      if (b.dataset.act === "discard") openDiscard(b.dataset.id);
      else deleteEntry(b.dataset.id);
    }));
}

function deleteEntry(id){
  const e = entries.find(x => x.id === id);
  if (!e || !confirm(`Slet registrering af ${e.itemName}?`)) return;
  entries = entries.filter(x => x.id !== id);
  saveEntries(); render();
}

/* ---------- Kassér ---------- */
function openDiscard(id){
  const e = entries.find(x => x.id === id);
  if (!e) return;
  pendingDiscard = id;
  $("discardSub").innerHTML =
    `<strong>${esc(e.itemName)}</strong> • ${e.qty} ${esc(unitLabel(e.qty, e.unit))} • skåret ${esc(fmt(e.cutAt))}`;
  $("wasteLabel").textContent =
    `Hvor mange ${unitLabel(2, e.unit)} smider du ud?`;
  $("wasteQty").value = String(e.qty);
  $("discardOverlay").classList.add("on");
  setTimeout(() => $("wasteQty").focus(), 40);
}

function closeDiscard(){
  pendingDiscard = null;
  $("discardOverlay").classList.remove("on");
}

function saveDiscard(){
  const e = entries.find(x => x.id === pendingDiscard);
  if (!e) return;
  const q = parseInt($("wasteQty").value, 10);
  if (!Number.isFinite(q) || q < 1){ $("wasteQty").focus(); return; }

  if (q >= e.qty){
    e.status = "discarded";
    e.wasteQty = e.qty;
  } else {
    e.qty -= q;
    entries.push({ ...e, id: uuid(), qty: q, status: "discarded", wasteQty: q,
                   discardedAt: new Date().toISOString() });
  }
  e.discardedAt = new Date().toISOString();
  saveEntries(); closeDiscard(); render();
}

/* ---------- Alarm ---------- */
function alarmList(){
  return entries.filter(e => e.status === "active" &&
    ["expired","dueToday"].includes(statusOf(e)));
}

function checkAlarm(force){
  if (!force && Date.now() < Number(prefs.snoozeUntil || 0)) return;
  const list = alarmList();
  if (!list.length) return;

  const expired = list.filter(e => statusOf(e) === "expired").length;
  $("alarmBanner").textContent = expired
    ? `${expired} skal smides ud NU`
    : `${list.length} udløber i dag`;

  $("alarmList").innerHTML = list.map(e => `
    <div class="batch ${statusOf(e)}" style="margin-top:8px">
      <div class="info">
        <div class="line1">${esc(e.itemName)} • ${e.qty} ${esc(unitLabel(e.qty, e.unit))}</div>
        <div class="line2">Udløb ${esc(fmt(e.discardAt))}${e.by ? " • " + esc(e.by) : ""}</div>
      </div>
      <div class="acts">
        <button class="btnSmall" data-alarm="${e.id}">Smidt ud</button>
      </div>
    </div>`).join("");

  $("alarmList").querySelectorAll("button[data-alarm]").forEach(b =>
    b.addEventListener("click", () => {
      $("alarmOverlay").classList.remove("on");
      openDiscard(b.dataset.alarm);
    }));

  $("alarmOverlay").classList.add("on");
}

/* ---------- Indstillinger ---------- */
function renderSettings(){
  $("settings").innerHTML = Object.entries(shelf).map(([id,s]) => `
    <div class="sRow">
      <div class="nm">${esc(s.name)}</div>
      <input type="number" min="1" step="1" value="${s.hours}" data-shelf="${id}"/>
      <div class="u">TIMER</div>
    </div>`).join("");

  $("settings").querySelectorAll("input[data-shelf]").forEach(inp =>
    inp.addEventListener("change", () => {
      const h = parseInt(inp.value, 10);
      if (!Number.isFinite(h) || h < 1) { inp.value = shelf[inp.dataset.shelf].hours; return; }
      shelf[inp.dataset.shelf].hours = h;
      saveShelf(); renderItems(); updatePreview();
    }));
}

/* ---------- Init ---------- */
$("by").value = prefs.lastBy || "";

$("whenSeg").querySelectorAll("button").forEach(b =>
  b.addEventListener("click", () => { setWhen(b.dataset.v); updatePreview(); }));
document.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => {
  const inp = $(b.dataset.for);
  let n = parseInt(inp.value || "0", 10); if (Number.isNaN(n)) n = 0;
  n = Math.max(Number(inp.min || 0), n + Number(b.dataset.step));
  inp.value = String(n);
  inp.dispatchEvent(new Event("input", { bubbles:true }));
}));
$("settingsBtn").addEventListener("click", () => $("settingsOverlay").classList.add("on"));
$("settingsClose").addEventListener("click", () => $("settingsOverlay").classList.remove("on"));
$("settingsOverlay").addEventListener("click", e => { if (e.target === $("settingsOverlay")) $("settingsOverlay").classList.remove("on"); });
$("dateLine").textContent = new Date().toLocaleDateString("da-DK", { weekday:"long", day:"numeric", month:"long" });
$("whenAt").addEventListener("input", updatePreview);
$("qty").addEventListener("input", updatePreview);
$("addBtn").addEventListener("click", addEntry);
$("by").addEventListener("input", () => { prefs.lastBy = $("by").value; savePrefs(); });

$("discardCancel").addEventListener("click", closeDiscard);
$("discardSave").addEventListener("click", saveDiscard);
$("discardOverlay").addEventListener("click", e => { if (e.target === $("discardOverlay")) closeDiscard(); });

$("closeAlarmBtn").addEventListener("click", () => {
  prefs.snoozeUntil = Date.now() + 10*60*1000; savePrefs();
  $("alarmOverlay").classList.remove("on");
});
$("snoozeBtn").addEventListener("click", () => {
  prefs.snoozeUntil = Date.now() + 30*60*1000; savePrefs();
  $("alarmOverlay").classList.remove("on");
});

$("clearBtn").addEventListener("click", () => {
  if (!confirm("Slet ALLE registreringer på denne enhed?")) return;
  entries = []; saveEntries(); render();
});

renderItems();
renderSettings();
updatePreview();
render();
checkAlarm(false);

setInterval(() => { render(); checkAlarm(false); }, 60000);
})();
</script>
</body>
</html>
