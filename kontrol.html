<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kaiser Kontrol">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3B2A20">
<title>Kaiser Kontrol</title>
<link rel="manifest" href="kontrol-manifest.json">
<link rel="apple-touch-icon" href="images/logo.png">
<link rel="icon" href="images/logo.png">
<style>
:root{
  --cream:#FAF6EF; --paper:#FFFDF8; --espresso:#3B2A20; --espresso-soft:#5A4436;
  --line:#E3D9C8; --ink:#2B2018; --muted:#8A7A68;
  --gron:#00B050; --gul:#F2C200; --rod:#E03131;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;padding-bottom:96px}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:600}
header{background:var(--espresso);color:#F3EADA;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px}
header img{height:38px;width:auto;flex:none;border-radius:6px;background:#F3EADA;padding:3px}
header h1{margin:0;font-size:18px;letter-spacing:.3px}
header .sub{font-size:12.5px;opacity:.75;margin-top:2px}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
label.fld{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:5px}
select,input[type=text],input[type=date],textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:16px;font-family:inherit;color:var(--ink)}
textarea{resize:vertical;min-height:52px}
.row{display:flex;gap:10px}.row>*{flex:1}
.mb{margin-bottom:12px}
button{font-family:inherit;font-size:16px;border:none;border-radius:10px;padding:13px 16px;background:var(--espresso);color:#F3EADA;width:100%;cursor:pointer}
button.ghost{background:transparent;color:var(--espresso);border:1px solid var(--line)}
button.small{padding:9px 12px;font-size:14px;width:auto}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;background:var(--paper);color:var(--espresso-soft);border:1px solid var(--line);font-family:Georgia,serif;font-size:15px;padding:12px 6px}
.tabs button.on{background:var(--espresso);color:#F3EADA;border-color:var(--espresso)}
.area{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.area>summary{list-style:none;padding:14px;display:flex;align-items:center;gap:10px;cursor:pointer;font-family:Georgia,serif;font-size:16.5px}
.area>summary::-webkit-details-marker{display:none}
.area>summary .nm{flex:1}
.pills{display:flex;gap:5px}
.pill{min-width:26px;text-align:center;font-size:12px;font-weight:700;padding:2px 6px;border-radius:20px;color:#fff;font-family:-apple-system,sans-serif}
.pill.g{background:var(--gron)}.pill.y{background:var(--gul);color:#4a3a00}.pill.r{background:var(--rod)}
.pill.z{background:#DED4C2;color:#8A7A68}
.grp{padding:4px 14px 0;font-family:Georgia,serif;font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-top:10px}
.q{padding:11px 14px;border-top:1px solid var(--line)}
.q .txt{font-size:15px;margin-bottom:9px}
.sev{display:flex;gap:6px}
.sev button{flex:1;padding:11px 4px;font-size:14px;background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:9px}
.sev button.on[data-s="1"]{background:var(--gron);color:#fff;border-color:var(--gron)}
.sev button.on[data-s="2"]{background:var(--gul);color:#4a3a00;border-color:var(--gul)}
.sev button.on[data-s="3"]{background:var(--rod);color:#fff;border-color:var(--rod)}
.sev button[data-s="4"]{flex:1.3;font-size:12.5px}
.sev button.on[data-s="4"]{background:#8A7A68;color:#fff;border-color:#8A7A68}
.q.na .txt{color:var(--muted);text-decoration:line-through}
.q textarea{margin-top:9px;display:none}
.q.hasnote textarea,.q.open textarea{display:block}
.omrnote{padding:12px 14px 14px;border-top:1px solid var(--line);background:#FDFBF5}
table.res{width:100%;border-collapse:collapse;font-size:14.5px}
table.res td{padding:9px 4px;border-bottom:1px dotted var(--line)}
table.res td.n{text-align:center;width:44px;font-weight:700}
table.res tr.tot td{border-top:2px solid var(--espresso);border-bottom:none;font-weight:700;padding-top:11px}
.legend{font-size:13px;color:var(--muted);line-height:1.7}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:10px;z-index:60}
.bar .sum{flex:1;display:flex;align-items:center;gap:5px}
.tabs.sub button{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;padding:10px 6px}
.tabs.sub button.on{background:var(--espresso-soft);border-color:var(--espresso-soft)}
.xrow{display:flex;gap:8px;margin-top:8px}.xrow input{flex:1;min-width:0}
.xrow input:first-child{flex:2}
.hide{display:none}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.wl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-top:10px}
.wl input{width:auto;flex:none}
</style>
</head>
<body>
<header>
  <img src="images/logo.png" alt="" onerror="this.style.display='none'">
  <div>
    <h1 id="hTitle">Kaiser Kontrol</h1>
    <div class="sub" id="hSub">Intern fødevarekontrol</div>
  </div>
</header>

<div class="wrap">

  <div class="card" id="setup">
    <div class="mb">
      <label class="fld" for="afd">Afdeling</label>
      <select id="afd"></select>
    </div>
    <div class="row mb">
      <div>
        <label class="fld" for="dato">Dato</label>
        <input type="date" id="dato">
      </div>
      <div>
        <label class="fld" for="kontrollant">Kontrollant</label>
        <select id="kontrollant"></select>
      </div>
    </div>
    <div class="legend">
      <span class="dot" style="background:var(--gron)"></span>Grøn — mindre bemærkning<br>
      <span class="dot" style="background:var(--gul)"></span>Gul — bemærkning der skal rettes<br>
      <span class="dot" style="background:var(--rod)"></span>Rød — alvorlig/kritisk afvigelse<br>
      <span class="dot" style="background:#8A7A68"></span>Ikke relevant — tælles ikke med<br>
      <span class="dot" style="background:#DED4C2"></span>Uden markering = i orden. Tryk på en farve igen for at fjerne den.
    </div>
    <label class="wl"><input type="checkbox" id="wl" checked> Hold skærmen tændt under kontrollen</label>
  </div>

  <div class="tabs">
    <button id="tBoh" class="on" onclick="setTab('boh')">Back of house</button>
    <button id="tFoh" onclick="setTab('foh')">Front of house</button>
    <button id="tRes" onclick="setTab('res')">Resultat</button>
  </div>

  <div class="tabs sub hide" id="fohValg">
    <button id="tF14" onclick="setFoh('foh14')">14 dags check</button>
    <button id="tF6" onclick="setFoh('foh6')">6 mdr. check</button>
  </div>
  <div class="note hide" id="fohInfo" style="margin:-6px 2px 12px"></div>

  <div id="areas"></div>
  <div id="ekstra"></div>

  <div id="result" class="hide">
    <div class="card">
      <h2 style="margin:0 0 10px;font-size:17px" id="resTitel">Resultat</h2>
      <table class="res" id="resTab"></table>
      <div class="note" id="resMeta"></div>
    </div>
    <div class="card">
      <label class="fld" for="opsum">Samlet kommentar til afdelingen</label>
      <textarea id="opsum" rows="4" placeholder="Skrives med i mailen…"></textarea>
      <div style="height:10px"></div>
      <label class="fld" for="sprog">Mailens sprog</label>
      <select id="sprog" class="mb">
        <option value="begge">Dansk + English</option>
        <option value="da">Kun dansk</option>
        <option value="en">Only English</option>
      </select>
      <button onclick="sendMail()">✉️ Send mail til afdeling</button>
      <div style="height:8px"></div>
      <button class="ghost" onclick="kopierRapport()">📋 Kopiér rapport (hvis mailen er for lang)</button>
      <div class="note" id="kopiMsg"></div>
      <div style="height:8px"></div>
      <button class="ghost" onclick="nulstil()">Nulstil denne kontrol</button>
      <div class="note" id="resNote"></div>
    </div>
  </div>

</div>

<div class="bar">
  <div class="sum" id="barSum"></div>
  <button class="small" onclick="setTab('res')">Resultat</button>
  <button class="small" onclick="sendMail()">✉️ Mail</button>
</div>

const $ = id => document.getElementById(id);
let tab = 'boh';        // aktiv fane
let sek = 'boh';        // aktiv kontrol (boh/foh) — Resultat viser altid den sidst valgte
let state = {};         // svar for DEN aktive kontrol
let opsum = '';

const SEKNAVN = { boh: 'Back of house', foh6: 'Front of house – 6 mdr. check', foh14: 'Front of house – 14 dags check' };
let fohValg = 'foh14';   // senest valgte FOH-liste

/* Fritekstfelter på 14 dags check (afsnit 7–9 i arket) */
const EKSTRA = {
  foh14: [
    { titel: 'Mulige forbedringer & idéer', note: 'Noget vi med fordel kan ændre, forbedre eller opgradere – selvom det ikke er en fejl.',
      rækker: 3, felter: ['Forbedring / idé', 'Næste skridt / ansvarlig', 'Deadline'] },

    { titel: 'Maks. 3 handlinger', note: 'Følges op ved næste besøg.',
      rækker: 3, felter: ['Handling', 'Ansvarlig', 'Deadline'] }
  ]
};

/* ---------- nøgle / gem — hver kontrol gemmes for sig ---------- */
const key = () => 'kaiserkontrol:' + $('afd').value + ':' + $('dato').value + ':' + sek;
function gem(){
  localStorage.setItem(key(), JSON.stringify({
    kontrollant: $('kontrollant').value,
    opsum: opsum,
    state: state
  }));
  localStorage.setItem('kaiserkontrol:sidste', JSON.stringify({
    afd: $('afd').value, sek: sek, foh: fohValg, kontrollant: $('kontrollant').value
  }));
}
function hent(){
  const raw = localStorage.getItem(key());
  const o = raw ? JSON.parse(raw) : {};
  state = o.state || {};
  opsum = o.opsum || '';
  if(o.kontrollant && KONTROLLANTER.includes(o.kontrollant)) $('kontrollant').value = o.kontrollant;
  $('opsum').value = opsum;
}

/* ---------- opsætning ---------- */
AFDELINGER.forEach(a => {
  const op = document.createElement('option');
  op.value = a.navn; op.textContent = a.navn;
  $('afd').appendChild(op);
});
KONTROLLANTER.forEach(n => {
  const op = document.createElement('option');
  op.value = n; op.textContent = n;
  $('kontrollant').appendChild(op);
});
$('dato').value = new Date().toISOString().slice(0,10);
try{
  const s = JSON.parse(localStorage.getItem('kaiserkontrol:sidste') || '{}');
  if(s.afd) $('afd').value = s.afd;
  if(s.kontrollant) $('kontrollant').value = s.kontrollant;
  if(s.foh) fohValg = s.foh;
  if(s.sek === 'foh') s.sek = 'foh6';          // ældre version
  if(s.sek && DATA[s.sek]) { sek = s.sek; tab = s.sek.startsWith('foh') ? 'foh' : 'boh'; }
}catch(e){}
$('afd').onchange = () => { hent(); render(); };
$('dato').onchange = () => { hent(); render(); };
$('kontrollant').onchange = gem;
$('opsum').oninput = function(){ opsum = this.value; gem(); };

function setFoh(v){
  fohValg = v;
  setTab('foh');
}
function setTab(t){
  const ny = t === 'boh' ? 'boh' : t === 'foh' ? fohValg : null;
  if(ny && ny !== sek){ sek = ny; hent(); }
  tab = t;
  $('tBoh').className = t==='boh' ? 'on' : '';
  $('tFoh').className = t==='foh' ? 'on' : '';
  $('tRes').className = t==='res' ? 'on' : '';
  $('areas').className = t==='res' ? 'hide' : '';
  $('ekstra').className = t==='res' ? 'hide' : '';
  $('fohValg').className = t==='foh' ? 'tabs sub' : 'tabs sub hide';
  $('fohInfo').className = t==='foh' ? 'note' : 'note hide';
  $('tF6').className = fohValg==='foh6' ? 'on' : '';
  $('tF14').className = fohValg==='foh14' ? 'on' : '';
  $('fohInfo').textContent = fohValg==='foh14'
    ? 'Fast fysisk gennemgang før åbning – i forbindelse med 1:1 caféchefmøde.'
    : 'Stor halvårlig gennemgang: lager, bar, café og administrativt.';
  $('result').className = t==='res' ? '' : 'hide';
  if(t==='res') renderResultat(); else render();
  gem();
  window.scrollTo(0,0);
}

/* ---------- render skema ---------- */
function render(){
  $('hTitle').textContent = 'Kaiser Kontrol — ' + $('afd').value;
  $('hSub').textContent = SEKNAVN[sek] + ' · ' + $('dato').value;
  if(tab === 'res') return;
  const data = DATA[sek];
  let h = '';
  for(const omr in data){
    const t = tal(omr);
    h += '<details class="area"><summary><span class="nm">'+esc(omr)+'</span><span class="pills">'
       + pill('g',t[1]) + pill('y',t[2]) + pill('r',t[3]) + '</span></summary>';
    data[omr].forEach(g => {
      if(data[omr].length > 1 || !omr.startsWith(g.t)) h += '<div class="grp">'+esc(g.t)+'</div>';
      g.q.forEach(q => {
        const k = omr+'|'+g.t+'|'+q;
        const v = state[k] || {s:0,k:''};
        h += '<div class="q'+(v.k?' hasnote':'')+(v.s===4?' na':'')+'" id="q_'+hash(k)+'">'
           + '<div class="txt">'+esc(q)+'</div><div class="sev">';
        for(let s=1;s<5;s++){
          h += '<button data-s="'+s+'"'+(v.s===s?' class="on"':'')
             + ' onclick="saet(\''+esc2(k)+'\','+s+')">'+NIVEAU[s]+'</button>';
        }
        h += '</div><textarea rows="2" placeholder="Kommentar…" oninput="note(\''+esc2(k)+'\',this.value)">'
           + esc(v.k) + '</textarea></div>';
      });
    });
    const ak = 'omr|'+omr;
    const av = (state[ak]||{k:''}).k;
    h += '<div class="omrnote"><label class="fld">Kommentar til '+esc(omr)+'</label>'
       + '<textarea rows="3" placeholder="Samlet kommentar til området…" '
       + 'oninput="note(\''+esc2(ak)+'\',this.value)">'+esc(av)+'</textarea></div>';
    h += '</details>';
  }
  $('areas').innerHTML = h;
  renderEkstra();
  opdaterBar();
}

function renderEkstra(){
  const ex = EKSTRA[sek] || [];
  let h = '';
  ex.forEach((b, bi) => {
    h += '<div class="card"><h2 style="margin:0 0 4px;font-size:16.5px">'+esc(b.titel)+'</h2>';
    if(b.note) h += '<div class="note" style="margin:0 0 6px">'+esc(b.note)+'</div>';
    if(b.tekst) b.tekst.forEach((lbl, i) => {
      const k = 'x|'+bi+'|'+i;
      h += '<label class="fld" style="margin-top:10px">'+esc(lbl)+'</label>'
         + '<textarea rows="2" oninput="note(\''+k+'\',this.value)">'+esc((state[k]||{}).k)+'</textarea>';
    });
    if(b.rækker) for(let r=0;r<b.rækker;r++){
      h += '<div class="xrow">';
      b.felter.forEach((f, fi) => {
        const k = 'x|'+bi+'|'+r+'|'+fi;
        h += '<input type="text" placeholder="'+esc(f)+'" value="'+esc((state[k]||{}).k)+'" oninput="note(\''+k+'\',this.value)">';
      });
      h += '</div>';
    }
    h += '</div>';
  });
  $('ekstra').innerHTML = h;
}
function saet(k,s){
  const v = state[k] || {s:0,k:''};
  v.s = (v.s === s) ? 0 : s;      // tryk igen = fjern markering
  state[k] = v;
  gem();
  const el = $('q_'+hash(k));
  el.querySelectorAll('.sev button').forEach(b => {
    b.className = (+b.dataset.s === v.s) ? 'on' : '';
  });
  el.classList.toggle('na', v.s === 4);
  if(v.s > 0 && v.s < 4){
    el.classList.add('open');
    const ta = el.querySelector('textarea');
    setTimeout(() => ta.focus(), 50);
  }
  opdaterPills();
  opdaterBar();
}
function note(k,val){
  const v = state[k] || {s:0,k:''};
  v.k = val; state[k] = v; gem();
}

/* ---------- optælling (samme pointsystem som arket) ---------- */
function tal(omr){
  const t = [0,0,0,0,0];
  DATA[sek][omr].forEach(g => g.q.forEach(q => {
    const v = state[omr+'|'+g.t+'|'+q];
    t[v ? v.s : 0]++;
  }));
  return t;
}
function talAlt(){
  const t = [0,0,0,0,0];
  for(const omr in DATA[sek]){
    const a = tal(omr);
    for(let i=0;i<5;i++) t[i]+=a[i];
  }
  return t;
}
function pill(c,n){ return '<span class="pill '+(n?c:'z')+'">'+n+'</span>'; }

function opdaterPills(){
  const navne = Object.keys(DATA[sek]); let i=0;
  document.querySelectorAll('#areas .area').forEach(d => {
    const t = tal(navne[i++]);
    d.querySelector('.pills').innerHTML = pill('g',t[1])+pill('y',t[2])+pill('r',t[3]);
  });
}
function opdaterBar(){
  const t = talAlt();
  $('barSum').innerHTML = pill('g',t[1])+pill('y',t[2])+pill('r',t[3]);
}

/* ---------- resultat (kun den aktive kontrol) ---------- */
function renderResultat(){
  $('hTitle').textContent = 'Kaiser Kontrol — ' + $('afd').value;
  $('hSub').textContent = 'Resultat · ' + SEKNAVN[sek] + ' · ' + $('dato').value;
  $('resTitel').textContent = 'Resultat — ' + SEKNAVN[sek];
  let h = '<tr><td></td>'
        + '<td class="n"><span class="dot" style="background:var(--gron)"></span></td>'
        + '<td class="n"><span class="dot" style="background:var(--gul)"></span></td>'
        + '<td class="n"><span class="dot" style="background:var(--rod)"></span></td></tr>';

    const t = tal(omr);
    h += '<tr><td>'+esc(omr)+'</td><td class="n">'+t[1]+'</td><td class="n">'+t[2]+'</td><td class="n">'+t[3]+'</td></tr>';
  }
  const s = talAlt();
  h += '<tr class="tot"><td>I ALT</td><td class="n">'+s[1]+'</td><td class="n">'+s[2]+'</td><td class="n">'+s[3]+'</td></tr>';

/* ---------- mail — kun den aktive kontrol ---------- */
const TXT = {
  da: { titel:'KAISER KONTROL', afd:'Afdeling', dato:'Dato', kontr:'Kontrollant', res:'RESULTAT',
        r:'RØD – rettes straks', g2:'GUL – rettes inden næste kontrol', g:'GRØN – mindre bemærkninger',
        omr:'KOMMENTARER PR. OMRÅDE', sam:'SAMLET KOMMENTAR', ingen:'✅ Ingen bemærkninger',
        note:'Punkterne er afvigelser fra kontrolpunktet.' },
  en: { titel:'KAISER INSPECTION', afd:'Location', dato:'Date', kontr:'Inspector', res:'RESULT',
        r:'RED – fix immediately', g2:'YELLOW – fix before next inspection', g:'GREEN – minor remarks',
        omr:'COMMENTS PER AREA', sam:'OVERALL COMMENT', ingen:'✅ No findings',
        note:'Items listed are deviations from the check point. Written notes are shown as entered.' }
};
const LINJE = '━━━━━━━━━━━━━━━━━━';
const tr = (t, l) => (l === 'en' ? (EN[t] || t) : t);
const pen = d => d ? d.split('-').reverse().join('-') : d;

function ekstraTekst(l){
  const ex = EKSTRA[sek] || [];
  let ud = '';
  ex.forEach((b, bi) => {
    let linjer = '';
    if(b.tekst) b.tekst.forEach((lbl, i) => {
      const v = ((state['x|'+bi+'|'+i]||{}).k||'').trim();
      if(v) linjer += '• ' + tr(lbl,l) + ': ' + v + '\n';
    });
    if(b.rækker) for(let r=0;r<b.rækker;r++){
      const d = b.felter.map((f, fi) => ((state['x|'+bi+'|'+r+'|'+fi]||{}).k||'').trim());
      if(d[0]) linjer += '• ' + d[0] + (d[1] ? ' | ' + d[1] : '') + (d[2] ? ' | ' + d[2] : '') + '\n';
    }
    if(linjer) ud += '\n' + tr(b.titel,l).toUpperCase() + '\n' + linjer;
  });
  return ud;
}

function rapport(l){
  const T = TXT[l], s = talAlt();
  const ikon = {3:'🔴', 2:'🟡', 1:'🟢'};
  const kopi = {3:T.r, 2:T.g2, 1:T.g};
  let t = T.titel + ' · ' + $('afd').value.toUpperCase() + '\n'
        + (l==='en' ? SEKNAVN_EN[sek] : SEKNAVN[sek]) + '\n'
        + T.dato + ': ' + pen($('dato').value) + '  |  ' + T.kontr + ': ' + ($('kontrollant').value || '-') + '\n\n'
        + T.res + '\n🔴 ' + s[3] + '   🟡 ' + s[2] + '   🟢 ' + s[1] + '\n' + LINJE + '\n';
  let nogen = false;
  [3,2,1].forEach(niv => {
    let blok = '';
    for(const omr in DATA[sek]){
      DATA[sek][omr].forEach(g => g.q.forEach(q => {
        const v = state[omr+'|'+g.t+'|'+q];
        if(v && v.s === niv){
          const sti = tr(omr,l) + (g.t !== omr && !omr.startsWith(g.t) ? ' › ' + tr(g.t,l) : '');
          blok += '• ' + sti + ': ' + tr(q,l) + '\n' + (v.k && v.k.trim() ? '   ↳ ' + v.k.trim() + '\n' : '');
        }
      }));
    }
    if(blok){ nogen = true; t += '\n' + ikon[niv] + ' ' + kopi[niv] + '\n' + blok; }
  });
  if(!nogen) t += '\n' + T.ingen + '\n';

  let omrTxt = '';
  for(const omr in DATA[sek]){
    const k = ((state['omr|'+omr] || {k:''}).k || '').trim();
    if(k) omrTxt += '• ' + tr(omr,l) + ': ' + k + '\n';
  }
  if(omrTxt) t += '\n' + T.omr + '\n' + omrTxt;
  t += ekstraTekst(l);
  if(opsum.trim()) t += '\n' + T.sam + '\n' + opsum.trim() + '\n';
  t += '\n' + T.note + '\n';
  return t;
}

function mailKrop(){
  const sprog = $('sprog').value;
  if(sprog === 'da') return rapport('da');
  if(sprog === 'en') return rapport('en');
  return rapport('da') + '\n' + LINJE + LINJE + '\n🇬🇧 ENGLISH\n' + LINJE + LINJE + '\n\n' + rapport('en');
}

function sendMail(){
  const afd = AFDELINGER.find(a => a.navn === $('afd').value) || {mail:''};
  const s = talAlt();
  const sprog = $('sprog').value;
  const emne = (sprog==='en' ? 'Inspection' : sprog==='da' ? 'Kontrol' : 'Kontrol / Inspection')
             + ' – ' + $('afd').value + ' – ' + SEKNAVN[sek].split(' – ')[0] + ' – ' + pen($('dato').value)
             + ' (🔴' + s[3] + ' 🟡' + s[2] + ' 🟢' + s[1] + ')';
  window.location.href = 'mailto:' + afd.mail.split(',').map(m => encodeURIComponent(m.trim())).join(',')
    + '?subject=' + encodeURIComponent(emne)
    + (CC_MAIL ? '&cc=' + CC_MAIL.split(',').map(m => encodeURIComponent(m.trim())).join(',') : '')
    + '&body=' + encodeURIComponent(mailKrop());
}

async function kopierRapport(){
  const t = mailKrop();
  try { await navigator.clipboard.writeText(t); $('kopiMsg').textContent = '✔ Kopieret – indsæt i en mail'; }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand('copy'); $('kopiMsg').textContent = '✔ Kopieret – indsæt i en mail'; }
    catch(e2){ $('kopiMsg').textContent = 'Kunne ikke kopiere'; }
    ta.remove();
  }
  setTimeout(() => $('kopiMsg').textContent = '', 4000);
}
$('sprog').value = localStorage.getItem('kaiserkontrol:sprog') || 'begge';
$('sprog').onchange = function(){ localStorage.setItem('kaiserkontrol:sprog', this.value); };

function nulstil(){
  if(!confirm('Slet ' + SEKNAVN[sek] + ' for ' + $('afd').value + ' den ' + $('dato').value + '?')) return;
  localStorage.removeItem(key());
  state = {}; opsum = ''; $('opsum').value = '';
  render(); renderResultat();
}

/* ---------- hold skærmen tændt ---------- */
let wakeLock = null;
async function taWakeLock(){
  if(!$('wl').checked || !('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
}
$('wl').onchange = function(){
  if(this.checked) taWakeLock();
  else if(wakeLock){ wakeLock.release(); wakeLock = null; }
};
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') taWakeLock();
});
document.addEventListener('click', function once(){
  taWakeLock();
  document.removeEventListener('click', once);
});

/* ---------- hjælpere ---------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function esc2(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function hash(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return 'k'+Math.abs(h); }

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('kontrol-sw.js', { scope: './kontrol.html' }).catch(()=>{}));
}

hent();
setTab(tab);
