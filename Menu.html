<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c1c1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Café Kaiser · Tjenerguide Q4</title>
<style>
:root{
  color-scheme:light;
  --bg:#12100e; --card:#fff; --ink:#1c1c1c; --gold:#c9a227; --gold-lt:#e8c86a;
  --mut:#8b8578; --grn:#1a7a45; --grn-lt:#e6f6ec; --red:#c0392b; --red-lt:#fdefed;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}

/* ══ SHELL ══ */
#app{
  width:100%;max-width:460px;height:100dvh;max-height:900px;
  background:var(--bg);position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}

/* ══ TOPBAR ══ */
#bar{
  flex:none;padding:14px 16px 10px;background:var(--bg);
  display:flex;flex-direction:column;gap:9px;z-index:30;
}
#bar .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
#chap{font-size:10px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold-lt);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#count{font-size:10px;font-weight:700;color:#6b665c;font-variant-numeric:tabular-nums;flex:none}
#menuBtn{
  flex:none;width:30px;height:30px;border:none;background:rgba(255,255,255,.07);
  border-radius:9px;color:#b5ac9c;font-size:15px;line-height:1;cursor:pointer;
}
#track{height:3px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-lt));
  border-radius:3px;transition:width .35s cubic-bezier(.4,0,.2,1)}

/* ══ STAGE ══ */
#stage{flex:1;position:relative;overflow:hidden;padding:0 12px}
.card{
  position:absolute;inset:0 12px;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  opacity:0;pointer-events:none;transform:translateX(24px);
  transition:opacity .26s ease,transform .26s ease;
  padding-bottom:12px;
}
.card.on{opacity:1;pointer-events:auto;transform:none}
.card.prev{transform:translateX(-24px)}
.card::-webkit-scrollbar{display:none}

.sheet{background:var(--card);border-radius:20px;overflow:hidden;min-height:100%;
  box-shadow:0 6px 26px rgba(0,0,0,.35);display:flex;flex-direction:column}

/* ══ PHOTO SLOT ══ */
.photo{position:relative;aspect-ratio:4/3;background:#efece5;flex:none;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ph{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:7px;color:#b3aa98;text-align:center;padding:16px;
  background:repeating-linear-gradient(45deg,#f3f0e9,#f3f0e9 11px,#ebe7de 11px,#ebe7de 22px);
}
.photo .ph .ic{font-size:26px;opacity:.5}
.photo .ph .fn{font-size:10px;font-weight:700;letter-spacing:.4px;background:#fff;
  padding:4px 10px;border-radius:20px;color:#8a8275}
.photo .ph .hint{font-size:9.5px;color:#b9b0a0;max-width:190px;line-height:1.5}
.photo .pill{position:absolute;top:11px;left:11px;background:rgba(0,0,0,.72);color:#fff;
  font-size:9.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;
  padding:5px 11px;border-radius:20px;backdrop-filter:blur(6px)}
.photo .prc{position:absolute;bottom:11px;right:11px;background:var(--gold);color:#12100e;
  font-size:15px;font-weight:900;padding:6px 13px;border-radius:20px}

/* ══ BODY ══ */
.pad{padding:17px 18px 20px;flex:1;display:flex;flex-direction:column}
.dish{font-size:23px;font-weight:800;line-height:1.15;letter-spacing:-.4px;margin-bottom:7px}
.comp{font-size:13.5px;color:#6e675c;line-height:1.55;margin-bottom:15px}

.blk{border-radius:13px;padding:13px 14px;margin-bottom:9px}
.blk .lbl{font-size:9.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;
  margin-bottom:6px;display:flex;align-items:center;gap:5px}
.blk p{font-size:13.5px;line-height:1.6}

.say{background:var(--grn-lt);border-left:3px solid var(--grn)}
.say .lbl{color:var(--grn)}
.say p{color:#14532d;font-weight:600;font-style:italic}

.ask{background:#f4f2ed}
.ask .lbl{color:#8a8275}
.ask p{color:#4a453d}

.tip{background:#fff8e1;border-left:3px solid var(--gold)}
.tip .lbl{color:#8a6d0b}
.tip p{color:#5c4a08}

.alg{background:var(--red-lt);border-left:3px solid var(--red)}
.alg .lbl{color:var(--red)}
.alg p{color:#8c271d;font-weight:600}

/* ══ CHAPTER CARD ══ */
.chapcard{background:linear-gradient(165deg,#1f1c18,#2e2921);color:#fff;border-radius:20px;
  min-height:100%;display:flex;flex-direction:column;justify-content:center;
  padding:38px 26px;text-align:center;box-shadow:0 6px 26px rgba(0,0,0,.35)}
.chapcard .no{font-size:11px;font-weight:800;letter-spacing:2.5px;color:var(--gold-lt);margin-bottom:14px}
.chapcard h2{font-size:31px;font-weight:900;line-height:1.1;letter-spacing:-.7px;margin-bottom:12px}
.chapcard p{font-size:14px;color:#a9a093;line-height:1.6;max-width:280px;margin:0 auto}
.chapcard .mini{margin-top:20px;font-size:11px;color:#6f675c;letter-spacing:.6px}

/* ══ INFO CARD ══ */
.info h2{font-size:25px;font-weight:800;line-height:1.15;letter-spacing:-.4px;margin-bottom:8px}
.info .sub{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--gold);margin-bottom:13px}
.rows{margin:4px 0 12px}
.rw{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f0ede6;font-size:13.5px}
.rw:last-child{border:none}
.rw b{flex:none;width:92px;color:#8a8275;font-weight:700;font-size:12px}
.rw span{color:#3d382f;line-height:1.5}
.lst{list-style:none;margin:2px 0 10px}
.lst li{font-size:13px;padding:7px 0 7px 17px;position:relative;color:#4a453d;
  border-bottom:1px solid #f4f1ea;line-height:1.45}
.lst li:last-child{border:none}
.lst li:before{content:'';position:absolute;left:0;top:14px;width:5px;height:5px;
  border-radius:50%;background:var(--gold)}

/* ══ QUIZ ══ */
.quiz .q{font-size:19px;font-weight:800;line-height:1.3;margin-bottom:16px;letter-spacing:-.2px}
.opt{display:block;width:100%;text-align:left;background:#f6f4ef;border:2px solid transparent;
  border-radius:13px;padding:14px 15px;margin-bottom:9px;font-size:14px;font-weight:600;
  color:#3d382f;cursor:pointer;font-family:inherit;transition:.14s;line-height:1.4}
.opt:active{transform:scale(.98)}
.opt.ok{background:var(--grn-lt);border-color:var(--grn);color:#14532d}
.opt.no{background:var(--red-lt);border-color:var(--red);color:#8c271d}
.fb{font-size:13px;line-height:1.55;padding:12px 14px;border-radius:12px;margin-top:4px;
  display:none;background:#f4f2ed;color:#4a453d}
.fb.show{display:block}

/* ══ DONE ══ */
.done{background:linear-gradient(165deg,#1a3d28,#276b42);color:#fff;border-radius:20px;
  min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:38px 26px;text-align:center}
.done .big{font-size:52px;margin-bottom:14px}
.done h2{font-size:27px;font-weight:900;margin-bottom:10px;letter-spacing:-.4px}
.done p{font-size:14px;color:#bfe0cc;line-height:1.6;max-width:270px;margin-bottom:8px}
.done .score{font-size:15px;font-weight:800;color:var(--gold-lt);margin:14px 0 20px}
.done button{background:#fff;color:#1a3d28;border:none;border-radius:30px;padding:13px 30px;
  font-size:14px;font-weight:800;font-family:inherit;cursor:pointer}

/* ══ NAV ══ */
#nav{flex:none;display:flex;gap:9px;padding:10px 16px calc(12px + var(--safe-b));background:var(--bg);z-index:30}
#nav button{flex:1;border:none;border-radius:14px;padding:15px;font-size:14.5px;font-weight:800;
  font-family:inherit;cursor:pointer;transition:.14s}
#nav button:active{transform:scale(.97)}
#back{flex:0 0 58px;background:rgba(255,255,255,.08);color:#b5ac9c;font-size:17px}
#back:disabled{opacity:.25}
#next{background:var(--gold);color:#12100e}

/* ══ START ══ */
#start{position:absolute;inset:0;z-index:60;background:linear-gradient(170deg,#1c1815,#332d24);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:38px 28px;text-align:center;color:#fff}
#start.gone{display:none}
#start .logo{font-size:12px;font-weight:800;letter-spacing:4px;color:var(--gold-lt);margin-bottom:22px}
#start h1{font-size:38px;font-weight:900;line-height:1.05;letter-spacing:-1px;margin-bottom:14px}
#start .tag{font-size:15px;color:#a9a093;line-height:1.6;max-width:290px;margin-bottom:26px}
#start .facts{display:flex;gap:9px;margin-bottom:30px;flex-wrap:wrap;justify-content:center}
#start .f{background:rgba(255,255,255,.07);border-radius:11px;padding:11px 15px;min-width:82px}
#start .f b{display:block;font-size:20px;font-weight:900;color:var(--gold-lt)}
#start .f span{font-size:9.5px;color:#8b8578;letter-spacing:.8px;text-transform:uppercase}
#start button{background:var(--gold);color:#12100e;border:none;border-radius:30px;
  padding:16px 44px;font-size:16px;font-weight:900;font-family:inherit;cursor:pointer}
#start .note{margin-top:18px;font-size:11px;color:#6f675c;line-height:1.6;max-width:260px}

/* ══ MENU ══ */
#ov{position:absolute;inset:0;z-index:70;background:rgba(10,9,8,.93);backdrop-filter:blur(8px);
  display:none;flex-direction:column;padding:16px}
#ov.on{display:flex}
#ov h3{color:#fff;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  padding:8px 4px 14px;display:flex;justify-content:space-between;align-items:center}
#ov h3 button{background:rgba(255,255,255,.1);border:none;color:#b5ac9c;width:30px;height:30px;
  border-radius:9px;font-size:15px;cursor:pointer;font-family:inherit}
#ov .list{overflow-y:auto;flex:1}
#ov .it{display:flex;align-items:center;gap:11px;padding:14px;background:rgba(255,255,255,.055);
  border-radius:13px;margin-bottom:8px;cursor:pointer}
#ov .it .n{width:25px;height:25px;flex:none;border-radius:8px;background:var(--gold);color:#12100e;
  font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
#ov .it .t{color:#fff;font-size:14px;font-weight:700}
#ov .it .c{color:#787064;font-size:10.5px;margin-top:1px}

@media(max-height:660px){
  .photo{aspect-ratio:16/10}
  .dish{font-size:20px}
  #start h1{font-size:31px}
}
</style>
</head>
<body>

<div id="app">

  <!-- START -->
  <div id="start">
    <div class="logo">CAFÉ KAISER</div>
    <h1>Q4 Menu<br>Tjenerguide</h1>
    <div class="tag">Alt det nye på kortet — og hvad du siger til gæsten.</div>
    <div class="facts">
      <div class="f"><b>9</b><span>Nye retter</span></div>
      <div class="f"><b>6</b><span>Minutter</span></div>
      <div class="f"><b>5</b><span>Quiz</span></div>
    </div>
    <button onclick="begin()">Kom i gang</button>
    <div class="note">Swipe til siden eller brug knapperne nederst</div>
  </div>

  <!-- MENU -->
  <div id="ov">
    <h3><span>Spring til</span><button onclick="toggleMenu()">✕</button></h3>
    <div class="list" id="ovList"></div>
  </div>

  <!-- TOPBAR -->
  <div id="bar">
    <div class="row">
      <div id="chap">—</div>
      <div style="display:flex;align-items:center;gap:9px">
        <div id="count">1/1</div>
        <button id="menuBtn" onclick="toggleMenu()">☰</button>
      </div>
    </div>
    <div id="track"><div id="fill"></div></div>
  </div>

  <!-- STAGE -->
  <div id="stage"></div>

  <!-- NAV -->
  <div id="nav">
    <button id="back" onclick="go(-1)">‹</button>
    <button id="next" onclick="go(1)">Videre</button>
  </div>

</div>

 say:'"Vi samler ind til syge og udsatte børn. Du kan købe et blad til vores donationstræ for 25 kroner — hele beløbet går ubeskåret videre."',

/* ─── KAPITEL 5: QUIZ ─── */
{t:'chapter', chap:'Quiz', no:'Kapitel 5 af 5', h:'Kan du huske det?',
 p:'Fem spørgsmål. Du kan ikke dumpe — det er bare for at få det til at sidde fast.',
 mini:'5 spørgsmål · 1 min'},

{t:'quiz', chap:'Quiz', q:'Hvad serveres der til det braiserede svinebryst?',
 opts:['Bagte løg, rødvinssauce, grønkål og kartofler',
       'Kartoffelmos, rødkål og andesky',
       'Pommes frites og bearnaise'],
 ans:0, fb:'Bagte løg · rødvinssauce · smørstegt grønkål · kartofler. Og husk Ripasso som vinanbefaling.'},

 opts:['Avocado smørrebrød','Vintersalat','Kartoffel tarlet'],
 ans:1, fb:'Vintersalaten indeholder pistacie. Kaisers æblekage og Bounty dessert har også nødder.'},

{t:'quiz', chap:'Quiz', q:'Hvad koster en juleplatte med 6 elementer?',

{t:'quiz', chap:'Quiz', q:'Hvad koster et blad til donationstræet?',
 opts:['10,-','25,-','50,-'],
 ans:1, fb:'25 kroner, og hele beløbet går ubeskåret til CoolUnite. Spørg hver gæst.'},

{t:'quiz', chap:'Quiz', q:'Hvorfor hedder det nu "Oksemørbrad sandwich"?',
 opts:['Fordi kødet er skiftet ud',
       'Fordi navnet fortæller gæsten, hvad der er i',
       'Fordi den er blevet billigere'],
 ans:1, fb:'Samme kød som før — men navnet sælger. Sig "oksemørbrad" højt, det retfærdiggør prisen på 189,-.'},

{t:'done'}

/* ════════ MOTOR ════════ */
let i=0, score=0, answered={};
const stage=document.getElementById('stage');

const esc=s=>String(s??'');

function photo(c){
  const f=c.img||'';
  return `<div class="photo">
    ${f?`<img src="${IMG_DIR}/${f}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:''}
    <div class="ph" ${f?'style="display:none"':''}>
      <div class="ic">📷</div>
      ${f?`<div class="fn">${IMG_DIR}/${f}</div>`:''}
      <div class="hint">Læg dit billede i mappen «${IMG_DIR}» med præcis dette filnavn</div>
    </div>
    ${c.pill?`<div class="pill">${esc(c.pill)}</div>`:''}
    ${c.price?`<div class="prc">${esc(c.price)}</div>`:''}
  </div>`;
}

function render(c,idx){
  const d=document.createElement('div');
  d.className='card'; d.dataset.i=idx;

  if(c.t==='chapter'){
    d.innerHTML=`<div class="chapcard">
      <div class="no">${esc(c.no)}</div><h2>${esc(c.h)}</h2>
      <p>${esc(c.p)}</p><div class="mini">${esc(c.mini)}</div></div>`;
  }

  else if(c.t==='dish'){
    d.innerHTML=`<div class="sheet">${photo(c)}<div class="pad">
      <div class="dish">${esc(c.name)}</div>
      <div class="comp">${c.comp}</div>
      <div class="blk say"><div class="lbl">💬 Sådan siger du det</div><p>${esc(c.say)}</p></div>
      <div class="blk ask"><div class="lbl">❓ Hvis gæsten spørger</div><p>${c.ask}</p></div>
      <div class="blk tip"><div class="lbl">⭐ Husk</div><p>${esc(c.tip)}</p></div>
      <div class="blk alg"><div class="lbl">⚠️ Allergener</div><p>${c.alg}</p></div>
    </div></div>`;
  }

  else if(c.t==='info'){
    const rows=(c.rows||[]).map(r=>`<div class="rw"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('');
    const list=c.list?`<div class="blk ask" style="padding-top:11px"><div class="lbl">${esc(c.listTitle||'')}</div>
      <ul class="lst">${c.list.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'';
    d.innerHTML=`<div class="sheet"><div class="pad info">
      <div class="sub">${esc(c.sub)}</div><h2>${esc(c.h)}</h2>
      <div class="rows">${rows}</div>${list}
      <div class="blk say"><div class="lbl">💬 Sådan siger du det</div><p>${esc(c.say)}</p></div>
      <div class="blk tip"><div class="lbl">⭐ Husk</div><p>${esc(c.tip)}</p></div>
    </div></div>`;
  }

  else if(c.t==='quiz'){
    d.innerHTML=`<div class="sheet"><div class="pad quiz">
      <div class="q">${esc(c.q)}</div>
      <div class="opts">${c.opts.map((o,k)=>
        `<button class="opt" onclick="pick(${idx},${k},${c.ans})">${esc(o)}</button>`).join('')}</div>
      <div class="fb">${esc(c.fb)}</div>
    </div></div>`;
  }

  else if(c.t==='done'){
    d.innerHTML=`<div class="done">
      <div class="big">🎉</div><h2>Du er klar</h2>
      <p>Du kender nu hele Q4-kortet. Spring tilbage til en ret, hvis du bliver i tvivl under service.</p>
      <div class="score" id="sc"></div>
      <button onclick="restart()">Tag den igen</button></div>`;
  }

  return d;
}

function pick(idx,k,ans){
  if(answered[idx]) return;
  answered[idx]=true;
  const card=stage.querySelector(`[data-i="${idx}"]`);
  const btns=[...card.querySelectorAll('.opt')];
  btns.forEach(b=>b.style.pointerEvents='none');
  btns[k].classList.add(k===ans?'ok':'no');
  if(k!==ans) btns[ans].classList.add('ok'); else score++;
  card.querySelector('.fb').classList.add('show');
  document.getElementById('next').textContent='Videre';
}

function show(n){
  const cards=[...stage.children];
  cards.forEach(c=>{
    const ci=+c.dataset.i;
    c.classList.toggle('on',ci===n);
    c.classList.toggle('prev',ci<n);
    if(ci===n) c.scrollTop=0;
  });
  const c=CARDS[n];
  document.getElementById('chap').textContent=c.chap||'Færdig';
  document.getElementById('count').textContent=`${n+1}/${CARDS.length}`;
  document.getElementById('fill').style.width=((n+1)/CARDS.length*100)+'%';
  document.getElementById('back').disabled=(n===0);
  const nx=document.getElementById('next');
  if(c.t==='done'){
    nx.style.display='none';
    document.getElementById('sc').textContent=`Quiz: ${score} af 5 rigtige`;
  } else {
    nx.style.display='';
    nx.textContent = c.t==='chapter' ? 'Start' : (n===CARDS.length-2?'Se resultat':'Videre');
  }
}

function go(dir){
  const n=i+dir;
  if(n<0||n>=CARDS.length) return;
  i=n; show(i);
}

function begin(){ document.getElementById('start').classList.add('gone'); show(0); }

function restart(){
  i=0; score=0; answered={};
  stage.innerHTML=''; CARDS.forEach((c,k)=>stage.appendChild(render(c,k)));
  show(0);
}

function toggleMenu(){ document.getElementById('ov').classList.toggle('on'); }

function buildMenu(){
  const L=document.getElementById('ovList');
  L.innerHTML=CARDS.map((c,k)=>{
    if(c.t==='quiz'||c.t==='done') return '';
    const t = c.t==='chapter' ? c.h : (c.name||c.h);
    return `<div class="it" onclick="jump(${k})">
      <div class="n">${k+1}</div><div><div class="t">${esc(t)}</div>
      <div class="c">${esc(c.chap)}</div></div></div>`;
  }).join('') + `<div class="it" onclick="jump(${CARDS.findIndex(c=>c.t==='quiz')-1})">
      <div class="n">?</div><div><div class="t">Quiz</div><div class="c">5 spørgsmål</div></div></div>`;
}

function jump(n){ i=n; show(i); toggleMenu(); document.getElementById('start').classList.add('gone'); }

/* swipe */
let x0=null,y0=null;
stage.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
stage.addEventListener('touchend',e=>{
  if(x0===null) return;
  const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
  if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.6) go(dx<0?1:-1);
  x0=null;
},{passive:true});

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') go(1);
  if(e.key==='ArrowLeft') go(-1);
});

CARDS.forEach((c,k)=>stage.appendChild(render(c,k)));
buildMenu();
show(0);
</script>
