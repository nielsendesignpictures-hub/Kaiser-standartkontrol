<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaiser — Recipes</title>
<style>
  :root {
    --bg:        #f6f4ef;
    --card:      #ffffff;
    --border:    #e3ded4;
    --ink:       #26241f;
    --muted:     #8a857a;
    --gold:      #a8842c;
    --gold-bg:   #f5edd8;
    --green:     #3e7a4e;
    --green-bg:  #e8f2ea;
    --shadow:    0 1px 3px rgba(60,50,30,.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    min-height: 100vh;
  }

  .header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 20px 20px 0;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .header-row {
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -.02em;
    flex: 1;
  }
  .header h1 span { color: var(--gold); }
  .count-badge {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    white-space: nowrap;
  }

  .search-row {
    max-width: 1100px;
    margin: 14px auto 0;
  }
  .search-input {
    width: 100%;
    font-size: 17px;
    padding: 14px 18px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
    color: var(--ink);
    outline: none;
    transition: border-color .15s;
  }
  .search-input:focus { border-color: var(--gold); background: #fff; }
  .search-input::placeholder { color: var(--muted); }

  .tabs {
    max-width: 1100px;
    margin: 14px auto 0;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 14px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    font-size: 15px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 24px;
    border: 2px solid var(--border);
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s;
  }
  .tab:active { transform: scale(.97); }
  .tab.active {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }

  .list-wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
  }
  .cat-section { margin-bottom: 28px; }
  .cat-heading {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--gold);
    margin-bottom: 10px;
    padding-left: 4px;
  }
  .recipe-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 10px;
  }
  .recipe-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: var(--shadow);
    transition: transform .1s, border-color .15s;
  }
  .recipe-row:active { transform: scale(.99); }
  .recipe-row:hover { border-color: var(--gold); }
  .row-info { flex: 1; min-width: 0; }
  .row-name {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.01em;
  }
  .row-yield {
    font-size: 13px;
    color: var(--muted);
    margin-top: 1px;
  }
  .row-arrow {
    color: var(--gold);
    font-size: 20px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .empty {
    text-align: center;
    padding: 70px 20px;
    color: var(--muted);
  }
  .empty .big { font-size: 40px; margin-bottom: 10px; }

  .recipe-view {
    display: none;
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 20px 60px;
  }
  .recipe-view.open { display: block; }
  .list-view.hidden { display: none; }
  .header.hidden { display: none; }

  .rv-topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 0;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 40;
  }
  .rv-back {
    font-size: 16px;
    font-weight: 700;
    color: var(--ink);
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 12px 20px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .rv-back:hover { border-color: var(--gold); }
  .rv-cat {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--gold);
    background: var(--gold-bg);
    padding: 6px 14px;
    border-radius: 20px;
  }

  .rv-title {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -.03em;
    line-height: 1.15;
    margin: 10px 0 4px;
  }
  .rv-yield {
    font-size: 16px;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .rv-section-label {
    font-size: 14px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--ink);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .rv-section-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .ing-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 28px;
    overflow: hidden;
  }
  .ing-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    transition: background .1s;
  }
  .ing-item:last-child { border-bottom: none; }
  .ing-item:active { background: var(--bg); }
  .ing-check {
    width: 26px;
    height: 26px;
    border: 2px solid var(--border);
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: transparent;
    transition: all .15s;
  }
  .ing-item.done .ing-check {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .ing-amount {
    font-weight: 800;
    font-size: 16px;
    color: var(--gold);
    min-width: 84px;
    flex-shrink: 0;
  }
  .ing-name { font-size: 16px; }
  .ing-item.done .ing-name,
  .ing-item.done .ing-amount {
    text-decoration: line-through;
    opacity: .45;
  }

  .step-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    cursor: pointer;
    user-select: none;
    transition: border-color .15s, opacity .2s;
  }
  .step-card:active { transform: scale(.995); }
  .step-badge {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    font-size: 17px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .step-card.done { opacity: .5; }
  .step-card.done .step-badge { background: var(--green); }
  .step-card.done .step-badge::before { content: "✓"; }
  .step-card.done .step-badge span { display: none; }
  .step-text { flex: 1; }
  .step-title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -.01em;
    margin-bottom: 4px;
  }
  .step-desc {
    font-size: 16px;
    line-height: 1.65;
    color: #4a463e;
  }
  .step-card.done .step-title { text-decoration: line-through; }

  .rv-note {
    background: var(--gold-bg);
    border: 1px solid #e5d5a8;
    border-radius: 14px;
    padding: 18px 20px;
    margin-top: 20px;
    display: flex;
    gap: 12px;
    font-size: 15px;
    line-height: 1.6;
  }
  .rv-note .icon { font-size: 20px; flex-shrink: 0; }
  .rv-note strong { display: block; margin-bottom: 2px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--gold); }

  .rv-reset {
    display: block;
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    color: var(--muted);
    background: none;
    border: 2px dashed var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .rv-reset:hover { color: var(--ink); border-color: var(--muted); }

  @media (min-width: 700px) {
    .rv-title { font-size: 38px; }
  }
</style>
</head>
<body>

<header class="header" id="header">
  <div class="header-row">
    <h1><span>Kaiser</span> Recipes</h1>
    <span class="count-badge" id="countBadge"></span>
  </div>
  <div class="search-row">
    <input class="search-input" id="searchInput" type="text" placeholder="Search recipe or ingredient…">
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="all">All</button>
    <button class="tab" data-cat="dressing">Dressings</button>
    <button class="tab" data-cat="sauce">Sauces</button>
    <button class="tab" data-cat="pickled">Pickled</button>
    <button class="tab" data-cat="salad">Salads</button>
    <button class="tab" data-cat="misc">Misc</button>
  </div>
</header>

<main class="list-wrap list-view" id="listView"></main>

<section class="recipe-view" id="recipeView"></section>

<script>
// ════════════════════════════════════════════════════════════════
//  RECIPES — HOW TO ADD A NEW ONE (read this before editing!)
// ════════════════════════════════════════════════════════════════
//
//  The single most common way this breaks: ONE wrong bracket or
//  missing comma anywhere in this list makes ALL recipes disappear,
//  not just the broken one — because the whole RECIPES list has to
//  be valid, complete JavaScript before ANY of it can be shown.
//
//  Copy this exact shape for a new recipe, then just change the text:
//
//  {
//    id: 22,                          <- next free number, must be unique
//    name: "Recipe name",
//    category: "sauce",               <- must be exactly one of:
//                                         dressing | sauce | pickled | salad | misc
//                                         (lowercase — "Misc" or "Sauce" will NOT show up!)
//    yield: "",                       <- optional, can stay empty ""
//    ingredients: [
//      ["1 can", "condensed milk"],   <- ALWAYS two items: ["amount", "name"]
//      ["400 g", "coconut"],             use "" for amount if there isn't one, e.g. ["","salt to taste"]
//      ["", "chocolate, melted on top"]
//    ],
//    steps: [
//      ["Mix", "Mix milk and coconut together."],   <- ALWAYS two items: ["Step title", "What to do"]
//      ["Set", "Set it in serving glasses."],
//      ["Finish", "Pour melted chocolate on top and refrigerate."]
//    ],
//    note: ""                         <- optional, can stay empty ""
//  },
//
//  Checklist before saving:
//   1. Every ingredient is [amount, name] — TWO items, not one, not three.
//   2. Every step is [title, description] — TWO items.
//   3. category is lowercase and one of the five listed above.
//   4. There's a comma after every recipe block — a trailing comma
//      after the very last one is fine too, it won't break anything.
//   5. Count your [ and ] — if in doubt, copy the template above exactly
//      and only replace the text inside the quotes.
//
//  If recipes vanish after an edit: it's almost always a bracket/comma
//  mistake in the recipe you just added or edited. Check that one first.
// ════════════════════════════════════════════════════════════════
const RECIPES = [
  {
    id:1, name:"Lemon/dild mayo", category:"dressing", yield:"",
    ingredients:[["1,000 g","salad mayonnaise (plain mayo)"],["100 g","lemon paste"],["","Zest and juice of 3 lemons"],["to taste","Salt"],["to taste","Black pepper"],["100g","dry dild"]],
    steps:[
      ["Mix","Add the mayonnaise, lemon paste, and the zest and juice of the lemons to a large bowl, dry dild. Mix until completely smooth and evenly combined."],
      ["Season","Taste and adjust with salt and black pepper as needed."],
      ["Bottle and chill","Transfer to clean squeeze bottles or containers. Refrigerate before serving."]
    ],
    note:""
  },
  {
    id:2, name:"Remo", category:"dressing", yield:"",
    ingredients:[["500 g","pickles (about 1 tub/box), drained"],["500 g","mayonnaise"],["to taste","Salt"],["to taste","Black pepper"]],
    steps:[
      ["Blend the pickles","Drain the pickles well. Blend or finely chop until you get the texture you want (smooth or slightly chunky)."],
      ["Mix","In a bowl, combine the blended pickles with the mayonnaise. Mix until evenly combined."],
      ["Season","Taste and season with salt and black pepper as needed."],
      ["Chill","Cover and refrigerate for at least 30 minutes before serving for the best flavour."]
    ],
    note:""
  },
  {
    id:3, name:"1000 island ( Shooting star)", category:"dressing", yield:"",
    ingredients:[["750 g","ketchup"],["1,000 g","mayonnaise"],["10 g","dried paprika (paprika powder)"],["to taste","Salt"],["to taste","Black pepper"]],
    steps:[
      ["Add the ketchup, mayonnaise, and paprika to a large bowl.",""],
      ["Mix thoroughly until smooth and evenly combined.",""],
      ["Season with salt and black pepper to taste.",""],
      ["Cover and refrigerate for at least 30 minutes before serving (optional, but the flavour improves).",""]
    ],
    note:""
  },
  {
    id:4, name:"Curry mayo", category:"dressing", yield:"",
    ingredients:[["2","apples, peeled and cored, cut into small pieces"],["2","onions, finely chopped"],["125 g","butter"],["120 g","curry powder"],["1.3 kg","plain mayonnaise"],["","Cold water, as needed (for blending/consistency)"],["","Salt and black pepper, to taste (optional)"]],
    steps:[
      ["Cook the onion and apple","Melt the butter in a pan over medium heat. Add the chopped onions and apples. Cook, stirring often, until soft and tender (about 10--15 minutes). Avoid browning too much."],
      ["Toast the curry","Add the curry powder to the pan. Fry it briefly for 30--60 seconds, stirring constantly, to bring out a stronger flavour (don't let it burn)."],
      ["Blend into a paste","Transfer the hot mixture to a blender/food processor. Add a small splash of cold water (start with 2--4 tbsp) and blend until smooth. Add a little more water if needed to get a thick, smooth curry paste."],
      ["Cool","Let the curry paste cool to room temperature (so it doesn't melt or loosen the mayo too much)."],
      ["Mix with mayonnaise","In a large bowl, mix the cooled curry paste into the mayonnaise until evenly combined. Taste and adjust with salt and pepper if neede"]
    ],
    note:""
  },
  {
    id:5, name:"Sauce tatar", category:"sauce", yield:"",
    ingredients:[["1 kg","plain salad mayonnaise"],["200 g","crème fraîche"],["5 ml","lemon juice"],["150 g","fresh dill, finely chopped"],["100 g","fresh parsley, finely chopped"],["50 g","chives, finely chopped"],["100 g","red onion, finely chopped"],["150 g","cornichons, finely chopped"],["100 g","capers, chopped"],["100 g","mustard"],["to taste","Salt and black pepper"]],
    steps:[
      ["Prep","Finely chop the red onion, dill, parsley, chives, cornichons, and capers."],
      ["Mix the base","In a large bowl, whisk together the mayonnaise, crème fraîche, mustard, and lemon juice until smooth."],
      ["Combine","Stir in the chopped onion, herbs, cornichons, and capers. Mix until evenly distributed."],
      ["Season","Season with salt and black pepper to taste."],
      ["Chill","Cover and refrigerate for at least 30 minutes before serving to let the flavours blend."]
    ],
    note:""
  },
  {
    id:6, name:"Cæsar dressing", category:"dressing", yield:"",
    ingredients:[["350 ml","egg yolks (preferably pasteurized)"],["25 ml","apple cider vinegar"],["20 g","salt"],["45 g","capers (drained)"],["25 g","anchovy fillets"],["30 g","Parmesan, finely grated"],["10 g","garlic paste"],["2.6 liters","neutral oil (canola/rapeseed or sunflower)"],["","Cold water, as needed (to adjust thickness)"]],
    steps:[
      ["Start the base","Add the egg yolks, apple cider vinegar, and salt to a food processor/blender. Blend for 2--3 minutes until the mixture looks slightly thicker and smooth."],
      ["Add the flavorings","Add the anchovy fillets, capers, Parmesan, and garlic paste. Blend again for 2--3 minutes, scraping down the sides if needed, until the mixture is as smooth as you want."],
      ["Emulsify with oil","With the machine running, add the oil very slowly---drop by drop at first, then in a thin steady stream once the emulsion starts to thicken. Continue until all the oil is incorporated and the aioli is thick and glossy."],
      ["Adjust consistency","If it becomes too thick before you've added all the oil, blend in a small splash of cold water (1--2 tbsp at a time). Continue adding oil slowly until you reach the desired texture."],

    ],
    note:""
  },
  {
    id:7, name:"Chili mayo", category:"dressing", yield:"",
    ingredients:[["15 g","dried chili (soaked if very dry/hard)"],["55 g","jalapeños"],["300 ml","chili sauce (Sriracha)"],["350 ml","egg yolks"],["25 ml","apple cider vinegar"],["25 g","salt"],["2.6 L","neutral oil (e.g., rapeseed/canola or sunflower)"],["","Cold water, as needed (to adjust thickness)"]],
    steps:[
      ["Make the chili paste","Blend the dried chili, jalapeños, and Sriracha until smooth. Scrape down the sides as needed."],
      ["Start the emulsion","In a food processor (or blender), add the egg yolks, salt, and apple cider vinegar. Blend for 2--3 minutes until slightly thickened."],
      ["Add the chili mixture","Stop the machine and add the chili paste. Blend again until fully combined."],
      ["Slowly add the oil","With the machine running, drizzle in the oil very slowly at first to start the emulsion. Once it begins to thicken, you can add the oil in a slightly steadier stream, but keep it gradual."],
      ["Adjust if it gets too thick","If the aioli becomes too thick before all the oil is added, blend in a small splash of cold water (1--2 tbsp at a time) to loosen it. Continue adding the oil slowly until you reach the desired texture."],
      ["Finish and store","Taste and adjust seasoning if needed (more salt or vinegar). Transfer to clean containers and refrigerate."]
    ],
    note:""
  },
  {
    id:8, name:"Homemade pesto", category:"sauce", yield:"",
    ingredients:[["1 box","of basil"],["200g","parmesan"],["1 L","oli"],["20 g","garlic paste"]],
    steps:[
      ["Method","Remove the bottom of the basil. Add half of the oil to the bottom of the blender. Add all the basil ( Yes it can be there all 1kg ). Start the blender. When it's all blended, add the parmesan and the rest of the oil. Add a bit black pepper as well."]
    ],
    note:""
  },
  {
    id:9, name:"Garlic mayo", category:"dressing", yield:"",
    ingredients:[["350ML","Egg yolk"],["25ML","apple vinegar"],["25g","Salt"],["60g","of garlic paste"],["15g","of dry parsley"],["2,6 liter","oli"]],
    steps:[
      ["Method","Take the robot. Add egg yolk, salt and apple vinegar. Let it run 2-3 min. After add the garlic paste, and start it again. Slowly pull the olie in blender, if its get to think. add little of water and start add the olie again. When the blender is half full, add the dry parsley and continue with the olie."]
    ],
    note:""
  },
  {
    id:10, name:"Pepper sauce", category:"sauce", yield:"",
    ingredients:[["1 liter","brown sauce from bc"],["80g","Pepper paste"]],
    steps:[
      ["Method","Heat the brownsauce up, add the pepper paste."]
    ],
    note:""
  },
  {
    id:11, name:"Parsley sauce", category:"sauce", yield:"",
    ingredients:[["6 liter","of milk"],["250 g","pork fat"],["350 g","flour"],["50 g","salt"],["10 g","muscat nut"]],
    steps:[
      ["Method","Start heating up the milk on a slow heat so the milk doesn't burn. Take another pot and start melting the fat. Add the flour. As soon as the milk is hot, add the flour mix into the pot. Be patient, it will get thick, but it takes time! Add the salt and muscat nuts. As soon is have the right consistency, take it off, and split it out in multi containers so it cooling down faster."]
    ],
    note:""
  },
  {
    id:12, name:"Pickled cucumbers", category:"pickled", yield:"",

    steps:[
      ["Make the brine","Add water, vinegar, sugar, peppercorns, and bay leaves to a pot. Bring to a boil and stir until the sugar is completely dissolved."],
      ["Cool the brine","Remove from the heat and let the brine cool down completely. It must be cold before you pour it over the cucumber (you can refrigerate it to speed this up)."],

      ["Salt and drain","Toss the cucumber slices with the salt and leave for 1 hour to draw out excess water."],
      ["Rinse and dry","Drain off the liquid, rinse the cucumber slices briefly in cold water, and let them drain well. Pat dry with a clean towel or paper towels."],
      ["Add brine","Put the cucumber slices in a clean jar/container and pour the cold brine over until covered."],
      ["Refrigerate","Store in the fridge. Good after a few hours, even better the next day."]

    note:""

  {
    id:13, name:"Tuna mouse", category:"salad", yield:"",
    ingredients:[["4 bags","tuna (drained well)"],["2 whole","bunches fresh dill, finely chopped"],["250 g","capers, chopped"],["1 kg","mayonnaise"],["250 g","crème fraîche"],["250 g","red onions, finely chopped"],["","Zest and juice of 3 lemons"],["100 g","mustard"],["60 g","salt"],["to taste","Black pepper"]],
    steps:[
      ["Prep the ingredients","Drain the tuna well. Finely chop the red onion, capers, and dill. Zest the lemons, then squeeze the juice."],
      ["Mix the dressing","In a very large bowl, whisk together the mayonnaise, crème fraîche, mustard, lemon zest, and lemon juice."],
      ["Combine","Add the tuna, red onion, capers, and dill to the bowl. Mix until everything is evenly combined."],
      ["Season","Stir in the salt and add black pepper to taste. Taste and adjust lemon, mustard, salt, or pepper if needed."]
    ],
    note:""
  },
  {
    id:14, name:"Chicken salad", category:"salad", yield:"",
    ingredients:[["5 kg","chicken breasts (about 2 large packs)"],["1","onion, roughly chopped (for the cooking water)"],["","4--5 bay leaves"],["1","small handful whole black peppercorns"],["2 packs","mushrooms, sliced (fresh or canned, drained)"],["","1--2 onions, finely diced (for frying)"],["300 ml","\"Stegt Smag\" (roast-flavour concentrate/gravy base)"],["","Mayonnaise, as needed (start with 500--800 g and adjust)"],["100 g","mustard"],["","Salt, to taste (optional, but recommended)"]],
    steps:[

const CAT_LABELS = { dressing:"Dressings", sauce:"Sauces", pickled:"Pickled", salad:"Salads", misc:"Misc" };
const CAT_ORDER  = ["dressing","sauce","pickled","salad","misc"];

let activeCat = "all";
let query = "";

function matches(r) {
  const q = query.toLowerCase();
  if (activeCat !== "all" && r.category !== activeCat) return false;
  if (!q) return true;
  return r.name.toLowerCase().includes(q) ||
         r.ingredients.some(i => i[1].toLowerCase().includes(q));
}

function renderList() {
  const view = document.getElementById("listView");
  const hits = RECIPES.filter(matches);
  document.getElementById("countBadge").textContent = RECIPES.length + " recipes";

  if (!hits.length) {
    view.innerHTML = `<div class="empty"><div class="big">🔍</div>No recipes found.</div>`;
    return;
  }

  let html = "";
  for (const cat of CAT_ORDER) {
    const group = hits.filter(r => r.category === cat);
    if (!group.length) continue;
    html += `<div class="cat-section">
      <div class="cat-heading">${CAT_LABELS[cat]}</div>
      <div class="recipe-list">
        ${group.map(r => `
          <div class="recipe-row" data-id="${r.id}">
            <div class="row-info">
              <div class="row-name">${r.name}</div>
              <div class="row-yield">${r.yield}</div>
            </div>
            <span class="row-arrow">→</span>
          </div>`).join("")}
      </div>
    </div>`;
  }
  view.innerHTML = html;

  view.querySelectorAll(".recipe-row").forEach(row =>
    row.addEventListener("click", () => openRecipe(+row.dataset.id)));
}

function openRecipe(id) {
  const r = RECIPES.find(x => x.id === id);
  if (!r) return;

  const rv = document.getElementById("recipeView");

  rv.innerHTML = `
    <div class="rv-topbar">
      <button class="rv-back" id="backBtn">← All recipes</button>
      <span class="rv-cat">${CAT_LABELS[r.category].replace(/s$/,"")}</span>
    </div>

    <h2 class="rv-title">${r.name}</h2>
    <div class="rv-yield">${r.yield}</div>

    <div class="rv-section-label">Ingredients — tap to check off</div>
    <div class="ing-card">
      ${r.ingredients.map(i => `
        <div class="ing-item">
          <span class="ing-check">✓</span>
          <span class="ing-amount">${i[0]}</span>
          <span class="ing-name">${i[1]}</span>
        </div>`).join("")}
    </div>

    <div class="rv-section-label">Method — tap when done</div>
    ${r.steps.map((s, i) => `
      <div class="step-card">
        <div class="step-badge"><span>${i+1}</span></div>
        <div class="step-text">
          <div class="step-title">${s[0]}</div>
          <div class="step-desc">${s[1]}</div>
        </div>
      </div>`).join("")}

    ${r.note ? `
      <div class="rv-note">
        <span class="icon">⚠️</span>
        <div><strong>Important</strong>${r.note}</div>
      </div>` : ""}

    <button class="rv-reset" id="resetBtn">↺ Reset checkmarks</button>
  `;

  rv.querySelectorAll(".ing-item").forEach(el =>
    el.addEventListener("click", () => el.classList.toggle("done")));
  rv.querySelectorAll(".step-card").forEach(el =>
    el.addEventListener("click", () => el.classList.toggle("done")));

  document.getElementById("resetBtn").addEventListener("click", () => {
    rv.querySelectorAll(".done").forEach(el => el.classList.remove("done"));
  });

  document.getElementById("backBtn").addEventListener("click", closeRecipe);

  document.getElementById("listView").classList.add("hidden");
  document.getElementById("header").classList.add("hidden");
  rv.classList.add("open");
  window.scrollTo(0, 0);
}

function closeRecipe() {
  document.getElementById("recipeView").classList.remove("open");
  document.getElementById("listView").classList.remove("hidden");
  document.getElementById("header").classList.remove("hidden");
  window.scrollTo(0, 0);
}

document.getElementById("tabs").addEventListener("click", e => {
  const btn = e.target.closest(".tab");
  if (!btn) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  activeCat = btn.dataset.cat;
  renderList();
});

document.getElementById("searchInput").addEventListener("input", e => {
  query = e.target.value;
  renderList();
});

renderList();
</script>
